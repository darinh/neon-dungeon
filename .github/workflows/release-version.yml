name: release-version

on:
  push:
    branches: [main]

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "${{ github.actor != 'github-actions[bot]' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release bump
        id: bump
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$MSG" | head -n 1)
          if printf '%s' "$subject" | grep -qE '^[A-Za-z]+(\(.+\))?!:' || printf '%s' "$MSG" | grep -qE '^BREAKING CHANGE:'; then
            echo "kind=major" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$subject" | grep -qE '^feat(\(.+\))?:'; then
            echo "kind=minor" >> "$GITHUB_OUTPUT"
          else
            echo "kind=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release version
        id: version
        env:
          KIND: ${{ steps.bump.outputs.kind }}
        run: |
          set -euo pipefail
          existing_tag=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -n "$existing_tag" ]; then
            echo "main commit $GITHUB_SHA is already released as $existing_tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$latest_tag" ]; then
            major=0
            minor=0
            patch=0
          else
            version=${latest_tag#v}
            IFS=. read -r major minor patch <<< "$version"
          fi

          case "$KIND" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "::error::unknown release bump kind: $KIND"
              exit 1
              ;;
          esac

          next="${major}.${minor}.${patch}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: "${{ steps.version.outputs.skip != 'true' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.bump.outputs.kind }}
        run: |
          set -euo pipefail
          BODY=$(printf 'Automated %s release for main commit %s.' "$KIND" "$GITHUB_SHA")
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "NEON DUNGEON v${VERSION}" \
            --notes "$BODY"

name: test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    # Runs the same gate as the documented pre-commit `npm run check`:
    # eslint + tsc --noEmit + engine-purity + node --test. CI used to run
    # `npm test` only, which let lint/typecheck/engine-purity regressions
    # slip through whenever a contributor skipped the pre-commit gate.
    # Aligning CI with the documented gate closes that hole.
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev deps (eslint + typescript)
        run: npm ci
      - name: Run check (lint + typecheck + engine-purity + tests)
        run: npm run check

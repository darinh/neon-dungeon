<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192x192.png">
<title>NEON DUNGEON</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #0a0a12; overflow: hidden; width: 100vw; height: 100vh; user-select: none; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Constants ───────────────────────────────────────────────────────────────
let W = 900, H = 600;
let gameScale = 1;
const TILE = 20;
const MAP_W = 80, MAP_H = 50;
const TWO_PI = Math.PI * 2;
const SAVE_VERSION = '7.0';

const T = { VOID:0, WALL:1, FLOOR:2, STAIRS:3, TERMINAL:4, DOOR:5, DOOR_OPEN:6, LOCKED_R:7, LOCKED_B:8, LOCKED_G:9, TRAP_SPIKE:10, TRAP_SLOW:11, PLASMA:12, ARC:13, VENDOR:14, CRACKED:15, LORE:16 };

// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// Safe-area insets (logical px) for notched devices
let safeTop = 0, safeRight = 0, safeBottom = 0, safeLeft = 0;

let scale = 1, offX = 0, offY = 0;
function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // Scale: smaller viewport dimension maps to ~600 logical px
  // Tiles (20 logical px) appear as 20 × gameScale CSS px on screen
  // Clamped so tiles stay between ~14 CSS px (0.7) and ~30 CSS px (1.5)
  gameScale = clamp(Math.min(vw, vh) / 600, 0.7, 1.5);
  W = Math.round(vw / gameScale);
  H = Math.round(vh / gameScale);
  canvas.width = W;
  canvas.height = H;
  scale = gameScale;
  offX = 0;
  offY = 0;
  // Read safe-area insets from CSS env() and convert to logical px
  const cs = getComputedStyle(document.documentElement);
  safeTop    = (parseFloat(cs.getPropertyValue('--sat')) || 0) / gameScale;
  safeRight  = (parseFloat(cs.getPropertyValue('--sar')) || 0) / gameScale;
  safeBottom = (parseFloat(cs.getPropertyValue('--sab')) || 0) / gameScale;
  safeLeft   = (parseFloat(cs.getPropertyValue('--sal')) || 0) / gameScale;
  updateLayout();
  console.log(`[NEON DUNGEON] ${vw}×${vh} → ${W}×${H} (×${gameScale.toFixed(2)}) tile=${(TILE*gameScale).toFixed(1)}css-px compact=${layout.compact}`);
}
// resize() + event listener registered in Boot section (after all defs are ready)

// ─── Layout (shared HUD / bottom-UI metrics) ────────────────────────────────
const layout = { compact: false, hudH: 40, hudTop: 0, msgBase: 0 };
function updateLayout() {
  layout.compact = H > W && W <= 600;
  layout.hudH    = layout.compact ? 58 : 40;
  layout.hudTop  = H - layout.hudH - safeBottom;
  layout.msgBase = layout.hudTop - 12;
}

// ─── Fullscreen (landscape auto-request, portrait auto-exit) ─────────────────
const fsApi = {
  request: canvas.requestFullscreen ? 'requestFullscreen'
         : canvas.webkitRequestFullscreen ? 'webkitRequestFullscreen' : null,
  exit: document.exitFullscreen ? 'exitFullscreen'
      : document.webkitExitFullscreen ? 'webkitExitFullscreen' : null,
  element: () => document.fullscreenElement ?? document.webkitFullscreenElement,
  supported: !!(canvas.requestFullscreen || canvas.webkitRequestFullscreen),
};
let fsWantLandscape = false;   // true when landscape but no gesture yet
let fsDismissed = false;       // user tapped X to dismiss the prompt this session

function isLandscape() {
  if (screen.orientation) return screen.orientation.type.startsWith('landscape');
  return window.innerWidth > window.innerHeight;
}

function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function tryFullscreen() {
  if (!fsApi.supported || fsApi.element()) return;
  try {
    const ret = document.documentElement[fsApi.request]?.();
    if (ret && typeof ret.catch === 'function') ret.catch(() => {});
  } catch (_) {}
}

function exitFullscreen() {
  if (!fsApi.element()) return;
  try {
    const ret = document[fsApi.exit]?.();
    if (ret && typeof ret.catch === 'function') ret.catch(() => {});
  } catch (_) {}
}

let fsWasLandscape = false;
function onOrientationChange() {
  if (!isTouchDevice()) return;
  const landscape = isLandscape();
  if (landscape) {
    fsWantLandscape = true;
    // only reset dismiss on actual portrait→landscape transition
    if (!fsWasLandscape) fsDismissed = false;
  } else {
    fsWantLandscape = false;
    exitFullscreen();
  }
  fsWasLandscape = landscape;
}

if (screen.orientation) {
  screen.orientation.addEventListener('change', onOrientationChange);
} else {
  window.addEventListener('orientationchange', onOrientationChange);
}
// also recheck on resize (some browsers fire resize instead of orientationchange)
window.addEventListener('resize', onOrientationChange);
// set initial state
onOrientationChange();

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = new Set();
const mouse = { x: W/2, y: H/2, down: false };
let justPressed = new Set();
let justReleased = new Set();
let lastKey = '';
let nameEntryTap = null;

window.addEventListener('keydown', e => {
  if (!keys.has(e.code)) justPressed.add(e.code);
  keys.add(e.code);
  lastKey = e.key;
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys.delete(e.code);
  justReleased.add(e.code);
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * canvas.width / r.width;
  mouse.y = (e.clientY - r.top)  * canvas.height / r.height;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; justPressed.add('MouseLeft'); audio.resume(); });
canvas.addEventListener('mouseup',   e => { mouse.down = false; });

// ─── Touch Controls ──────────────────────────────────────────────────────────
const JR = 55; // joystick base radius
const touch = {
  joystick: { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0 },
  aim:      { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, shooting:false },
  // button touch IDs
  btnE: null, btnV: null, btnPause: null,
};

// Button definitions — positions updated dynamically by updateBtns()
const BTNS = {
  E:     { x:0, y:0, r:30, label:'E',  colour:'#00f5ff' },
  V:     { x:0, y:0, r:28, label:'V',  colour:'#aa00ff' },
  PAUSE: { x:0, y:0, r:20, label:'II', colour:'#ff00c8' },
};
function updateBtns() {
  // Scale up buttons on small screens (min ~44 CSS px diameter)
  const minR = 22 / gameScale;
  BTNS.E.r     = Math.max(30, minR);
  BTNS.V.r     = Math.max(28, minR);
  BTNS.PAUSE.r = Math.max(20, Math.ceil(minR * 0.7));
  // Position from edges, respecting safe-area insets
  const pr = Math.max(10, safeRight);
  const pb = Math.max(10, safeBottom);
  const pt = Math.max(10, safeTop);
  const btnY = layout.hudTop - BTNS.E.r - 16;
  BTNS.E.x     = W - pr - 160;
  BTNS.E.y     = btnY;
  BTNS.V.x     = W - pr - 90;
  BTNS.V.y     = btnY;
  BTNS.PAUSE.x = W - pr - 30;
  BTNS.PAUSE.y = pt + 30;
}

function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX - r.left) * canvas.width / r.width,
          (clientY - r.top)  * canvas.height / r.height];
}

function hitBtn(cx, cy, btn) {
  const dx=cx-btn.x, dy=cy-btn.y;
  // Expand hit area on small screens to meet minimum touch target
  const hitR = Math.max(btn.r, 22 / gameScale);
  return dx*dx+dy*dy <= hitR*hitR;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  audio.resume();
  // check if any touch hit the fullscreen dismiss button first
  let dismissed = false;
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    if (fsWantLandscape && !fsApi.element() && !fsDismissed
        && cx < 48 && cy < 48) {
      fsDismissed = true; dismissed = true;
    }
  }
  // piggyback on user gesture: request fullscreen if landscape wants it
  if (!dismissed && fsWantLandscape && !fsApi.element() && !fsDismissed) tryFullscreen();
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    // skip the dismiss touch (already handled above)
    if (cx < 48 && cy < 48 && dismissed) continue;
    // In non-playing states, any touch acts as confirm (except NAME_ENTRY, POWERUP_CHOICE)
    if (game.state !== 'PLAYING' && game.state !== 'FADE') {
      if (game.state === 'NAME_ENTRY') { nameEntryTap=[cx,cy]; continue; }
      if (game.state === 'POWERUP_CHOICE' || game.state === 'SHOPPING') {
        // Route touch position via mouse so update handler handles it
        mouse.x = cx; mouse.y = cy;
        justPressed.add('MouseLeft');
        continue;
      }
      if (game.state === 'PAUSED') {
        if (cy > H/2) justPressed.add('KeyQ');
        else justPressed.add('Escape');
      }
      else if (game.state === 'MENU') {
        // Hit-test against actual menu item positions
        const narrow = layout.compact;
        const titleFs = narrow ? 48 : 72;
        const ty1 = narrow ? 120 : 160;
        const startY = ty1 + titleFs * 0.95 + 80;
        const gap = narrow ? 24 : 28;
        const opts = game.getMenuOptions();
        // Find closest option
        let best = 0, bestDist = Infinity;
        for (let i = 0; i < opts.length; i++) {
          const oy = startY + i * gap;
          const d = Math.abs(cy - oy);
          if (d < bestDist) { bestDist = d; best = i; }
        }
        game.menuSel = best;
        // On the difficulty row, left/right edge taps cycle, center taps start
        if (opts[best]?.isDiffRow && Math.abs(cy - (startY + best * gap)) < gap * 0.7) {
          if (cx < W * 0.35) justPressed.add('ArrowLeft');
          else if (cx > W * 0.65) justPressed.add('ArrowRight');
          else justPressed.add('Enter');
        } else {
          justPressed.add('Enter');
        }
      }
      else if (game.state === 'ARCHIVES') {
        // Hit-test against upgrade rows or back button
        const narrow = layout.compact;
        const startY = narrow ? 95 : 120;
        const rowH = narrow ? 42 : 50;
        if (cy > H - 60) {
          // Back button area
          justPressed.add('Escape');
        } else {
          // Find closest upgrade row
          let best = 0, bestDist = Infinity;
          for (let i = 0; i < META_UPGRADES.length; i++) {
            const oy = startY + i * rowH;
            const d = Math.abs(cy - oy);
            if (d < bestDist) { bestDist = d; best = i; }
          }
          game.archivesSel = best;
          justPressed.add('Enter');
        }
      }
      else { justPressed.add('Enter'); justPressed.add('MouseLeft'); }
      continue;
    }
    // button priority
    if (hitBtn(cx,cy,BTNS.E))     { touch.btnE=t.identifier; justPressed.add('KeyE'); continue; }
    if (hitBtn(cx,cy,BTNS.V))     { touch.btnV=t.identifier; justPressed.add('KeyV'); continue; }
    if (hitBtn(cx,cy,BTNS.PAUSE)) { touch.btnPause=t.identifier; justPressed.add('Escape'); continue; }
    // left half = joystick
    if (cx < W/2 && !touch.joystick.active) {
      touch.joystick.active=true; touch.joystick.id=t.identifier;
      touch.joystick.baseX=cx;   touch.joystick.baseY=cy;
      touch.joystick.dx=0;       touch.joystick.dy=0;
    } else if (cx >= W/2 && !touch.aim.active) {
      touch.aim.active=true; touch.aim.id=t.identifier;
      touch.aim.baseX=cx; touch.aim.baseY=cy;
      touch.aim.dx=0; touch.aim.dy=0; touch.aim.shooting=true;
      // Initialise mouse position so first shot aims toward the tap
      mouse.x=cx; mouse.y=cy;
      justPressed.add('MouseLeft');
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    if (t.identifier === touch.joystick.id) {
      let dx=cx-touch.joystick.baseX, dy=cy-touch.joystick.baseY;
      const len=Math.sqrt(dx*dx+dy*dy);
      if (len>JR) { dx=dx/len*JR; dy=dy/len*JR; }
      touch.joystick.dx=dx/JR; touch.joystick.dy=dy/JR;
    }
    if (t.identifier === touch.aim.id) {
      let adx=cx-touch.aim.baseX, ady=cy-touch.aim.baseY;
      const alen=Math.sqrt(adx*adx+ady*ady);
      if (alen>JR) { adx=adx/alen*JR; ady=ady/alen*JR; }
      touch.aim.dx=adx/JR; touch.aim.dy=ady/JR;
      touch.aim.shooting=true;
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier===touch.joystick.id) { touch.joystick.active=false; touch.joystick.dx=0; touch.joystick.dy=0; }
    if (t.identifier===touch.aim.id)      { touch.aim.active=false; touch.aim.shooting=false; touch.aim.dx=0; touch.aim.dy=0; mouse.down=false; }
    if (t.identifier===touch.btnE)   touch.btnE=null;
    if (t.identifier===touch.btnV)   touch.btnV=null;
    if (t.identifier===touch.btnPause) touch.btnPause=null;
  }
}, {passive:false});

canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  resetTouch();
}, {passive:false});

function resetTouch() {
  touch.joystick.active=false; touch.joystick.id=null; touch.joystick.dx=0; touch.joystick.dy=0;
  touch.aim.active=false; touch.aim.id=null; touch.aim.dx=0; touch.aim.dy=0; touch.aim.shooting=false;
  touch.btnE=null; touch.btnV=null; touch.btnPause=null;
  mouse.down=false;
}

function drawTouchUI() {
  // Left joystick (move)
  if (touch.joystick.active) {
    const {baseX:bx,baseY:by,dx,dy}=touch.joystick;
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#00f5ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,JR,0,TWO_PI); ctx.stroke();
    ctx.fillStyle='#00f5ff';
    ctx.beginPath(); ctx.arc(bx+dx*JR,by+dy*JR,18,0,TWO_PI); ctx.fill();
    ctx.restore();
  } else {
    // ghost move joystick hint
    const hintY = layout.hudTop - 26;
    ctx.save(); ctx.globalAlpha=0.12;
    ctx.strokeStyle='#00f5ff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(80, hintY, JR, 0, TWO_PI); ctx.stroke();
    ctx.fillStyle='#00f5ff';
    ctx.beginPath(); ctx.arc(80, hintY, 18, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // Right joystick (aim)
  if (touch.aim.active) {
    const {baseX:bx,baseY:by,dx,dy}=touch.aim;
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#ff00c8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,JR,0,TWO_PI); ctx.stroke();
    ctx.fillStyle='#ff00c8';
    ctx.beginPath(); ctx.arc(bx+dx*JR,by+dy*JR,18,0,TWO_PI); ctx.fill();
    ctx.restore();
  } else {
    // ghost aim joystick hint
    const hintY = layout.hudTop - 26;
    ctx.save(); ctx.globalAlpha=0.12;
    ctx.strokeStyle='#ff00c8'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(W/2+80, hintY, JR, 0, TWO_PI); ctx.stroke();
    ctx.fillStyle='#ff00c8';
    ctx.beginPath(); ctx.arc(W/2+80, hintY, 18, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // Buttons
  for (const [key,btn] of Object.entries(BTNS)) {
    const active = (key==='E'&&touch.btnE!==null)||(key==='V'&&touch.btnV!==null)||(key==='PAUSE'&&touch.btnPause!==null);
    ctx.save();
    ctx.globalAlpha = active ? 0.9 : 0.45;
    ctx.shadowBlur=10; ctx.shadowColor=btn.colour;
    ctx.strokeStyle=btn.colour; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r,0,TWO_PI); ctx.stroke();
    ctx.fillStyle=btn.colour+'33';
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r,0,TWO_PI); ctx.fill();
    ctx.fillStyle=btn.colour; ctx.font=`bold ${key==='PAUSE'?11:14}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(btn.label,btn.x,btn.y);
    ctx.restore();
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // Fullscreen prompt (landscape, not fullscreen, not dismissed, API available)
  if (fsWantLandscape && !fsApi.element() && !fsDismissed && fsApi.supported) {
    ctx.save();
    ctx.globalAlpha = 0.7;
    // pill background
    const pw = 180, ph = 32, px = (W - pw) / 2, py = 6;
    ctx.fillStyle = '#0a0a12';
    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(px, py, pw, ph);
    ctx.fill(); ctx.stroke();
    // text
    ctx.fillStyle = '#00f5ff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TAP FOR FULLSCREEN', W / 2, py + ph / 2);
    // dismiss X button (top-left corner)
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ff00c8';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', 24, 22);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function jp(code) { return justPressed.has(code); }
function clearJust() { justPressed.clear(); justReleased.clear(); lastKey=''; nameEntryTap=null; }

// ─── Utilities ───────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function dist(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function dist2(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function norm(dx, dy) { const l=Math.sqrt(dx*dx+dy*dy)||1; return [dx/l, dy/l]; }
function lerp(a, b, t) { return a + (b-a)*t; }
function clampToBossRoom(entity) {
  if (!game.bossSealed || !game.bossRoom) return;
  const r = game.bossRoom;
  entity.x = Math.max(r.x + 0.5, Math.min(r.x + r.w - 0.5, entity.x));
  entity.y = Math.max(r.y + 0.5, Math.min(r.y + r.h - 0.5, entity.y));
}

function hasLOS(x1, y1, x2, y2, map) {
  let dx = Math.abs(x2-x1), dy = Math.abs(y2-y1);
  let sx = x1<x2?1:-1, sy = y1<y2?1:-1;
  let err = dx - dy;
  let cx = Math.floor(x1), cy = Math.floor(y1);
  const ex = Math.floor(x2), ey = Math.floor(y2);
  for (let i=0; i<100; i++) {
    if (cx===ex && cy===ey) return true;
    if (cx<0||cy<0||cx>=MAP_W||cy>=MAP_H) return false;
    if (!isSeeThrough(map[cy][cx])) return false;
    const e2 = 2*err;
    if (e2 > -dy) { err -= dy; cx += sx; }
    if (e2 <  dx) { err += dx; cy += sy; }
  }
  return true;
}

// Tile helpers
function isPassable(t) { return t===T.FLOOR||t===T.STAIRS||t===T.TERMINAL||t===T.DOOR_OPEN||t===T.TRAP_SPIKE||t===T.TRAP_SLOW||t===T.PLASMA||t===T.ARC||t===T.VENDOR||t===T.LORE; }
function isSeeThrough(t) { return t!==T.WALL && t!==T.VOID && t!==T.CRACKED; }
function isDoor(t) { return t===T.DOOR||t===T.LOCKED_R||t===T.LOCKED_B||t===T.LOCKED_G; }
function doorKeyColour(t) { return t===T.LOCKED_R?'red':t===T.LOCKED_B?'blue':t===T.LOCKED_G?'gold':null; }

// ─── Audio Engine ────────────────────────────────────────────────────────────
const audio = (() => {
  let actx = null, master = null, compressor = null, reverbNode = null,
      reverbGain = null, noiseBuf = null;

  function getCtx() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // Master bus: compressor → destination
      compressor = actx.createDynamicsCompressor();
      compressor.threshold.value = -12;
      compressor.ratio.value = 4;
      compressor.connect(actx.destination);
      master = actx.createGain();
      master.gain.value = 0.7;
      master.connect(compressor);
      // Reverb bus: ConvolverNode with procedural impulse response
      reverbNode = actx.createConvolver();
      const irLen = actx.sampleRate * 1.6;
      const irBuf = actx.createBuffer(2, irLen, actx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = irBuf.getChannelData(ch);
        for (let i = 0; i < irLen; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.5);
        }
      }
      reverbNode.buffer = irBuf;
      reverbGain = actx.createGain();
      reverbGain.gain.value = 0.35;
      reverbNode.connect(reverbGain);
      reverbGain.connect(master);
      // Cached noise buffer (2 seconds, reused by all noise calls)
      const nLen = actx.sampleRate * 2;
      noiseBuf = actx.createBuffer(1, nLen, actx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
    }
    return actx;
  }

  function resume() { const c = getCtx(); if (c.state === 'suspended') c.resume(); }

  // Core voice: oscillator → gain → target node
  function osc(type, freq1, freq2, vol, start, dur, target) {
    const c = getCtx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq1, start);
    if (freq2 !== freq1) o.frequency.exponentialRampToValueAtTime(Math.max(freq2, 1), start + dur);
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g); g.connect(target || master);
    o.start(start); o.stop(start + dur + 0.02);
  }

  // Noise burst from cached buffer
  function noise(vol, start, dur, filterFreq, target) {
    const c = getCtx();
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = filterFreq || 800;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    src.connect(flt); flt.connect(g); g.connect(target || master);
    src.start(start); src.stop(start + dur + 0.02);
  }

  // Reverb send helper — routes signal to both dry and wet buses
  // lifetime: seconds until all voices through this bus have finished (excludes reverb tail)
  function wetDry(vol, wetAmt, lifetime) {
    const c = getCtx();
    const split = c.createGain();
    split.gain.value = vol;
    const dry = c.createGain();
    dry.gain.value = 1;
    const wet = c.createGain();
    wet.gain.value = wetAmt;
    split.connect(dry); dry.connect(master);
    split.connect(wet); wet.connect(reverbNode);
    // Schedule cleanup after voices + reverb tail finish
    const cleanup = () => { split.disconnect(); dry.disconnect(); wet.disconnect(); };
    setTimeout(cleanup, (lifetime + 2.0) * 1000);
    return split;
  }

      const n = weapon && weapon.name;

        }
      } else if (n === 'Railgun') {

        noise(0.12, t + 0.06, 0.04, 8000, bus);
        osc('sine',     2400, 800,  0.10, t + 0.06, 0.25, bus);
      } else if (n === 'Plasma Sword') {
        // Energized melee whoosh: fast sweep + harmonics

        osc('triangle', 1200, 300, 0.06, t, 0.08);
        noise(0.06, t, 0.04, 3000);
      } else if (n === 'Void Cannon') {
        // Deep resonant thump + sub pulse + distortion edge

        osc('sine',     80,  35, 0.18, t, 0.25, bus);
        osc('sawtooth', 160, 60, 0.08, t, 0.18, bus);
        osc('square',   320, 80, 0.05, t, 0.12, bus);
        noise(0.06, t, 0.06, 500, bus);

const DIFF_ORDER = ['EASY','NORMAL','HARD'];
function getDiff() { return DIFFICULTIES[game.difficulty] || DIFFICULTIES.NORMAL; }

function modSpeed(base) { return game.modifier === 'OVERCLOCK' ? base * 1.2 : base; }

// ─── Meta-Progression (persistent across runs) ──────────────────────────────
const META_UPGRADES = [
  { id:'VITAL_BOOST',   name:'Vital Systems',    desc:'+10 max HP',          maxLv:3, costs:[5,12,22],  icon:'♥' },
  { id:'SCAVENGER',     name:'Scavenger Protocol',desc:'+15% credit gain',   maxLv:3, costs:[5,12,22],  icon:'◈' },
  { id:'QUICK_LEARNER', name:'Quick Learner',     desc:'+15% XP gain',       maxLv:3, costs:[5,12,22],  icon:'★' },
  { id:'ARMOR_PLATING', name:'Armor Plating',     desc:'+1 starting DEF',    maxLv:3, costs:[8,18,30],  icon:'▣' },
  { id:'STARTING_GEAR', name:'Weapon Cache',      desc:'Start with upgraded weapon', maxLv:1, costs:[25], icon:'⚔' },
  { id:'PERSISTENCE',   name:'Data Persistence',  desc:'+3 fragments per run',maxLv:2, costs:[12,25],   icon:'◆' },
];

function loadMeta() {
  try {
    const raw = localStorage.getItem('neonDungeonMeta');
    if (!raw) return { shards:0, upgrades:{}, stats:{ totalRuns:0, totalShards:0, bestFloor:0, victories:0 }, lastDifficulty:'NORMAL' };
    const m = JSON.parse(raw);
    if (!m.stats) m.stats = { totalRuns:0, totalShards:0, bestFloor:0, victories:0 };
    if (!m.upgrades) m.upgrades = {};
    m.shards = Math.max(0, Math.floor(Number(m.shards) || 0));
    // Clamp upgrade levels to valid ranges
    for (const u of META_UPGRADES) {
      if (u.id in m.upgrades) {
        m.upgrades[u.id] = Math.max(0, Math.min(u.maxLv, Math.floor(Number(m.upgrades[u.id]) || 0)));
      }
    }
    if (!DIFFICULTIES[m.lastDifficulty]) m.lastDifficulty = 'NORMAL';
    return m;
  } catch(e) { return { shards:0, upgrades:{}, stats:{ totalRuns:0, totalShards:0, bestFloor:0, victories:0 }, lastDifficulty:'NORMAL' }; }
}

function saveMeta(meta) {
  try { localStorage.setItem('neonDungeonMeta', JSON.stringify(meta)); } catch(e){}
}

function getMetaLevel(id) {
  const m = loadMeta();
  return m.upgrades[id] || 0;
}

function calcRunShards(floor, score, bossesCleared, victory) {
  let runShards = floor;                                    // 1 per floor reached
  runShards += bossesCleared * 2;                           // 2 per boss cleared
  if (victory) runShards += 5;                              // 5 for victory
  runShards += Math.min(5, Math.floor(score / 2000));       // 1 per 2000 score, cap 5
  // Difficulty scales only the run-earned portion
  runShards = Math.round(runShards * getDiff().shardMul);
  const persistLv = getMetaLevel('PERSISTENCE');
  runShards += persistLv * 3;                               // flat bonus from PERSISTENCE (unscaled)
  return runShards;
}

function applyMetaToPlayer(player) {
  const m = loadMeta();
  const u = m.upgrades;
  if (u.VITAL_BOOST)   { player.maxHp += u.VITAL_BOOST * 10; player.hp = player.maxHp; }
  if (u.ARMOR_PLATING) { player.def += u.ARMOR_PLATING; }
  if (u.STARTING_GEAR) {
    const pool = ['SCATTER_GUN','RAILGUN','PLASMA_SWORD','VOID_CANNON'];
    player.weapon = WEAPONS[pool[Math.floor(Math.random() * pool.length)]];
  }
}

function getMetaXPMultiplier()     { return 1 + getMetaLevel('QUICK_LEARNER') * 0.15; }
function getMetaCreditMultiplier() { return 1 + getMetaLevel('SCAVENGER') * 0.15; }

// ─── Particles ───────────────────────────────────────────────────────────────
let particles = [];
function spawnParticles(wx, wy, type, colour, count) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*TWO_PI;
    const spd = type==='EXPLOSION' ? rnd(1,4) : rnd(0.5,3);
    particles.push({
      x: wx*TILE, y: wy*TILE,
      vx: Math.cos(a)*spd*(TILE/2), vy: Math.sin(a)*spd*(TILE/2),
      life: 1, maxLife: type==='MUZZLE'?0.08:type==='EXPLOSION'?0.5:rnd(0.3,0.6),
      size: type==='EXPLOSION' ? rnd(3,8) : rnd(1,3),
      colour, type,
      grav: type==='BLOOD' ? 40 : 0,
    });
  }
}
function updateParticles(dt) {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.life -= dt / p.maxLife;
    if (p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(camX, camY) {
  for (const p of particles) {
    const sx = p.x - camX, sy = p.y - camY;
    if (sx < -20 || sx > W+20 || sy < -20 || sy > H+20) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'EXPLOSION') {
      ctx.shadowBlur = 10; ctx.shadowColor = p.colour;
      ctx.fillStyle = p.colour;
      ctx.beginPath();
      ctx.arc(sx, sy, p.size * (1 - p.life * 0.5 + 0.5), 0, TWO_PI);
      ctx.fill();
    } else {
      ctx.fillStyle = p.colour;
      ctx.fillRect(sx - p.size/2, sy - p.size/2, p.size, p.size);
    }
    ctx.restore();
  }
}

// ─── Floating Damage Numbers ─────────────────────────────────────────────────
let floatingTexts = [];
function spawnDmgText(wx, wy, text, colour) {
  if (floatingTexts.length >= 20) floatingTexts.shift();
  floatingTexts.push({
    x: wx * TILE + rnd(-6, 6), y: wy * TILE - 8,
    vy: -40, life: 1, text: String(text), colour
  });
}
function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.y += f.vy * dt;
    f.vy *= Math.pow(0.35, dt);
    f.life -= dt * 1.4;
    if (f.life <= 0) floatingTexts.splice(i, 1);
  }
}
function drawFloatingTexts(camX, camY) {
  for (const f of floatingTexts) {
    const sx = f.x - camX, sy = f.y - camY;
    if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.shadowBlur = 6; ctx.shadowColor = f.colour;
    ctx.fillStyle = f.colour;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, sx, sy);
    ctx.restore();
  }
}

// ─── Screen Shake ────────────────────────────────────────────────────────────
const shake = { intensity: 0, timer: 0, ox: 0, oy: 0 };
function triggerShake(intensity, duration = 0.25) {
  if (intensity > shake.intensity) {
    shake.intensity = intensity;
    shake.timer = duration;
  }
}
function updateShake(dt) {
  if (shake.timer <= 0) { shake.ox = shake.oy = 0; return; }
  shake.timer -= dt;
  const t = Math.max(0, shake.timer);
  const mag = shake.intensity * (t / 0.25);  // decay linearly
  shake.ox = (Math.random() * 2 - 1) * mag;
  shake.oy = (Math.random() * 2 - 1) * mag;
  if (shake.timer <= 0) { shake.intensity = 0; shake.ox = shake.oy = 0; }
}

// ─── Combo / Kill-Streak ─────────────────────────────────────────────────────
const combo = { count: 0, timer: 0, best: 0, flashTimer: 0 };
const COMBO_WINDOW    = 3;     // seconds between kills to maintain streak
const COMBO_STEP      = 0.25;  // multiplier increment per kill beyond first
const COMBO_MAX_MULT  = 4;     // hard cap on multiplier
const COMBO_BOSS_CAP  = 2;     // separate lower cap for boss kills
function comboMultiplier() {
  return combo.count < 2 ? 1 : Math.min(COMBO_MAX_MULT, 1 + (combo.count - 1) * COMBO_STEP);
}
function comboBossMultiplier() {
  return Math.min(COMBO_BOSS_CAP, comboMultiplier());
}
function comboColour() {
  const c = combo.count;
  if (c >= 11) return '#ff00c8';  // magenta
  if (c >= 8)  return '#ff6622';  // orange
  if (c >= 5)  return '#ffb700';  // yellow
  return '#00f5ff';               // cyan
}
function registerKill(isBoss) {
  combo.count++;
  combo.timer = COMBO_WINDOW;
  combo.flashTimer = 0.3;
  if (combo.count > combo.best) combo.best = combo.count;
  if (combo.count >= 2) audio.comboTick(combo.count);
  // milestone floating text at kill position
  if (combo.count === 5 || combo.count === 10 || combo.count === 15 || combo.count === 20) {
    const p = game.player;
    spawnDmgText(p.x, p.y - 0.5, `×${combo.count} COMBO!`, comboColour());
  }
}
function updateCombo(dt) {
  if (combo.count < 1) return;
  combo.timer -= dt;
  combo.flashTimer = Math.max(0, combo.flashTimer - dt);
  if (combo.timer <= 0) { combo.count = 0; combo.timer = 0; }
}

// ─── Dungeon Generator ───────────────────────────────────────────────────────
function createMap() {
  return Array.from({length: MAP_H}, () => new Uint8Array(MAP_W).fill(T.WALL));
}

function carveRect(map, x, y, w, h, tile) {
  for (let ty=y; ty<y+h; ty++)
    for (let tx=x; tx<x+w; tx++)
      if (tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H) map[ty][tx]=tile;
}

function carveCorridor(map, x1, y1, x2, y2) {
  let x=x1, y=y1;
  while (x!==x2) { map[y][x]=T.FLOOR; x += x<x2?1:-1; }
  while (y!==y2) { map[y][x]=T.FLOOR; y += y<y2?1:-1; }
}

class BSPNode {
  constructor(x,y,w,h) { this.x=x; this.y=y; this.w=w; this.h=h; this.left=null; this.right=null; this.room=null; }
  split(depth) {
    if (depth<=0 || (this.w<16 && this.h<16)) return;
    const horiz = this.h > this.w ? true : this.w > this.h ? false : Math.random()<0.5;
    if (horiz) {
      const split = rndInt(8, this.h-8);
      this.left  = new BSPNode(this.x, this.y, this.w, split);
      this.right = new BSPNode(this.x, this.y+split, this.w, this.h-split);
    } else {
      const split = rndInt(8, this.w-8);
      this.left  = new BSPNode(this.x, this.y, split, this.h);
      this.right = new BSPNode(this.x+split, this.y, this.w-split, this.h);
    }
    this.left.split(depth-1);
    this.right.split(depth-1);
  }
  getLeaves() {
    if (!this.left && !this.right) return [this];
    return [...(this.left?.getLeaves()??[]), ...(this.right?.getLeaves()??[])];
  }
  carveRooms(map) {
    if (!this.left && !this.right) {
      const rw = rndInt(5, Math.max(6,this.w-2));
      const rh = rndInt(5, Math.max(6,this.h-2));
      const rx = this.x + rndInt(1, Math.max(2,this.w-rw-1));
      const ry = this.y + rndInt(1, Math.max(2,this.h-rh-1));
      this.room = {x:rx, y:ry, w:rw, h:rh,
        cx: Math.floor(rx+rw/2), cy: Math.floor(ry+rh/2)};
      carveRect(map, rx, ry, rw, rh, T.FLOOR);
      return;
    }
    this.left?.carveRooms(map);
    this.right?.carveRooms(map);
    const lr = this.left?.getRoom();
    const rr = this.right?.getRoom();
    if (lr && rr) carveCorridor(map, lr.cx, lr.cy, rr.cx, rr.cy);
  }
  getRoom() {
    if (this.room) return this.room;
    const l = this.left?.getRoom(), r = this.right?.getRoom();
    if (!l) return r; if (!r) return l;
    return Math.random()<0.5?l:r;
  }
}

function bfsRooms(rooms, startRoom, map) {
  const dist = new Map();
  const q = [startRoom];
  dist.set(startRoom, 0);
  while (q.length) {
    const cur = q.shift();
    for (const other of rooms) {
      if (dist.has(other)) continue;
      if (hasLOS(cur.cx, cur.cy, other.cx, other.cy, map) ||
          dist2(cur.cx,cur.cy,other.cx,other.cy) < 400) {
        dist.set(other, dist.get(cur)+1);
        q.push(other);
      }
    }
  }
  return dist;
}

function generateFloor(floorNum) {
  const map = createMap();
  const root = new BSPNode(0,0,MAP_W,MAP_H);
  root.split(5);
  root.carveRooms(map);
  const rooms = root.getLeaves().map(l=>l.room).filter(Boolean);

  // spawn in first room
  const spawnRoom = rooms[0];
  const playerPos = { x: spawnRoom.cx + 0.5, y: spawnRoom.cy + 0.5 };

  // furthest room from spawn for stairs
  const dist = bfsRooms(rooms, spawnRoom, map);
  let farthest = spawnRoom, farthestD = 0;
  for (const [r,d] of dist) { if (d>farthestD) { farthestD=d; farthest=r; } }
  map[farthest.cy][farthest.cx] = floorNum>=10 ? T.TERMINAL : T.STAIRS;

  // boss room on floors 3,6,10
  let bossRoom = null;
  let bossEntrances = [];
  if (floorNum===3||floorNum===6||floorNum===10) {
    // use the room furthest from spawn that isn't the stair room
    let br = null, bd = 0;
    for (const [r,d] of dist) {
      if (r===farthest) continue;
      if (d>bd) { bd=d; br=r; }
    }
    bossRoom = br || rooms[Math.floor(rooms.length/2)];

    // Enforce minimum boss room size (15×15) by expanding if needed
    const MIN_BOSS = 15;
    if (bossRoom.w < MIN_BOSS || bossRoom.h < MIN_BOSS) {
      const nw = Math.max(bossRoom.w, MIN_BOSS);
      const nh = Math.max(bossRoom.h, MIN_BOSS);
      // centre the expansion on the current room centre, clamped to map
      const nx = Math.max(1, Math.min(MAP_W - nw - 1, bossRoom.cx - Math.floor(nw/2)));
      const ny = Math.max(1, Math.min(MAP_H - nh - 1, bossRoom.cy - Math.floor(nh/2)));
      bossRoom.x = nx; bossRoom.y = ny; bossRoom.w = nw; bossRoom.h = nh;
      bossRoom.cx = Math.floor(nx + nw/2); bossRoom.cy = Math.floor(ny + nh/2);
      carveRect(map, nx, ny, nw, nh, T.FLOOR);
      // re-carve corridors to this room from neighbours
      for (const r of rooms) {
        if (r === bossRoom) continue;
        const dx = Math.abs(r.cx - bossRoom.cx), dy = Math.abs(r.cy - bossRoom.cy);
        if (dx < 20 && dy < 20) carveCorridor(map, r.cx, r.cy, bossRoom.cx, bossRoom.cy);
      }
      // Re-place stairs/terminal in case expansion overwrote it
      map[farthest.cy][farthest.cx] = floorNum>=10 ? T.TERMINAL : T.STAIRS;
    }

    // Record entrance tiles: floor tiles on room boundary that connect to corridors
    const rx=bossRoom.x, ry=bossRoom.y, rw=bossRoom.w, rh=bossRoom.h;
    for (let tx=rx; tx<rx+rw; tx++) {
      // top edge
      if (ry>0 && map[ry][tx]===T.FLOOR && map[ry-1][tx]===T.FLOOR)
        bossEntrances.push({x:tx, y:ry});
      // bottom edge
      const by=ry+rh-1;
      if (by<MAP_H-1 && map[by][tx]===T.FLOOR && map[by+1][tx]===T.FLOOR)
        bossEntrances.push({x:tx, y:by});
    }
    for (let ty=ry; ty<ry+rh; ty++) {
      // left edge
      if (rx>0 && map[ty][rx]===T.FLOOR && map[ty][rx-1]===T.FLOOR)
        bossEntrances.push({x:rx, y:ty});
      // right edge
      const bx=rx+rw-1;
      if (bx<MAP_W-1 && map[ty][bx]===T.FLOOR && map[ty][bx+1]===T.FLOOR)
        bossEntrances.push({x:bx, y:ty});
    }
    // Deduplicate — corners scanned by both edge loops cause permanent seal bug
    const seen = new Set();
    bossEntrances = bossEntrances.filter(e => {
      const k = e.x + ',' + e.y;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
  }

  // lights
  const lights = [];
  for (const r of rooms) {
    lights.push({x:r.x+1,y:r.y+1});
    lights.push({x:r.x+r.w-2,y:r.y+r.h-2});
  }

  // fog of war
  const visited = Array.from({length:MAP_H},()=>new Uint8Array(MAP_W));
  const light   = Array.from({length:MAP_H},()=>new Float32Array(MAP_W));

  // ── Room types: assign special purposes ──────────────────────────────────
  // Types: null (normal), 'armory', 'medbay', 'shrine', 'vault'
  const ROOM_TYPES = ['armory','medbay','shrine','vault'];
  const ROOM_COLOURS = {armory:'#2a1a10',medbay:'#0a1a15',shrine:'#1a0a20',vault:'#1a1a05',vendor:'#0a1a0f',secret:'#1a1005'};
  const specialRooms = [];
  const eligible = rooms.filter(r => r!==spawnRoom && r!==farthest && r!==bossRoom && r.w*r.h>=20);

  // ── Vendor room (floor 2+, one per non-boss floor) — reserved first ─────
  let vendorRoom = null;
  if (floorNum >= 2 && !bossRoom) {
    const vendorEligible = eligible.filter(r => r.w >= 5 && r.h >= 5);
    if (vendorEligible.length > 0) {
      vendorRoom = vendorEligible[rndInt(0, vendorEligible.length - 1)];
      vendorRoom.roomType = 'vendor';
      specialRooms.push(vendorRoom);
      map[vendorRoom.cy][vendorRoom.cx] = T.VENDOR;
    }
  }

  // ── Special room rotation (excluding vendor room) ───────────────────────
  const specialEligible = eligible.filter(r => r !== vendorRoom);
  const numSpecial = Math.min(specialEligible.length, Math.floor(floorNum/2)+1);
  const picked = specialEligible.sort(()=>Math.random()-0.5).slice(0,numSpecial);
  for (let i=0; i<picked.length; i++) {
    const r = picked[i];
    r.roomType = ROOM_TYPES[i % ROOM_TYPES.length];
    specialRooms.push(r);
  }

  // ── Doors: place at room-corridor junctions (chokepoints only) ──────────
  // Helper: find entrance clusters for a room (groups of adjacent boundary tiles
  // connecting to corridors). Returns array of arrays.
  function getEntranceClusters(room) {
    const edges = [];
    const isEntry = t => t===T.FLOOR||t===T.DOOR;
    for (let tx=room.x; tx<room.x+room.w; tx++) {
      if (room.y>0 && isEntry(map[room.y][tx]) && map[room.y-1][tx]===T.FLOOR) edges.push({x:tx, y:room.y});
      const by=room.y+room.h-1;
      if (by<MAP_H-1 && isEntry(map[by][tx]) && map[by+1][tx]===T.FLOOR) edges.push({x:tx, y:by});
    }
    for (let ty=room.y; ty<room.y+room.h; ty++) {
      if (room.x>0 && isEntry(map[ty][room.x]) && map[ty][room.x-1]===T.FLOOR) edges.push({x:room.x, y:ty});
      const bx=room.x+room.w-1;
      if (bx<MAP_W-1 && isEntry(map[ty][bx]) && map[ty][bx+1]===T.FLOOR) edges.push({x:bx, y:ty});
    }
    // Deduplicate
    const seen = new Set();
    const dedup = edges.filter(e => { const k=e.x+','+e.y; if(seen.has(k)) return false; seen.add(k); return true; });
    // Cluster adjacent tiles
    const used = new Set();
    const clusters = [];
    for (const e of dedup) {
      const k = e.x+','+e.y;
      if (used.has(k)) continue;
      const cl = [e]; used.add(k);
      let qi = 0;
      while (qi < cl.length) {
        const c = cl[qi++];
        for (const o of dedup) {
          const ok = o.x+','+o.y;
          if (used.has(ok)) continue;
          if (Math.abs(c.x-o.x)+Math.abs(c.y-o.y)===1) { cl.push(o); used.add(ok); }
        }
      }
      clusters.push(cl);
    }
    return clusters;
  }

  for (const r of rooms) {
    if (r === bossRoom) continue;
    const clusters = getEntranceClusters(r);
    // Only door narrow clusters (1-2 tiles = real chokepoints)
    for (const cl of clusters) {
      if (cl.length <= 2 && Math.random() < 0.5) {
        for (const e of cl) map[e.y][e.x] = T.DOOR;
      }
    }
  }

  // ── Locked doors + keys (floor 2+) ──────────────────────────────────────
  // Lock meaningful targets: stair room first, then special rooms, then random.
  // All narrow entrance clusters of the target room are locked so the room
  // is truly gated (no walking around a single locked tile).
  const keyItems = [];
  if (floorNum >= 2) {
    // Build priority list: stair room > special rooms > eligible randoms
    const lockPriority = [];
    if (farthest !== spawnRoom && farthest !== bossRoom) lockPriority.push(farthest);
    for (const r of specialRooms) {
      if (!lockPriority.includes(r) && r.roomType !== 'vendor' && r.roomType !== 'secret') lockPriority.push(r);
    }
    const fallback = rooms.filter(r =>
      r !== spawnRoom && r !== farthest && r !== bossRoom &&
      !specialRooms.includes(r) && r.w * r.h >= 20
    );
    lockPriority.push(...fallback.sort(() => Math.random()-0.5));

    const numLocked = floorNum >= 7 ? 3 : floorNum >= 4 ? 2 : 1;
    const colours = ['red','blue','gold'];
    const lockTiles = [T.LOCKED_R, T.LOCKED_B, T.LOCKED_G];
    const lockColours = ['#ff3333','#3388ff','#ffcc00'];
    let placed = 0;

    for (const lr of lockPriority) {
      if (placed >= numLocked) break;
      const ci = Math.min(placed, 2);
      // Get entrance clusters and lock ALL narrow ones (size ≤ 2)
      const cls = getEntranceClusters(lr);
      const narrowClusters = cls.filter(cl => cl.length <= 2);
      if (!narrowClusters.length) continue; // can't meaningfully gate this room

      // Convert every tile in every narrow cluster to a locked door
      const lockedTiles = [];
      for (const cl of narrowClusters) {
        for (const e of cl) {
          map[e.y][e.x] = lockTiles[ci];
          lockedTiles.push(e);
        }
      }
      // Wide clusters (>2): wall them off to prevent bypass
      for (const cl of cls) {
        if (cl.length > 2) {
          for (const e of cl) map[e.y][e.x] = T.WALL;
        }
      }

      // BFS from spawn to find rooms reachable without this lock
      const q2 = [{x:spawnRoom.cx, y:spawnRoom.cy}];
      const vis2 = Array.from({length:MAP_H},()=>new Uint8Array(MAP_W));
      vis2[spawnRoom.cy][spawnRoom.cx] = 1;
      while (q2.length) {
        const {x:cx,y:cy} = q2.shift();
        for (const [ddx,ddy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
          const nx2=cx+ddx, ny2=cy+ddy;
          if (nx2<0||ny2<0||nx2>=MAP_W||ny2>=MAP_H||vis2[ny2][nx2]) continue;
          const t=map[ny2][nx2];
          if (t===T.WALL||t===T.VOID||t===T.CRACKED||t===T.LOCKED_R||t===T.LOCKED_B||t===T.LOCKED_G) continue;
          vis2[ny2][nx2]=1;
          q2.push({x:nx2,y:ny2});
        }
      }
      // Find a reachable room to place the key
      const keyRoom = rooms.filter(r => r!==lr && r!==bossRoom && vis2[r.cy][r.cx]);
      if (keyRoom.length) {
        const kr = keyRoom[rndInt(0, keyRoom.length-1)];
        keyItems.push({ x: kr.cx, y: kr.cy, colour: colours[ci], tileColour: lockColours[ci] });
        lr.hasLoot = true;
        placed++;
      } else {
        // Can't safely place key — revert locks and walls to floor
        for (const e of lockedTiles) map[e.y][e.x] = T.FLOOR;
        for (const cl of cls) {
          if (cl.length > 2) {
            for (const e of cl) map[e.y][e.x] = T.FLOOR;
          }
        }
      }
    }
  }

  // ── Secret room (floor 3+, one per floor, not boss floors) ──────────────
  const secretRooms = [];
  if (floorNum >= 3 && !bossRoom) {
    // Candidates: not spawn, not stair, not special, not vendor, decent size
    const secretEligible = rooms.filter(r =>
      r !== spawnRoom && r !== farthest && !r.roomType && r.w * r.h >= 20
    );
    // Shuffle and try to find one with a narrow entrance cluster
    const shuffled = secretEligible.sort(() => Math.random() - 0.5);
    for (const r of shuffled) {
      const cls = getEntranceClusters(r);
      const narrow = cls.filter(cl => cl.length <= 2);
      if (!narrow.length) continue; // no narrow entrance → skip

      r.roomType = 'secret';
      r.secretRevealed = false;
      specialRooms.push(r);
      secretRooms.push(r);

      // Wall off ALL entrances
      for (const cl of cls) {
        for (const e of cl) map[e.y][e.x] = T.WALL;
      }
      // Place T.CRACKED at one narrow cluster (the "hidden entrance")
      const crackedCluster = narrow[rndInt(0, narrow.length - 1)];
      for (const e of crackedCluster) map[e.y][e.x] = T.CRACKED;

      break; // only one secret room per floor
    }
  }

  // ── Traps (floor 3+) ────────────────────────────────────────────────────
  if (floorNum >= 3) {
    for (const r of rooms) {
      if (r === spawnRoom || r === bossRoom) continue;
      const trapCount = rndInt(0, Math.min(3, Math.floor(floorNum/3)));
      for (let t=0; t<trapCount; t++) {
        const tx = r.x + rndInt(1, r.w-2);
        const ty = r.y + rndInt(1, r.h-2);
        if (map[ty][tx] === T.FLOOR) {
          map[ty][tx] = Math.random() < 0.7 ? T.TRAP_SPIKE : T.TRAP_SLOW;
        }
      }
    }
  }

  // ── Plasma Vents (floor 4+): clustered pools in normal rooms ─────────
  if (floorNum >= 4) {
    for (const r of rooms) {
      if (r === spawnRoom || r === bossRoom || r.roomType) continue;
      if (Math.random() > 0.35) continue; // ~35% of eligible rooms
      // Seed tile for the pool
      const sx = r.x + rndInt(2, r.w-3);
      const sy = r.y + rndInt(2, r.h-3);
      if (map[sy][sx] !== T.FLOOR) continue;
      map[sy][sx] = T.PLASMA;
      // Grow pool via random-walk from seed (2-4 total tiles)
      const poolSize = rndInt(2, 4);
      let cx = sx, cy = sy;
      for (let p = 1; p < poolSize; p++) {
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        const [ddx, ddy] = dirs[rndInt(0, 3)];
        const nx = cx + ddx, ny = cy + ddy;
        if (nx > r.x && nx < r.x+r.w-1 && ny > r.y && ny < r.y+r.h-1 && map[ny][nx] === T.FLOOR) {
          map[ny][nx] = T.PLASMA;
          cx = nx; cy = ny;
        }
      }
    }
  }

  // ── Lore Terminals (floor 2+, non-boss): 1–2 data terminals per floor ────
  const loreTerminals = [];
  if (floorNum >= 2 && !bossRoom) {
    const loreEligible = rooms.filter(r =>
      r !== spawnRoom && r !== farthest && r.roomType !== 'vendor' &&
      r.roomType !== 'secret' && r.w * r.h >= 12
    );
    const numLore = Math.min(loreEligible.length, floorNum >= 5 ? 2 : 1);
    const loreRooms = loreEligible.sort(() => Math.random() - 0.5).slice(0, numLore);
    for (const r of loreRooms) {
      for (let attempt = 0; attempt < 10; attempt++) {
        const tx = r.x + rndInt(1, r.w - 2);
        const ty = r.y + rndInt(1, r.h - 2);
        if (map[ty][tx] === T.FLOOR) {
          map[ty][tx] = T.LORE;
          loreTerminals.push({ x: tx, y: ty });
          break;
        }
      }
    }
  }

  // ── Arc Grids (floor 5+): pulsing hazards in corridors ───────────────
  if (floorNum >= 5) {
    // Build room mask to identify corridor tiles
    const roomMask = Array.from({length:MAP_H}, ()=>new Uint8Array(MAP_W));
    for (const r of rooms) {
      for (let ty = r.y; ty < r.y + r.h; ty++)
        for (let tx = r.x; tx < r.x + r.w; tx++)
          roomMask[ty][tx] = 1;
    }
    // Collect corridor floor tiles (not adjacent to doors/stairs/terminals)
    const corridorTiles = [];
    for (let ty = 1; ty < MAP_H-1; ty++) {
      for (let tx = 1; tx < MAP_W-1; tx++) {
        if (map[ty][tx] !== T.FLOOR || roomMask[ty][tx]) continue;
        // Skip if adjacent to door, stairs, terminal, or locked door
        let nearSpecial = false;
        for (const [ddx, ddy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
          const nt = map[ty+ddy]?.[tx+ddx];
          if (nt===T.STAIRS||nt===T.TERMINAL||nt===T.VENDOR||nt===T.LORE||isDoor(nt)||nt===T.DOOR_OPEN) { nearSpecial = true; break; }
        }
        if (!nearSpecial) corridorTiles.push({x:tx, y:ty});
      }
    }
    // Place arc grids: ~1 per 12 corridor tiles, capped
    const arcCount = Math.min(Math.floor(corridorTiles.length / 12) + 1, 6 + floorNum);
    const shuffled = corridorTiles.sort(() => Math.random() - 0.5);
    let placed = 0;
    for (const ct of shuffled) {
      if (placed >= arcCount) break;
      // Don't place adjacent to another arc
      let adjArc = false;
      for (const [ddx, ddy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        if (map[ct.y+ddy]?.[ct.x+ddx] === T.ARC) { adjArc = true; break; }
      }
      if (adjArc) continue;
      map[ct.y][ct.x] = T.ARC;
      placed++;
    }
  }

  // Room colour map (floor tile → tint)
  const roomColour = Array.from({length:MAP_H},()=>new Array(MAP_W).fill(null));
  for (const r of rooms) {
    if (!r.roomType) continue;
    const col = ROOM_COLOURS[r.roomType];
    for (let ty=r.y; ty<r.y+r.h; ty++)
      for (let tx=r.x; tx<r.x+r.w; tx++)
        if (map[ty][tx]===T.FLOOR) roomColour[ty][tx]=col;
  }

  // Secret room mask — tiles inside unrevealed secret rooms are hidden from lighting/rendering
  // Cracked entrance tiles are excluded so they can receive light and render crack visuals
  const secretMask = Array.from({length:MAP_H},()=>new Uint8Array(MAP_W));
  for (const r of secretRooms) {
    for (let ty=r.y; ty<r.y+r.h; ty++)
      for (let tx=r.x; tx<r.x+r.w; tx++)
        if (map[ty][tx] !== T.CRACKED) secretMask[ty][tx] = 1;
  }

  return { map, rooms, spawnRoom, stairRoom:farthest, bossRoom, bossEntrances, playerPos, lights, visited, light, keyItems, roomColour, specialRooms, vendorRoom, secretRooms, secretMask, loreTerminals };
}

// ─── Lighting ────────────────────────────────────────────────────────────────
function updateLighting(dungeon, px, py) {
  const r = game.modifier === 'BLACKOUT' ? 5 : 9;
  const tx = Math.floor(px), ty = Math.floor(py);
  for (let dy=-r; dy<=r; dy++)
    for (let dx=-r; dx<=r; dx++) {
      const x=tx+dx, y=ty+dy;
      if (x<0||y<0||x>=MAP_W||y>=MAP_H) continue;
      if (dungeon.secretMask[y][x]) continue; // hide unrevealed secret rooms
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d <= r) {
        const l = Math.max(0, 1 - d/r);
        dungeon.light[y][x] = Math.max(dungeon.light[y][x], l);
        dungeon.visited[y][x] = 1;
      }
    }
  // sconce lights
  for (const sc of dungeon.lights) {
    const sdx=sc.x-tx, sdy=sc.y-ty;
    if (Math.abs(sdx)>6||Math.abs(sdy)>6) continue;
    for (let dy=-4; dy<=4; dy++)
      for (let dx=-4; dx<=4; dx++) {
        const x=sc.x+dx, y=sc.y+dy;
        if (x<0||y<0||x>=MAP_W||y>=MAP_H) continue;
        if (dungeon.secretMask[y][x]) continue;
        const d=Math.sqrt(dx*dx+dy*dy);
        if (d<=4) dungeon.light[y][x]=Math.max(dungeon.light[y][x],0.4*(1-d/4));
      }
  }
}

// ─── Projectiles ─────────────────────────────────────────────────────────────
let projectiles = [];
class Projectile {
  constructor(x,y,dx,dy,spd,dmg,range,colour,piercing,fromPlayer,weaponName) {
    this.x=x; this.y=y;
    [this.dx,this.dy]=norm(dx,dy);
    this.spd=spd; this.dmg=dmg;
    this.maxRange=range; this.travelled=0;
    this.colour=colour; this.piercing=piercing;
    this.maxPierces=piercing?Infinity:0;
    this.fromPlayer=fromPlayer; this.dead=false;
    this.weaponName=weaponName||null;
    this.hitEnemies=new Set();
    this.bouncesLeft=0;
    this._hasRicochet=false;
    this.trail=[];
  }
  update(dt, map, player, enemies) {
    // Homing: steer toward target
    if (this.homing && !this.homing.dead) {
      const [tx, ty] = [this.homing.x - this.x, this.homing.y - this.y];
      const [nd, ndy] = norm(tx, ty);
      const steer = 8; // radians/sec turn rate
      this.dx = lerp(this.dx, nd,  Math.min(1, steer * dt));
      this.dy = lerp(this.dy, ndy, Math.min(1, steer * dt));
      const [fd, fdy] = norm(this.dx, this.dy);
      this.dx = fd; this.dy = fdy;
    }
    // Trail: record position before moving (ricochet projectiles only)
    if (this._hasRicochet) {
      this.trail.push(this.x*TILE, this.y*TILE);
      if (this.trail.length>24) this.trail.splice(0,2); // max 12 points (x,y pairs)
    }
    const prevX=this.x, prevY=this.y;
    const mx=this.dx*this.spd*dt, my=this.dy*this.spd*dt;
    this.x+=mx; this.y+=my;
    this.travelled+=Math.sqrt(mx*mx+my*my);
    if (this.travelled>=this.maxRange) {
      if (this.isGrenade) detonateGrenade(prevX, prevY, this.grenadeDmg);
      this.dead=true; return;
    }
    const tx=Math.floor(this.x), ty=Math.floor(this.y);
    if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) {
      if (this.isGrenade) { detonateGrenade(prevX, prevY, this.grenadeDmg); }
      else { spawnParticles(prevX,prevY,'SPARK',this.colour,3); }
      this.dead=true; return;
    }
    if (!isPassable(map[ty][tx])) {
      // Grenades detonate at last passable position on wall hit
      if (this.isGrenade) {
        detonateGrenade(prevX, prevY, this.grenadeDmg);
        this.dead = true; return;
      }
      // Ricochet: bounce off walls if bounces remain
      if (this.bouncesLeft>0) {
        this.bouncesLeft--;
        this.x=prevX; this.y=prevY;
        // Axis-separated wall detection
        const ptx=Math.floor(prevX), pty=Math.floor(prevY);
        const ntx=Math.floor(prevX+mx), nty=Math.floor(prevY+my);
        const xWall=ntx<0||ntx>=MAP_W||!isPassable(map[pty][ntx]);
        const yWall=nty<0||nty>=MAP_H||!isPassable(map[nty][ptx]);
        if (xWall) this.dx=-this.dx;
        if (yWall) this.dy=-this.dy;
        if (!xWall&&!yWall) { this.dx=-this.dx; this.dy=-this.dy; }
        // Nudge away from wall to prevent re-collision
        this.x+=this.dx*0.05; this.y+=this.dy*0.05;
        spawnParticles(prevX,prevY,'SPARK','#00ffff',4);
        audio.ricochet();
        return;
      }
      spawnParticles(this.x,this.y,'SPARK',this.colour,3);
      this.dead=true; return;
    }
    // Grenades: detonate when reaching target
    if (this.isGrenade && dist(this.x, this.y, this.targetX, this.targetY) < 0.5) {
      detonateGrenade(this.x, this.y, this.grenadeDmg);
      this.dead = true; return;
    }
    if (this.fromPlayer) {
      for (const e of enemies) {
        if (e.dead||this.hitEnemies.has(e)) continue;
        if (dist(this.x,this.y,e.x,e.y)<0.6) {
          // Shield deflection check (skip for piercing weapons)
          if (e.blocksProjectile(this) && !this.piercing) {
            spawnParticles(this.x, this.y, 'SPARK', '#66eeff', 6);
            audio.shieldDeflect();
            this.dead = true; return;
          }
          e.takeDamage(this.dmg, this.weaponName);
          spawnParticles(this.x,this.y,'BLOOD','#ff3333',4);
          this.hitEnemies.add(e);
          if (this.hitEnemies.size > this.maxPierces) { this.dead=true; return; }
        }
      }
    } else if (!this.isGrenade) {
      // Normal enemy projectiles damage player (grenades don't — they create zones)
      if (!player.invincibleTimer && dist(this.x,this.y,player.x,player.y)<0.5) {
        player.takeDamage(this.dmg);
        this.dead=true;
      }
    }
  }
  draw(camX,camY) {
    // Ricochet trail — fading cyan line behind bouncing projectiles
    const tl=this.trail.length;
    if (tl>=4) {
      ctx.save();
      ctx.lineCap='round';
      const pts=Math.floor(tl/2);
      for (let i=1;i<pts;i++) {
        const a=(i-1)*2, b=i*2;
        const alpha=(i/pts)*0.5;
        ctx.globalAlpha=alpha;
        ctx.strokeStyle='#00ffff';
        ctx.shadowBlur=4; ctx.shadowColor='#00ffff';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(this.trail[a]-camX, this.trail[a+1]-camY);
        ctx.lineTo(this.trail[b]-camX, this.trail[b+1]-camY);
        ctx.stroke();
      }
      // Line from last trail point to current position
      ctx.globalAlpha=0.6;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(this.trail[tl-2]-camX, this.trail[tl-1]-camY);
      ctx.lineTo(this.x*TILE-camX, this.y*TILE-camY);
      ctx.stroke();
      ctx.restore();
    }
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    ctx.save();
    ctx.shadowBlur=8; ctx.shadowColor=this.colour;
    ctx.fillStyle=this.colour;
    ctx.beginPath();
    const r = this.isGrenade ? 5 : 3;
    ctx.arc(sx,sy,r,0,TWO_PI);
    ctx.fill();
    if (this.isGrenade) {
      // Pulsing warning ring
      ctx.globalAlpha = 0.4 + Math.sin(Date.now() / 80) * 0.3;
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx, sy, 7, 0, TWO_PI);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ─── Hazard Zones (grenade AoE) ───────────────────────────────────────────────
function detonateGrenade(x, y, dmg) {
  hazardZones.push({ x, y, radius: 1.5, age: 0, maxAge: 3, tickCd: 0, dmg, colour: '#ff6622' });
  spawnParticles(x, y, 'EXPLOSION', '#ff6622', 10);
  audio.grenadeExplode();
}

function updateHazardZones(dt, player) {
  for (let i = hazardZones.length - 1; i >= 0; i--) {
    const z = hazardZones[i];
    z.age += dt;
    z.tickCd = Math.max(0, z.tickCd - dt);
    if (z.age >= z.maxAge) { hazardZones.splice(i, 1); continue; }
    // Damage player if within radius (with LOS check to prevent through-wall damage)
    if (z.tickCd <= 0 && !player.invincibleTimer &&
        dist(player.x, player.y, z.x, z.y) < z.radius &&
        hasLOS(z.x, z.y, player.x, player.y, game.dungeon.map)) {
      player.takeDamage(z.dmg);
      spawnParticles(player.x, player.y, 'SPARK', '#ff6622', 4);
      z.tickCd = 0.8;
    }
  }
}

function drawHazardZones(camX, camY) {
  for (const z of hazardZones) {
    const sx = z.x * TILE - camX, sy = z.y * TILE - camY;
    const r = z.radius * TILE;
    const fade = 1 - (z.age / z.maxAge);
    const pulse = 0.7 + Math.sin(z.age * 6) * 0.15;
    ctx.save();
    ctx.globalAlpha = fade * 0.3 * pulse;
    ctx.fillStyle = z.colour;
    ctx.shadowBlur = 15;
    ctx.shadowColor = z.colour;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TWO_PI);
    ctx.fill();
    ctx.globalAlpha = fade * 0.6 * pulse;
    ctx.strokeStyle = z.colour;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// Generate a weapon upgrade option (pre-rolled so player sees exact weapon)
function makeWeaponOption() {
  const k=WEAPON_KEYS[rndInt(0,WEAPON_KEYS.length-1)];
  const w=WEAPONS[k];
  return {
    id:'WEAPON_'+k, name:w.name, colour:w.colour, rarity:10, persistent:false,
    desc: w.melee ? w.dmg+' dmg, melee, '+w.rate+'/s' : w.dmg+(w.count>1?'×'+w.count:'')+' dmg, '+w.rate+'/s, rng '+w.range,
    fn: p=>{ p.weapon=w; game.msg('Equipped '+w.name+'!',w.colour); }
  };
}

function pickUpgradeOption(exclude) {
  // Build eligible pool: exclude maxed persistent upgrades and the excluded id
  const pool = UPGRADES.filter(u => {
    if (exclude && u.id === exclude) return false;
    if (u.persistent && game.player) {
      const cur = game.player.upgrades[u.id] || 0;
      if (cur >= u.maxLevel) return false;
    }
    return true;
  });
  // 20% chance for a weapon option (always eligible)
  if (Math.random() < 0.2 && (!exclude || !exclude.startsWith('WEAPON_'))) return makeWeaponOption();
  if (pool.length === 0) return makeWeaponOption();
  const total = pool.reduce((s,u) => s+u.rarity, 0);
  let r = Math.random() * total;
  for (const u of pool) { r -= u.rarity; if (r <= 0) return u; }
  return pool[0];
}

// Legacy compatibility: items on the ground still use a type for colour/visual
const ITEM_TYPES = UPGRADES.filter(u => !u.persistent).slice(0, 3);
function pickItemType() { return ITEM_TYPES[rndInt(0, ITEM_TYPES.length-1)]; }

// ─── Level-Up Perks ──────────────────────────────────────────────────────────
// Passive abilities unlocked automatically at specific levels
const PERKS = {
  LASER_SIGHT:     { level:2,  name:'Laser Sight',     desc:'Shows aim trajectory',          colour:'#00f5ff' },
  THREAT_SENSE:    { level:4,  name:'Threat Sense',     desc:'Detects nearby off-screen foes', colour:'#ff6644' },
  PIERCING_ROUNDS: { level:6,  name:'Piercing Rounds',  desc:'Shots pierce through one enemy', colour:'#ff00c8' },
  ENERGY_SHIELD:   { level:8,  name:'Energy Shield',    desc:'Absorbs one hit every 30s',      colour:'#4488ff' },
  AUTO_LASER:      { level:10, name:'Auto-Laser',       desc:'Fires beam at nearest foe',      colour:'#ff2222' },
};
function checkPerkUnlocks(player, level) {
  for (const [id, perk] of Object.entries(PERKS)) {
    if (perk.level === level && !player.perks[id]) {
      player.perks[id] = true;
      if (id === 'ENERGY_SHIELD') player.energyShield = true;
      setTimeout(() => game.msg('⚡ PERK: '+perk.name, perk.colour), 200);
    }
  }
}

// ─── Vendor / Shop ───────────────────────────────────────────────────────────
// Shop prices are explicit per upgrade id (not derived from rarity which is spawn weight)
const SHOP_PRICES = {
  MED_PACK:60, NANO_REPAIR:35, XP_CHIP:45, VOID_SHARD:90,
  SAW_BLADE:120, PLASMA_ORB:130, NANO_REGEN:80, OVERCLOCK:110, ARMOR_UP:100, RICOCHET:115
};
function shopPrice(id, floor, playerUpgrades) {
  const base = SHOP_PRICES[id] || 80;
  const lvl = (playerUpgrades && playerUpgrades[id]) || 0;
  return Math.floor((base + floor * 5) * (1 + lvl * 0.4));
}

function generateShopItems(floor, player, dungeon) {
  const pool = [];
  // Always offer a heal option
  pool.push({
    id:'SHOP_HEAL', name:'Full Repair', desc:'Restore all HP',
    colour:'#00ff88', price: 50 + floor * 12,
    fn: p => { p.hp = p.maxHp; game.msg('Fully repaired!','#00ff88'); }
  });
  // Offer a key if the floor has locked doors the player can't open
  if (dungeon) {
    const neededColours = [];
    for (let ty=0; ty<MAP_H; ty++) for (let tx=0; tx<MAP_W; tx++) {
      const t = dungeon.map[ty][tx];
      const kc = doorKeyColour(t);
      if (kc && player.keys[kc] <= 0 && !neededColours.includes(kc)) neededColours.push(kc);
    }
    if (neededColours.length > 0) {
      const kc = neededColours[rndInt(0, neededColours.length - 1)];
      const tileCol = kc==='red'?'#ff3333':kc==='blue'?'#3388ff':'#ffcc00';
      pool.push({
        id:'SHOP_KEY_'+kc.toUpperCase(), name:kc.charAt(0).toUpperCase()+kc.slice(1)+' Key',
        desc:'Unlocks '+kc+' doors', colour:tileCol, price: 80 + floor * 8,
        fn: p => { p.keys[kc]++; game.msg('Bought '+kc.toUpperCase()+' KEY!', tileCol); }
      });
    }
  }
  // Fill remaining slots from UPGRADES pool
  const used = new Set(pool.map(p => p.id));
  const eligible = UPGRADES.filter(u => {
    if (used.has(u.id)) return false;
    if (u.persistent && player) {
      const cur = player.upgrades[u.id] || 0;
      if (cur >= u.maxLevel) return false;
    }
    return true;
  });
  // Shuffle eligible and pick enough to fill 3 total slots
  const shuffled = eligible.sort(() => Math.random() - 0.5);
  while (pool.length < 3 && shuffled.length > 0) {
    const u = shuffled.pop();
    const price = shopPrice(u.id, floor, player ? player.upgrades : {});
    pool.push({
      id:u.id, name:u.name, desc:u.desc, colour:u.colour, price,
      fn: u.fn, persistent:u.persistent, maxLevel:u.maxLevel, levelDesc:u.levelDesc
    });
  }
  // If still < 3, add a weapon option
  while (pool.length < 3) {
    const wo = makeWeaponOption();
    pool.push({ ...wo, price: 70 + floor * 6 });
  }
  return pool.slice(0, 3).map(item => ({ ...item, sold: false }));
}

class Item {
  constructor(x,y,type) {
    this.x=x; this.y=y; this.type=type||pickItemType();
    this.dead=false; this.bob=Math.random()*TWO_PI; this.isKey=false;
  }
  update(dt) { this.bob+=dt*2; }
  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY+Math.sin(this.bob)*2;
    ctx.save();
    ctx.shadowBlur=12; ctx.shadowColor=this.type.colour;
    ctx.fillStyle=this.type.colour;
    ctx.fillRect(sx-5,sy-5,10,10);
    ctx.restore();
  }
}

class KeyItem {
  constructor(x,y,colour,tileColour) {
    this.x=x; this.y=y;
    this.colour=colour; // 'red','blue','gold'
    this.tileColour=tileColour;
    this.dead=false; this.bob=Math.random()*TWO_PI; this.isKey=true;
  }
  update(dt) { this.bob+=dt*2; }
  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY+Math.sin(this.bob)*3;
    ctx.save();
    ctx.shadowBlur=15; ctx.shadowColor=this.tileColour;
    ctx.fillStyle=this.tileColour;
    // Key shape: circle + teeth
    ctx.beginPath();
    ctx.arc(sx, sy-3, 5, 0, TWO_PI);
    ctx.fill();
    ctx.fillRect(sx-1.5, sy, 3, 8);
    ctx.fillRect(sx, sy+3, 4, 2);
    ctx.fillRect(sx, sy+6, 3, 2);
    ctx.restore();
  }
}

// ─── Enemies ─────────────────────────────────────────────────────────────────
let enemies = [];
let items   = [];
let hazardZones = [];

const CREDIT_VALUES = {GUARD:8, TURRET:6, CRAWLER:4, PHANTOM:12, DRONE:5, SHIELDER:10, GRENADIER:7, SPLITTER:9, SHARD:0, SENTINEL:80, HIVE:120, OMEGA:200};
let pendingEnemySpawns = [];

class Enemy {
  constructor(x,y,hp,atk,spd,xpVal,colour,type) {
    this.x=x; this.y=y;
    this.hp=hp; this.maxHp=hp;
    this.atk=atk; this.spd=spd;
    this.xpValue=xpVal; this.colour=colour; this.type=type;
    this.dead=false;
    this.state='PATROL';
    this.patrolTarget=null;
    this.attackTimer=0;
    this.shootTimer=0;
    this.bobAngle=Math.random()*TWO_PI;
    this.visible=true;
    this.teleportTimer=0;
    this.zigzag=0;
    this.room=null;
    this.isBoss=false;
    this.elite=false;
    this.phase=1;
    this.bossTimers={};
    this.spawnCooldown=0;
    this.shieldBurstTimer=0;
    this.flashTimer=0;
    this.voidOrbs=[];
    this.prevPhase=1;
    this.shieldAngle=0;    // SHIELDER: facing angle toward player
    this.grenadeTimer=0;   // GRENADIER: cooldown between lobs
  }

  takeDamage(dmg, weaponName) {
    if (this.dead) return;
    if (this.type==='PHANTOM' && !this.visible) { this.visible=true; }
    this.hp -= dmg;
    this.flashTimer = 0.1;
    spawnDmgText(this.x, this.y, dmg, this.hp <= 0 ? '#ffcc00' : '#ffffff');
    if (this.hp<=0) { this.hp=0; this.die(); }
    else audio.hit(false, weaponName);
  }

  die() {
    this.dead=true;
    audio.death();
    spawnParticles(this.x,this.y,'EXPLOSION',this.colour,12);
    const d=getDiff();
    const dropRate = game.modifier === 'FORTIFIED' ? d.itemDrop * 1.3 : d.itemDrop;
    if (!this.isShard && Math.random()<dropRate) items.push(new Item(this.x,this.y));
    game.player.gainXP(Math.round(this.xpValue*d.xpMul));
    // Combo: SHARDs and VOLATILE chain kills don't build streak
    const comboEligible = !this.isShard && !this._volatileKill;
    if (comboEligible) registerKill(this.isBoss);
    const mul = this.isBoss ? comboBossMultiplier() : comboMultiplier();
    game.player.score += Math.round(this.xpValue * game.floor * mul);
    if (game.quest && game.quest.kills !== undefined) game.quest.kills++;
    const baseCr = CREDIT_VALUES[this.type] || 5;
    const cr = Math.round(baseCr * (1 + game.floor * 0.15) * getMetaCreditMultiplier() * d.creditMul);
    game.player.credits += cr;
    if (this.isBoss) game.bossesCleared++;
    // VOLATILE: AoE explosion on death (non-boss, non-chain)
    if (game.modifier === 'VOLATILE' && !this.isBoss && !this._volatileKill) {
      const vr = 2, vdmg = 15 + game.floor * 2;
      spawnParticles(this.x, this.y, 'EXPLOSION', '#ff4422', 18);
      triggerShake(6, 0.2);
      const p = game.player;
      if (dist(p.x, p.y, this.x, this.y) < vr && hasLOS(this.x, this.y, p.x, p.y, game.dungeon.map)) {
        p.takeDamage(vdmg);
      }
      for (const e of enemies) {
        if (e === this || e.dead) continue;
        if (dist(e.x, e.y, this.x, this.y) < vr && hasLOS(this.x, this.y, e.x, e.y, game.dungeon.map)) {
          e._volatileKill = true; // prevent chain explosions
          e.takeDamage(vdmg, 'Volatile');
          if (!e.dead) e._volatileKill = false; // survivors can still explode later
        }
      }
    }
    // SPLITTER: queue 2 SHARDs (deferred to avoid same-frame hits)
    if (this.type === 'SPLITTER') {
      audio.enemySplit();
      spawnParticles(this.x, this.y, 'EXPLOSION', '#00ff88', 15);
      const map = game.dungeon.map;
      for (let s = 0; s < 2; s++) {
        let sx = this.x + rnd(-1, 1), sy = this.y + rnd(-1, 1);
        const fx = Math.floor(sx), fy = Math.floor(sy);
        if (fx < 0 || fy < 0 || fx >= MAP_W || fy >= MAP_H || !isPassable(map[fy][fx])) {
          sx = this.x; sy = this.y;
        }
        pendingEnemySpawns.push({ type: 'SHARD', x: sx, y: sy, floor: game.floor, room: this.room });
      }
    }
  }

  update(dt, player, map) {
    if (this.dead) return;
    this.bobAngle+=dt*3;
    this.flashTimer=Math.max(0,this.flashTimer-dt);
    this.attackTimer=Math.max(0,this.attackTimer-dt);
    this.shootTimer =Math.max(0,this.shootTimer-dt);
    this.spawnCooldown=Math.max(0,this.spawnCooldown-dt);

    const d = dist(this.x,this.y,player.x,player.y);
    const los = d<15 && hasLOS(this.x,this.y,player.x,player.y,map);

    // type-specific AI
    switch(this.type) {
      case 'GUARD':    this.aiGuard(dt,player,map,d,los);    break;
      case 'TURRET':   this.aiTurret(dt,player,map,d,los);   break;
      case 'CRAWLER':  this.aiCrawler(dt,player,map,d,los);  break;
      case 'PHANTOM':  this.aiPhantom(dt,player,map,d,los);  break;
      case 'DRONE':    this.aiDrone(dt,player,map,d,los);    break;
      case 'SHIELDER': this.aiShielder(dt,player,map,d,los); break;
      case 'GRENADIER':this.aiGrenadier(dt,player,map,d,los);break;
      case 'SPLITTER': this.aiSplitter(dt,player,map,d,los);break;
      case 'SHARD':    this.aiShard(dt,player,map,d,los);   break;
      case 'SENTINEL': this.aiBossSentinel(dt,player,map,d,los); break;
      case 'HIVE':     this.aiBossHive(dt,player,map,d,los);     break;
      case 'OMEGA':    this.aiBossOmega(dt,player,map,d,los);    break;
    }
  }

  moveToward(tx,ty,spd,dt,map,ignoreWalls) {
    spd = modSpeed(spd);
    let [dx,dy]=norm(tx-this.x,ty-this.y);
    const nx=this.x+dx*spd*dt, ny=this.y+dy*spd*dt;
    if (ignoreWalls) { this.x=nx; this.y=ny; return; }
    const fx=Math.floor(nx), fy=Math.floor(this.y);
    const xf=Math.floor(this.x), yf=Math.floor(ny);
    if (fx>=0&&fy>=0&&fx<MAP_W&&fy<MAP_H && isPassable(map[fy][fx])) this.x=nx;
    if (xf>=0&&yf>=0&&xf<MAP_W&&yf<MAP_H && isPassable(map[yf][xf])) this.y=ny;
  }

  patrol(dt,map) {
    if (!this.patrolTarget || dist(this.x,this.y,this.patrolTarget.x,this.patrolTarget.y)<0.5) {
      if (this.room) {
        this.patrolTarget={
          x:this.room.x+rnd(1,this.room.w-1),
          y:this.room.y+rnd(1,this.room.h-1)
        };
      }
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,this.spd*0.5,dt,map);
  }

  meleeAttack(player) {
    if (this.attackTimer<=0) {
      player.takeDamage(this.atk);
      this.attackTimer = game.modifier==='OVERCLOCK' ? 0.83 : 1.0;
      spawnParticles(player.x,player.y,'SPARK','#ff4444',5);
    }
  }

  fireAt(px,py,spd,dmg,range,colour) {
    const [dx,dy]=norm(px-this.x,py-this.y);
    projectiles.push(new Projectile(this.x,this.y,dx,dy,spd,dmg,range,colour,false,false));
    audio.shoot(false);
  }

  aiGuard(dt,player,map,d,los) {
    const detectRange = 10 + (game.floor || 1) * 0.4;
    if (los && d<detectRange) { this.state='CHASE'; }
    else if (d>detectRange+2) { this.state='PATROL'; }
    if (this.state==='PATROL') this.patrol(dt,map);
    else {
      this.moveToward(player.x,player.y,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    }
  }

  aiTurret(dt,player,map,d,los) {
    const cooldown = Math.max(1.0, 2.0 - (game.floor || 1) * 0.11) / (game.modifier==='OVERCLOCK'?1.2:1);
    if (los && d<12 && this.shootTimer<=0) {
      this.fireAt(player.x,player.y,8,this.atk,13,'#ffb700');
      this.shootTimer=cooldown;
    }
  }

  aiCrawler(dt,player,map,d,los) {
    if (los||d<8) {
      this.zigzag+=dt*5;
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      const perp={x:-dy,y:dx};
      const tx=player.x+perp.x*Math.sin(this.zigzag)*1.5;
      const ty=player.y+perp.y*Math.sin(this.zigzag)*1.5;
      this.moveToward(tx,ty,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    } else this.patrol(dt,map);
  }

  aiPhantom(dt,player,map,d,los) {
    this.teleportTimer=Math.max(0,this.teleportTimer-dt);
    if (d>3) {
      this.visible=false;
      if (this.teleportTimer<=0 && this.room) {
        this.x=this.room.x+rnd(1,this.room.w-1);
        this.y=this.room.y+rnd(1,this.room.h-1);
        this.teleportTimer=4;
      }
    } else {
      this.visible=true;
      this.moveToward(player.x,player.y,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    }
  }

  aiDrone(dt,player,map,d,los) {
    const cooldown = Math.max(0.9, 1.5 - (game.floor || 1) * 0.07) / (game.modifier==='OVERCLOCK'?1.2:1);
    if (d<15) {
      // Drones respect walls when boss room is sealed
      const canPhase = !game.bossSealed;
      this.moveToward(player.x,player.y,this.spd,dt,map,canPhase);
      if (this.shootTimer<=0) {
        this.fireAt(player.x,player.y,7,this.atk,16,'#00aaff');
        this.shootTimer=cooldown;
      }
    }
  }

  aiShielder(dt,player,map,d,los) {
    // Only update facing when player is visible (prevents wall-hack orientation)
    if (los) this.shieldAngle = Math.atan2(player.y - this.y, player.x - this.x);
    if (los && d < 12) {
      this.state = 'CHASE';
      this.moveToward(player.x, player.y, this.spd, dt, map);
      if (d < 1.2) this.meleeAttack(player);
    } else {
      this.state = 'PATROL';
      this.patrol(dt, map);
    }
  }

  blocksProjectile(proj) {
    // 120° frontal arc shield — blocks player projectiles (not piercing/orbitals)
    if (this.type !== 'SHIELDER' || this.dead) return false;
    // Use reversed projectile direction (where it's coming FROM)
    const incomingAngle = Math.atan2(-proj.dy, -proj.dx);
    let diff = incomingAngle - this.shieldAngle;
    while (diff > Math.PI) diff -= TWO_PI;
    while (diff < -Math.PI) diff += TWO_PI;
    return Math.abs(diff) < Math.PI / 3;
  }

  aiGrenadier(dt,player,map,d,los) {
    this.grenadeTimer = Math.max(0, this.grenadeTimer - dt);
    if (los && d < 5) {
      // Too close — retreat
      const [dx, dy] = norm(this.x - player.x, this.y - player.y);
      const nx = this.x + dx * modSpeed(this.spd) * dt;
      const ny = this.y + dy * modSpeed(this.spd) * dt;
      const fx = Math.floor(nx), fy = Math.floor(this.y);
      const xf = Math.floor(this.x), yf = Math.floor(ny);
      // Only move if passable; if blocked, strafe instead of getting stuck
      let moved = false;
      if (fx >= 0 && fy >= 0 && fx < MAP_W && fy < MAP_H && isPassable(map[fy][fx])) { this.x = nx; moved = true; }
      if (xf >= 0 && yf >= 0 && xf < MAP_W && yf < MAP_H && isPassable(map[yf][xf])) { this.y = ny; moved = true; }
      if (!moved) this.patrol(dt, map); // fallback: strafe/reposition
    } else if (los && d <= 12) {
      // In range — lob grenades
      if (this.grenadeTimer <= 0) {
        this.lobGrenade(player.x, player.y, map);
        this.grenadeTimer = Math.max(2.5, 3.5 - (game.floor || 1) * 0.1) / (game.modifier==='OVERCLOCK'?1.2:1);
      }
    } else if (d > 12 && los) {
      this.moveToward(player.x, player.y, this.spd * 0.7, dt, map);
    } else {
      this.patrol(dt, map);
    }
  }

  lobGrenade(tx, ty, map) {
    // Create a grenade projectile targeting (tx,ty)
    const [dx, dy] = norm(tx - this.x, ty - this.y);
    const g = new Projectile(this.x, this.y, dx, dy, 6, 0, 20, '#ff6622', false, false);
    g.isGrenade = true;
    g.targetX = tx;
    g.targetY = ty;
    g.grenadeDmg = this.atk; // already floor-scaled from spawnEnemy
    projectiles.push(g);
    audio.grenadeLob();
  }

  aiSplitter(dt,player,map,d,los) {
    const speedMul = this.hp < this.maxHp * 0.3 ? 1.3 : 1;
    if (los && d < 10) {
      this.state = 'CHASE';
      this.moveToward(player.x, player.y, this.spd * speedMul, dt, map);
      if (d < 1.2) this.meleeAttack(player);
    } else {
      this.state = 'PATROL';
      this.patrol(dt, map);
    }
  }

  aiShard(dt,player,map,d,los) {
    if (los || d < 8) {
      this.zigzag += dt * 6;
      const [dx, dy] = norm(player.x - this.x, player.y - this.y);
      const perp = { x: -dy, y: dx };
      const tx = player.x + perp.x * Math.sin(this.zigzag) * 1.2;
      const ty = player.y + perp.y * Math.sin(this.zigzag) * 1.2;
      this.moveToward(tx, ty, this.spd, dt, map);
      if (d < 1.2) this.meleeAttack(player);
    } else this.patrol(dt, map);
  }

  aiBossSentinel(dt,player,map,d,los) {
    if (this.hp<100) this.phase=2; else this.phase=1;
    if (this.phase!==this.prevPhase) {
      spawnParticles(this.x,this.y,'EXPLOSION',this.colour,20);
      audio.phaseShift();
      this.prevPhase=this.phase;
    }

    this.bossTimers.laser=(this.bossTimers.laser||0)-dt;
    this.bossTimers.move=(this.bossTimers.move||0)-dt;
    this.bossTimers.shield=(this.bossTimers.shield||0)-dt;

    if (this.bossTimers.move<=0) {
      if (this.room) {
        this.patrolTarget={x:this.room.cx+rnd(-5,5),y:this.room.cy+rnd(-5,5)};
      }
      this.bossTimers.move=2;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,2,dt,map);

    const rate=this.phase===2?2:3;
    if (this.bossTimers.laser<=0) {
      for (let i=0;i<(this.phase===2?8:5);i++) {
        const a=(i/(this.phase===2?8:5))*TWO_PI;
        projectiles.push(new Projectile(this.x,this.y,Math.cos(a),Math.sin(a),7,this.atk,14,'#ff4444',false,false));
      }
      audio.shoot(false);
      this.bossTimers.laser=rate;
    }

    if (this.phase===2 && this.bossTimers.shield<=0) {
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      player.x-=dx*3; player.y-=dy*3;
      clampToBossRoom(player);
      player.takeDamage(Math.round(20*getDiff().enemyAtk));
      spawnParticles(player.x,player.y,'EXPLOSION','#ff4444',8);
      this.bossTimers.shield=5;
    }
  }

  aiBossHive(dt,player,map,d,los) {
    if (this.hp<150) this.phase=3;
    else if (this.hp<350) this.phase=2;
    else this.phase=1;

    if (this.phase!==this.prevPhase) {
      spawnParticles(this.x,this.y,'EXPLOSION',this.colour,20);
      audio.phaseShift();
      game.msg('⚠ HIVE PHASE '+this.phase,'#aa00ff');
      this.prevPhase=this.phase;
    }

    this.bossTimers.homing=(this.bossTimers.homing||0)-dt;
    this.bossTimers.spawn=(this.bossTimers.spawn||0)-dt;
    this.bossTimers.shock=(this.bossTimers.shock||0)-dt;
    this.bossTimers.move=(this.bossTimers.move||0)-dt;

    if (this.bossTimers.move<=0) {
      if (this.room) this.patrolTarget={x:this.room.x+rnd(2,this.room.w-2),y:this.room.y+rnd(2,this.room.h-2)};
      this.bossTimers.move=3;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,1.5,dt,map);

    if (this.bossTimers.homing<=0) {
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      // homing: just fires at player
      this.fireAt(player.x,player.y,6,this.atk,18,'#aa00ff');
      this.bossTimers.homing=2;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192x192.png">
<title>NEON DUNGEON</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #0a0a12; overflow: hidden; width: 100vw; height: 100vh; user-select: none; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Constants ───────────────────────────────────────────────────────────────
let W = 900, H = 600;
let gameScale = 1;
const TILE = 20;
const MAP_W = 80, MAP_H = 50;
const TWO_PI = Math.PI * 2;
const SAVE_VERSION = '9.0';

const T = { VOID:0, WALL:1, FLOOR:2, STAIRS:3, TERMINAL:4, DOOR:5, DOOR_OPEN:6, LOCKED_R:7, LOCKED_B:8, LOCKED_G:9, TRAP_SPIKE:10, TRAP_SLOW:11, PLASMA:12, ARC:13, VENDOR:14, CRACKED:15, LORE:16, CHALLENGE_GATE:17, IMPLANT_SHRINE:18, EVENT_TERMINAL:19 };

// ─── Settings ────────────────────────────────────────────────────────────────
const DEFAULT_KEY_MAP = {
  up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD',
  interact:'KeyE', hackware:'KeyF', voidshard:'KeyV',
  dash:'ShiftLeft', shoot:'Space'
};
const ACTION_LABELS = {
  up:'Move Up', down:'Move Down', left:'Move Left', right:'Move Right',
  interact:'Interact', hackware:'Hackware', voidshard:'Void Shard',
  dash:'Dash', shoot:'Shoot'
};
const RESERVED_KEYS = new Set(['Escape','Enter','KeyQ','Digit1','Digit2','Digit3','Tab']);
const KEY_DISPLAY = k => {
  if (!k) return '???';
  if (k.startsWith('Key')) return k.slice(3);
  if (k.startsWith('Digit')) return k.slice(5);
  if (k.startsWith('Arrow')) return '↑↓←→'[['Up','Down','Left','Right'].indexOf(k.slice(5))] || k.slice(5);
  const map = {ShiftLeft:'L-Shift',ShiftRight:'R-Shift',Space:'Space',
    ControlLeft:'L-Ctrl',ControlRight:'R-Ctrl',AltLeft:'L-Alt',AltRight:'R-Alt',
    Tab:'Tab',Backspace:'Bksp',CapsLock:'Caps',Backquote:'`',
    Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',
    Backslash:'\\',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/'};
  return map[k] || k;
};

const settings = {
  sfxVol: 1.0,
  musicVol: 1.0,
  screenShake: true,
  damageNumbers: true,
  keyMap: { ...DEFAULT_KEY_MAP },
  load() {
    try {
      const raw = JSON.parse(localStorage.getItem('neonDungeonSettings'));
      if (!raw) return;
      if (typeof raw.sfxVol === 'number') this.sfxVol = Math.max(0, Math.min(1, raw.sfxVol));
      if (typeof raw.musicVol === 'number') this.musicVol = Math.max(0, Math.min(1, raw.musicVol));
      if (typeof raw.screenShake === 'boolean') this.screenShake = raw.screenShake;
      if (typeof raw.damageNumbers === 'boolean') this.damageNumbers = raw.damageNumbers;
      if (raw.keyMap && typeof raw.keyMap === 'object') {
        for (const a of Object.keys(DEFAULT_KEY_MAP)) {
          if (typeof raw.keyMap[a] === 'string') this.keyMap[a] = raw.keyMap[a];
        }
      }
    } catch(e) {}
  },
  save() {
    try {
      localStorage.setItem('neonDungeonSettings', JSON.stringify({
        sfxVol: this.sfxVol, musicVol: this.musicVol,
        screenShake: this.screenShake, damageNumbers: this.damageNumbers,
        keyMap: this.keyMap
      }));
    } catch(e) {}
  },
  resetAll() {
    this.sfxVol = 1.0; this.musicVol = 1.0;
    this.screenShake = true; this.damageNumbers = true;
    this.keyMap = { ...DEFAULT_KEY_MAP }; this.save();
  }
};
settings.load();

// Key-map lookup: km('interact') returns the current key code for that action
function km(action) { return settings.keyMap[action]; }
// Alternate keys that always work alongside the mapped key
const ALT_KEYS = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', dash:'ShiftRight' };

// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// Safe-area insets (logical px) for notched devices
let safeTop = 0, safeRight = 0, safeBottom = 0, safeLeft = 0;

let scale = 1, offX = 0, offY = 0;
function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // Scale: smaller viewport dimension maps to ~600 logical px
  // Tiles (20 logical px) appear as 20 × gameScale CSS px on screen
  // Clamped so tiles stay between ~14 CSS px (0.7) and ~30 CSS px (1.5)
  gameScale = clamp(Math.min(vw, vh) / 600, 0.7, 1.5);
  W = Math.round(vw / gameScale);
  H = Math.round(vh / gameScale);
  canvas.width = W;
  canvas.height = H;
  scale = gameScale;
  offX = 0;
  offY = 0;
  // Read safe-area insets from CSS env() and convert to logical px
  const cs = getComputedStyle(document.documentElement);
  safeTop    = (parseFloat(cs.getPropertyValue('--sat')) || 0) / gameScale;
  safeRight  = (parseFloat(cs.getPropertyValue('--sar')) || 0) / gameScale;
  safeBottom = (parseFloat(cs.getPropertyValue('--sab')) || 0) / gameScale;
  safeLeft   = (parseFloat(cs.getPropertyValue('--sal')) || 0) / gameScale;
  updateLayout();
  console.log(`[NEON DUNGEON] ${vw}×${vh} → ${W}×${H} (×${gameScale.toFixed(2)}) tile=${(TILE*gameScale).toFixed(1)}css-px compact=${layout.compact}`);
}
// resize() + event listener registered in Boot section (after all defs are ready)

// ─── Layout (shared HUD / bottom-UI metrics) ────────────────────────────────
const layout = { compact: false, hudH: 40, hudTop: 0, msgBase: 0 };
function updateLayout() {
  layout.compact = H > W && W <= 600;
  layout.hudH    = layout.compact ? 58 : 40;
  layout.hudTop  = H - layout.hudH - safeBottom;
  layout.msgBase = layout.hudTop - 12;
}

// ─── Fullscreen (landscape auto-request, portrait auto-exit) ─────────────────
const fsApi = {
  request: canvas.requestFullscreen ? 'requestFullscreen'
         : canvas.webkitRequestFullscreen ? 'webkitRequestFullscreen' : null,
  exit: document.exitFullscreen ? 'exitFullscreen'
      : document.webkitExitFullscreen ? 'webkitExitFullscreen' : null,
  element: () => document.fullscreenElement ?? document.webkitFullscreenElement,
  supported: !!(canvas.requestFullscreen || canvas.webkitRequestFullscreen),
};
let fsWantLandscape = false;   // true when landscape but no gesture yet
let fsDismissed = false;       // user tapped X to dismiss the prompt this session

function isLandscape() {
  if (screen.orientation) return screen.orientation.type.startsWith('landscape');
  return window.innerWidth > window.innerHeight;
}

function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function tryFullscreen() {
  if (!fsApi.supported || fsApi.element()) return;
  try {
    const ret = document.documentElement[fsApi.request]?.();
    if (ret && typeof ret.catch === 'function') ret.catch(() => {});
  } catch (_) {}
}

function exitFullscreen() {
  if (!fsApi.element()) return;
  try {
    const ret = document[fsApi.exit]?.();
    if (ret && typeof ret.catch === 'function') ret.catch(() => {});
  } catch (_) {}
}

let fsWasLandscape = false;
function onOrientationChange() {
  if (!isTouchDevice()) return;
  const landscape = isLandscape();
  if (landscape) {
    fsWantLandscape = true;
    // only reset dismiss on actual portrait→landscape transition
    if (!fsWasLandscape) fsDismissed = false;
  } else {
    fsWantLandscape = false;
    exitFullscreen();
  }
  fsWasLandscape = landscape;
}

if (screen.orientation) {
  screen.orientation.addEventListener('change', onOrientationChange);
} else {
  window.addEventListener('orientationchange', onOrientationChange);
}
// also recheck on resize (some browsers fire resize instead of orientationchange)
window.addEventListener('resize', onOrientationChange);
// set initial state
onOrientationChange();

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = new Set();
const mouse = { x: W/2, y: H/2, down: false };
let justPressed = new Set();
let justReleased = new Set();
let lastKey = '';
let nameEntryTap = null;

window.addEventListener('keydown', e => {
  if (!keys.has(e.code)) justPressed.add(e.code);
  keys.add(e.code);
  lastKey = e.key;
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys.delete(e.code);
  justReleased.add(e.code);
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * canvas.width / r.width;
  mouse.y = (e.clientY - r.top)  * canvas.height / r.height;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; justPressed.add('MouseLeft'); audio.resume(); });
canvas.addEventListener('mouseup',   e => { mouse.down = false; });
window.addEventListener('mouseup',   e => { mouse.down = false; });

// ─── Touch Controls ──────────────────────────────────────────────────────────
const JR = 55; // joystick base radius
const touch = {
  joystick: { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0 },
  aim:      { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0, shooting:false },
  // button touch IDs
  btnE: null, btnV: null, btnF: null, btnDash: null, btnPause: null,
};

// Button definitions — positions updated dynamically by updateBtns()
const BTNS = {
  E:     { x:0, y:0, r:30, label:'E',  colour:'#00f5ff' },
  F:     { x:0, y:0, r:28, label:'F',  colour:'#ff8800', hidden:true },
  V:     { x:0, y:0, r:28, label:'V',  colour:'#aa00ff' },
  DASH:  { x:0, y:0, r:28, label:'⇧',  colour:'#ffb700' },
  PAUSE: { x:0, y:0, r:20, label:'II', colour:'#ff00c8' },
};
function updateBtns() {
  // Scale up buttons on small screens (min ~44 CSS px diameter)
  const minR = 22 / gameScale;
  BTNS.E.r     = Math.max(30, minR);
  BTNS.F.r     = Math.max(28, minR);
  BTNS.V.r     = Math.max(28, minR);
  BTNS.DASH.r  = Math.max(28, minR);
  BTNS.PAUSE.r = Math.max(20, Math.ceil(minR * 0.7));
  // Show F button only when player has hackware equipped
  BTNS.F.hidden = !(game.player && game.player.hackware);
  // Position from edges, respecting safe-area insets
  const pr = Math.max(10, safeRight);
  const pb = Math.max(10, safeBottom);
  const pt = Math.max(10, safeTop);
  const btnY = layout.hudTop - BTNS.E.r - 16;
  BTNS.E.x     = W - pr - 230;
  BTNS.E.y     = btnY;
  BTNS.DASH.x  = W - pr - 160;
  BTNS.DASH.y  = btnY;
  BTNS.F.x     = W - pr - 90;
  BTNS.F.y     = btnY;
  BTNS.V.x     = W - pr - 20;
  BTNS.V.y     = btnY - 55;
  BTNS.PAUSE.x = W - pr - 30;
  BTNS.PAUSE.y = pt + 30;
}

function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX - r.left) * canvas.width / r.width,
          (clientY - r.top)  * canvas.height / r.height];
}

function hitBtn(cx, cy, btn) {
  const dx=cx-btn.x, dy=cy-btn.y;
  // Expand hit area on small screens to meet minimum touch target
  const hitR = Math.max(btn.r, 22 / gameScale);
  return dx*dx+dy*dy <= hitR*hitR;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  audio.resume();
  // check if any touch hit the fullscreen dismiss button first
  let dismissed = false;
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    if (fsWantLandscape && !fsApi.element() && !fsDismissed
        && cx < 48 && cy < 48) {
      fsDismissed = true; dismissed = true;
    }
  }
  // piggyback on user gesture: request fullscreen if landscape wants it
  if (!dismissed && fsWantLandscape && !fsApi.element() && !fsDismissed) tryFullscreen();
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    // skip the dismiss touch (already handled above)
    if (cx < 48 && cy < 48 && dismissed) continue;
    // In non-playing states, any touch acts as confirm (except NAME_ENTRY, POWERUP_CHOICE)
    if (game.state !== 'PLAYING' && game.state !== 'FADE') {
      if (game.state === 'NAME_ENTRY') { nameEntryTap=[cx,cy]; continue; }
      if (game.state === 'POWERUP_CHOICE' || game.state === 'SHOPPING' || game.state === 'PERK_CHOICE' || game.state === 'AUGMENT_CHOICE' || game.state === 'EVENT_CHOICE') {
        // Route touch position via mouse so update handler handles it
        mouse.x = cx; mouse.y = cy;
        justPressed.add('MouseLeft');
        continue;
      }
      if (game.state === 'SETTINGS') {
        mouse.x = cx; mouse.y = cy;
        justPressed.add('MouseLeft');
        continue;
      }
      if (game.state === 'PAUSED') {
        // 3 zones: top third = resume, middle third = settings, bottom third = quit
        if (cy < H * 0.38) justPressed.add('Escape');
        else if (cy < H * 0.62) justPressed.add('KeyS');
        else justPressed.add('KeyQ');
      }
      else if (game.state === 'MENU') {
        // Hit-test against actual menu item positions
        const narrow = layout.compact;
        const titleFs = narrow ? 48 : 72;
        const ty1 = narrow ? 120 : 160;
        const startY = ty1 + titleFs * 0.95 + 80;
        const gap = narrow ? 24 : 28;
        const opts = game.getMenuOptions();
        // Find closest option
        let best = 0, bestDist = Infinity;
        for (let i = 0; i < opts.length; i++) {
          const oy = startY + i * gap;
          const d = Math.abs(cy - oy);
          if (d < bestDist) { bestDist = d; best = i; }
        }
        game.menuSel = best;
        // On the difficulty row, left/right edge taps cycle, center taps start
        if (opts[best]?.isDiffRow && Math.abs(cy - (startY + best * gap)) < gap * 0.7) {
          if (cx < W * 0.35) justPressed.add('ArrowLeft');
          else if (cx > W * 0.65) justPressed.add('ArrowRight');
          else justPressed.add('Enter');
        } else {
          justPressed.add('Enter');
        }
      }
      else if (game.state === 'ARCHIVES') {
        // Hit-test against upgrade rows or back button
        const narrow = layout.compact;
        const startY = narrow ? 95 : 120;
        const rowH = narrow ? 42 : 50;
        if (cy > H - 60) {
          // Back button area
          justPressed.add('Escape');
        } else {
          // Find closest upgrade row
          let best = 0, bestDist = Infinity;
          for (let i = 0; i < META_UPGRADES.length; i++) {
            const oy = startY + i * rowH;
            const d = Math.abs(cy - oy);
            if (d < bestDist) { bestDist = d; best = i; }
          }
          game.archivesSel = best;
          justPressed.add('Enter');
        }
      }
      else { justPressed.add('Enter'); justPressed.add('MouseLeft'); }
      continue;
    }
    // button priority
    // Expanded map: any tap closes (modal — takes priority)
    if (game.mapExpanded) { justPressed.add('Tab'); continue; }
    if (hitBtn(cx,cy,BTNS.E))     { touch.btnE=t.identifier; justPressed.add(km('interact')); continue; }
    if (!BTNS.F.hidden && hitBtn(cx,cy,BTNS.F)) { touch.btnF=t.identifier; justPressed.add(km('hackware')); continue; }
    if (hitBtn(cx,cy,BTNS.V))     { touch.btnV=t.identifier; justPressed.add(km('voidshard')); continue; }
    if (hitBtn(cx,cy,BTNS.DASH))  { touch.btnDash=t.identifier; justPressed.add(km('dash')); continue; }
    if (hitBtn(cx,cy,BTNS.PAUSE)) { touch.btnPause=t.identifier; justPressed.add('Escape'); continue; }
    // Tap minimap area to expand (after buttons so pause isn't stolen)
    const _mx = W - 120 - 8 - safeRight, _my = 8 + safeTop;
    if (cx >= _mx - 2 && cx <= _mx + 122 && cy >= _my - 2 && cy <= _my + 82) { justPressed.add('Tab'); continue; }
    // left half = joystick
    if (cx < W/2 && !touch.joystick.active) {
      touch.joystick.active=true; touch.joystick.id=t.identifier;
      touch.joystick.baseX=cx;   touch.joystick.baseY=cy;
      touch.joystick.dx=0;       touch.joystick.dy=0;
    } else if (cx >= W/2 && !touch.aim.active) {
      touch.aim.active=true; touch.aim.id=t.identifier;
      touch.aim.baseX=cx; touch.aim.baseY=cy;
      touch.aim.dx=0; touch.aim.dy=0; touch.aim.shooting=true;
      // Initialise mouse position so first shot aims toward the tap
      mouse.x=cx; mouse.y=cy;
      justPressed.add('MouseLeft');
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const [cx, cy] = toCanvas(t.clientX, t.clientY);
    if (t.identifier === touch.joystick.id) {
      let dx=cx-touch.joystick.baseX, dy=cy-touch.joystick.baseY;
      const len=Math.sqrt(dx*dx+dy*dy);
      if (len>JR) { dx=dx/len*JR; dy=dy/len*JR; }
      touch.joystick.dx=dx/JR; touch.joystick.dy=dy/JR;
    }
    if (t.identifier === touch.aim.id) {
      let adx=cx-touch.aim.baseX, ady=cy-touch.aim.baseY;
      const alen=Math.sqrt(adx*adx+ady*ady);
      if (alen>JR) { adx=adx/alen*JR; ady=ady/alen*JR; }
      touch.aim.dx=adx/JR; touch.aim.dy=ady/JR;
      touch.aim.shooting=true;
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier===touch.joystick.id) { touch.joystick.active=false; touch.joystick.dx=0; touch.joystick.dy=0; }
    if (t.identifier===touch.aim.id)      { touch.aim.active=false; touch.aim.shooting=false; touch.aim.dx=0; touch.aim.dy=0; mouse.down=false; }
    if (t.identifier===touch.btnE)   touch.btnE=null;
    if (t.identifier===touch.btnF)   touch.btnF=null;
    if (t.identifier===touch.btnV)   touch.btnV=null;
    if (t.identifier===touch.btnDash) touch.btnDash=null;
    if (t.identifier===touch.btnPause) touch.btnPause=null;
  }
}, {passive:false});

canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  resetTouch();
}, {passive:false});

function resetTouch() {
  touch.joystick.active=false; touch.joystick.id=null; touch.joystick.dx=0; touch.joystick.dy=0;
  touch.aim.active=false; touch.aim.id=null; touch.aim.dx=0; touch.aim.dy=0; touch.aim.shooting=false;
  touch.btnE=null; touch.btnF=null; touch.btnV=null; touch.btnDash=null; touch.btnPause=null;
  mouse.down=false;
}

function drawTouchUI() {
  // Update F button visibility per-frame (player may equip hackware mid-run)
  BTNS.F.hidden = !(game.player && game.player.hackware);
  // Left joystick (move)
  if (touch.joystick.active) {
    const {baseX:bx,baseY:by,dx,dy}=touch.joystick;
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#00f5ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,JR,0,TWO_PI); ctx.stroke();
    ctx.fillStyle='#00f5ff';
    ctx.beginPath(); ctx.arc(bx+dx*JR,by+dy*JR,18,0,TWO_PI); ctx.fill();
    ctx.restore();
  } else {
    // ghost move joystick hint
    const hintY = layout.hudTop - 26;
    ctx.save(); ctx.globalAlpha=0.12;
    ctx.strokeStyle='#00f5ff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(80, hintY, JR, 0, TWO_PI); ctx.stroke();
    ctx.fillStyle='#00f5ff';
    ctx.beginPath(); ctx.arc(80, hintY, 18, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // Right joystick (aim)
  if (touch.aim.active) {
    const {baseX:bx,baseY:by,dx,dy}=touch.aim;
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#ff00c8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,JR,0,TWO_PI); ctx.stroke();
    ctx.fillStyle='#ff00c8';
    ctx.beginPath(); ctx.arc(bx+dx*JR,by+dy*JR,18,0,TWO_PI); ctx.fill();
    ctx.restore();
  } else {
    // ghost aim joystick hint
    const hintY = layout.hudTop - 26;
    ctx.save(); ctx.globalAlpha=0.12;
    ctx.strokeStyle='#ff00c8'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(W/2+80, hintY, JR, 0, TWO_PI); ctx.stroke();
    ctx.fillStyle='#ff00c8';
    ctx.beginPath(); ctx.arc(W/2+80, hintY, 18, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // Buttons
  for (const [key,btn] of Object.entries(BTNS)) {
    if (btn.hidden) continue;
    const active = (key==='E'&&touch.btnE!==null)||(key==='F'&&touch.btnF!==null)||(key==='V'&&touch.btnV!==null)||(key==='DASH'&&touch.btnDash!==null)||(key==='PAUSE'&&touch.btnPause!==null);
    ctx.save();
    // Show cooldown overlay on dash button
    if (key==='DASH' && game.player && game.player.dashCooldown > 0) {
      ctx.globalAlpha = 0.25;
    } else if (key==='F' && game.player && game.player.hackwareCooldown > 0) {
      ctx.globalAlpha = 0.25;
    } else {
      ctx.globalAlpha = active ? 0.9 : 0.45;
    }
    ctx.shadowBlur=10; ctx.shadowColor=btn.colour;
    ctx.strokeStyle=btn.colour; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r,0,TWO_PI); ctx.stroke();
    ctx.fillStyle=btn.colour+'33';
    ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r,0,TWO_PI); ctx.fill();
    ctx.fillStyle=btn.colour; ctx.font=`bold ${key==='PAUSE'?11:14}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(btn.label,btn.x,btn.y);
    ctx.restore();
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // Fullscreen prompt (landscape, not fullscreen, not dismissed, API available)
  if (fsWantLandscape && !fsApi.element() && !fsDismissed && fsApi.supported) {
    ctx.save();
    ctx.globalAlpha = 0.7;
    // pill background
    const pw = 180, ph = 32, px = (W - pw) / 2, py = 6;
    ctx.fillStyle = '#0a0a12';
    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(px, py, pw, ph);
    ctx.fill(); ctx.stroke();
    // text
    ctx.fillStyle = '#00f5ff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TAP FOR FULLSCREEN', W / 2, py + ph / 2);
    // dismiss X button (top-left corner)
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ff00c8';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×', 24, 22);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function jp(code) { return justPressed.has(code); }
function clearJust() { justPressed.clear(); justReleased.clear(); lastKey=''; nameEntryTap=null; }

// ─── Utilities ───────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function dist(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function dist2(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function norm(dx, dy) { const l=Math.sqrt(dx*dx+dy*dy)||1; return [dx/l, dy/l]; }
function lerp(a, b, t) { return a + (b-a)*t; }
function clampToBossRoom(entity) {
  if (!game.bossSealed || !game.bossRoom) return;
  const r = game.bossRoom;
  entity.x = Math.max(r.x + 0.5, Math.min(r.x + r.w - 0.5, entity.x));
  entity.y = Math.max(r.y + 0.5, Math.min(r.y + r.h - 0.5, entity.y));
}

function hasLOS(x1, y1, x2, y2, map) {
  let cx = Math.floor(x1), cy = Math.floor(y1);
  const ex = Math.floor(x2), ey = Math.floor(y2);
  let dx = Math.abs(ex-cx), dy = Math.abs(ey-cy);
  let sx = cx<ex?1:-1, sy = cy<ey?1:-1;
  let err = dx - dy;
  for (let i=0; i<100; i++) {
    if (cx===ex && cy===ey) return true;
    if (cx<0||cy<0||cx>=MAP_W||cy>=MAP_H) return false;
    if (!isSeeThrough(map[cy][cx])) return false;
    const e2 = 2*err;
    let nx = cx, ny = cy;
    if (e2 > -dy) { err -= dy; nx += sx; }
    if (e2 <  dx) { err += dx; ny += sy; }
    // Diagonal corner-cut block: can't see through touching wall corners
    if (nx !== cx && ny !== cy) {
      if (!isSeeThrough(map[cy]?.[nx]) && !isSeeThrough(map[ny]?.[cx])) return false;
    }
    cx = nx; cy = ny;
  }
  return true;
}

// Tile helpers
function isPassable(t) { return t===T.FLOOR||t===T.STAIRS||t===T.TERMINAL||t===T.DOOR_OPEN||t===T.TRAP_SPIKE||t===T.TRAP_SLOW||t===T.PLASMA||t===T.ARC||t===T.VENDOR||t===T.LORE||t===T.CHALLENGE_GATE||t===T.IMPLANT_SHRINE||t===T.EVENT_TERMINAL; }
function isSeeThrough(t) {
  return t!==T.WALL && t!==T.VOID && t!==T.CRACKED && t!==T.DOOR && t!==T.LOCKED_R && t!==T.LOCKED_B && t!==T.LOCKED_G;
}
function isDoor(t) { return t===T.DOOR||t===T.LOCKED_R||t===T.LOCKED_B||t===T.LOCKED_G; }
function doorKeyColour(t) { return t===T.LOCKED_R?'red':t===T.LOCKED_B?'blue':t===T.LOCKED_G?'gold':null; }

// ─── Audio Engine ────────────────────────────────────────────────────────────
const audio = (() => {
  let actx = null, master = null, compressor = null, reverbNode = null,
      reverbGain = null, noiseBuf = null, musicBus = null;

  function getCtx() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // Master bus: compressor → destination
      compressor = actx.createDynamicsCompressor();
      compressor.threshold.value = -12;
      compressor.ratio.value = 4;
      compressor.connect(actx.destination);
      master = actx.createGain();
      master.gain.value = 0.7 * settings.sfxVol;
      master.connect(compressor);
      // Reverb bus: ConvolverNode with procedural impulse response
      reverbNode = actx.createConvolver();
      const irLen = actx.sampleRate * 1.6;
      const irBuf = actx.createBuffer(2, irLen, actx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = irBuf.getChannelData(ch);
        for (let i = 0; i < irLen; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.5);
        }
      }
      reverbNode.buffer = irBuf;
      reverbGain = actx.createGain();
      reverbGain.gain.value = 0.35;
      reverbNode.connect(reverbGain);
      reverbGain.connect(master);
      // Cached noise buffer (2 seconds, reused by all noise calls)
      const nLen = actx.sampleRate * 2;
      noiseBuf = actx.createBuffer(1, nLen, actx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
    }
    return actx;
  }

  function resume() { const c = getCtx(); if (c.state === 'suspended') c.resume(); }

  // Core voice: oscillator → gain → target node
  function osc(type, freq1, freq2, vol, start, dur, target) {
    const c = getCtx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq1, start);
    if (freq2 !== freq1) o.frequency.exponentialRampToValueAtTime(Math.max(freq2, 1), start + dur);
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g); g.connect(target || master);
    o.start(start); o.stop(start + dur + 0.02);
  }

  // Noise burst from cached buffer
  function noise(vol, start, dur, filterFreq, target) {
    const c = getCtx();
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = filterFreq || 800;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    src.connect(flt); flt.connect(g); g.connect(target || master);
    src.start(start); src.stop(start + dur + 0.02);
  }

  // Reverb send helper — routes signal to both dry and wet buses
  // lifetime: seconds until all voices through this bus have finished (excludes reverb tail)
  function wetDry(vol, wetAmt, lifetime) {
    const c = getCtx();
    const split = c.createGain();
    split.gain.value = vol;
    const dry = c.createGain();
    dry.gain.value = 1;
    const wet = c.createGain();
    wet.gain.value = wetAmt;
    split.connect(dry); dry.connect(master);
    split.connect(wet); wet.connect(reverbNode);
    // Schedule cleanup after voices + reverb tail finish
    const cleanup = () => { split.disconnect(); dry.disconnect(); wet.disconnect(); };
    setTimeout(cleanup, (lifetime + 2.0) * 1000);
    return split;
  }

  return {
    resume,
    setSfxVolume(v) {
      settings.sfxVol = v;
      if (master) { const t = actx.currentTime; master.gain.cancelScheduledValues(t); master.gain.linearRampToValueAtTime(0.7 * v, t + 0.02); }
    },
    setMusicVolume(v) {
      settings.musicVol = v;
      if (musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.linearRampToValueAtTime(0.12 * v, t + 0.02); }
    },
    getMusicBus() {
      const c = getCtx();
      if (!musicBus) {
        const mc = c.createDynamicsCompressor();
        mc.threshold.value = -18; mc.ratio.value = 2; mc.attack.value = 0.05;
        mc.connect(c.destination);
        musicBus = c.createGain();
        musicBus.gain.value = 0.12 * settings.musicVol;
        musicBus.connect(mc);

    },
    shoot(isPlayer, weapon) {
      const c = getCtx(); const t = c.currentTime;
      if (!isPlayer) {

// ─── Procedural Music ────────────────────────────────────────────────────────
const music = (() => {
  let bus = null, ctx = null;
  let state = 'idle';
  let floor = 1;
  let nextBeat = 0, beat = 0;
  let paused = false;
  let hatBuf = null; // cached noise buffer for hi-hats
  let droneGen = 0;  // generation counter for stopDrone setTimeout safety

  // Layer gain nodes
  let droneG = null, pulseG = null, arpG = null, bassG = null;
  // Persistent drone oscillators
  let droneOsc1 = null, droneOsc2 = null, droneFilter = null, droneLFO = null;

  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  // Floor-dependent musical parameters
  const TIERS = [
    { root: 36, bpm: 100 }, // C2, floors 1-3
    { root: 34, bpm: 110 }, // Bb1, floors 4-6
    { root: 32, bpm: 120 }, // Ab1, floors 7-9
    { root: 29, bpm: 130 }, // F1, floor 10
  ];
  // Minor pentatonic intervals (semitones from root)
  const PENTA = [0, 3, 5, 7, 10];

  function tier() { return floor <= 3 ? 0 : floor <= 6 ? 1 : floor <= 9 ? 2 : 3; }
  function params() { return TIERS[tier()]; }
  function beatDur() {
    const base = 60 / params().bpm;
    if (state === 'combat') return base * 0.85;
    if (state === 'boss') return base * 0.75;
    return base;
  }

  // Target gains per music state
  const TARGETS = {
    idle:    [0, 0, 0, 0],       // [drone, pulse, arp, bass]
    explore: [1, 0, 0.6, 0],
    combat:  [0.8, 1, 0.25, 0.7],
    boss:    [1.1, 1, 0, 1],
    tension: [0.7, 0.4, 0.35, 0],
  };

  function rampGains(dur) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const tgt = TARGETS[state] || TARGETS.idle;
    const gains = [droneG, pulseG, arpG, bassG];
    for (let i = 0; i < 4; i++) {
      if (!gains[i]) continue;
      gains[i].gain.cancelScheduledValues(t);
      gains[i].gain.setValueAtTime(gains[i].gain.value, t);
      gains[i].gain.linearRampToValueAtTime(tgt[i], t + dur);
    }
  }

  function ensureInit() {
    if (bus) return;
    const ab = audio.getMusicBus();
    bus = ab.bus; ctx = ab.ctx;
    droneG = ctx.createGain(); droneG.gain.value = 0; droneG.connect(bus);
    pulseG = ctx.createGain(); pulseG.gain.value = 0; pulseG.connect(bus);
    arpG   = ctx.createGain(); arpG.gain.value = 0;   arpG.connect(bus);
    bassG  = ctx.createGain(); bassG.gain.value = 0;   bassG.connect(bus);
    // Pre-allocate noise buffer for hi-hats (avoid per-beat GC)
    const nLen = Math.ceil(ctx.sampleRate * 0.1);
    hatBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);
    const nd = hatBuf.getChannelData(0);
    for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
  }

  // ── Drone: 2 detuned saws → lowpass → droneG, LFO on filter ──
  function startDrone() {
    if (!ctx || droneOsc1) return;
    const root = midi(params().root);
    const t = ctx.currentTime;

    droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 180;
    droneFilter.Q.value = 2;
    droneFilter.connect(droneG);

    droneOsc1 = ctx.createOscillator();
    droneOsc1.type = 'sawtooth';
    droneOsc1.frequency.value = root;
    droneOsc1.connect(droneFilter);
    droneOsc1.start(t);

    droneOsc2 = ctx.createOscillator();
    droneOsc2.type = 'sawtooth';
    droneOsc2.frequency.value = root * 1.005; // slight detune
    droneOsc2.connect(droneFilter);
    droneOsc2.start(t);

    // LFO modulates filter cutoff for movement
    droneLFO = ctx.createOscillator();
    droneLFO.type = 'sine';
    droneLFO.frequency.value = 0.15; // very slow
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 60; // ±60Hz modulation
    droneLFO.connect(lfoGain);
    lfoGain.connect(droneFilter.frequency);
    droneLFO.start(t);
    droneLFO._lfoGain = lfoGain; // ref for cleanup
  }

  function stopDrone() {
    const t = ctx ? ctx.currentTime : 0;
    [droneOsc1, droneOsc2, droneLFO].forEach(o => {
      if (o) { try { o.stop(t + 0.1); } catch(e){} }
    });
    if (droneLFO && droneLFO._lfoGain) droneLFO._lfoGain.disconnect();
    if (droneFilter) droneFilter.disconnect();
    droneOsc1 = droneOsc2 = droneLFO = droneFilter = null;
  }

  function retuneDrone() {
    if (!droneOsc1 || !ctx) return;
    const root = midi(params().root);
    const t = ctx.currentTime;
    droneOsc1.frequency.exponentialRampToValueAtTime(root, t + 2);
    droneOsc2.frequency.exponentialRampToValueAtTime(root * 1.005, t + 2);
  }

  // ── Pulse: kick + hat pattern ──
  function schedPulse(t) {
    const isKick = beat % 4 === 0 || beat % 4 === 2;
    const isOpen = beat % 4 === 1 || beat % 4 === 3;

    if (isKick) {
      // Sub kick: sine sweep 80→40Hz
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(80, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      g.gain.setValueAtTime(0.8, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); g.connect(pulseG);
      o.start(t); o.stop(t + 0.2);
    }

    // Hi-hat: noise burst from cached buffer
    const nb = ctx.createBufferSource();
    nb.buffer = hatBuf;
    const hf = ctx.createBiquadFilter();
    hf.type = 'highpass';
    hf.frequency.value = 8000;
    const hg = ctx.createGain();
    const hatVol = isOpen ? 0.5 : 0.3;
    const hatDur = isOpen ? 0.08 : 0.04;
    hg.gain.setValueAtTime(hatVol, t);
    hg.gain.exponentialRampToValueAtTime(0.001, t + hatDur);
    nb.connect(hf); hf.connect(hg); hg.connect(pulseG);
    nb.start(t); nb.stop(t + hatDur + 0.01);
  }

  // ── Arp: pentatonic notes ──
  const arpPatterns = [
    [0, 2, 4, 2],  // root, 5th, octave+3rd, 5th
    [1, 3, 0, 4],  // b3, 5, root, b7
    [2, 0, 3, 1],  // 4th, root, 5th, b3
  ];

  function schedArp(t) {
    // Play on 8th notes, 70% probability for variation
    if (Math.random() > 0.7) return;
    const p = params();
    const pattern = arpPatterns[tier() % arpPatterns.length];
    const idx = pattern[beat % pattern.length];
    const note = p.root + 12 + PENTA[idx]; // one octave up
    const freq = midi(note);

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    // Gentle attack/release
    const dur = beatDur() * 0.4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.35, t + 0.01);
    g.gain.setValueAtTime(0.35, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(arpG);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ── Bass: root note pulses ──
  function schedBass(t) {
    // 8th notes in combat, quarter in boss
    if (state === 'boss' && beat % 2 !== 0) return;
    const p = params();
    const freq = midi(p.root + 12); // bass one octave up from drone

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    const dur = beatDur() * 0.5;
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(bassG);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ── Public API ──
  return {
    setState(s) {
      if (s === state) return;
      ensureInit();
      const prev = state;
      state = s;
      if (s === 'idle') {
        rampGains(1.5);
        const gen = ++droneGen;
        setTimeout(() => { if (state === 'idle' && droneGen === gen) stopDrone(); }, 2000);
      } else {
        if (!droneOsc1) startDrone();
        rampGains(state === 'boss' ? 0.8 : 1.5);
      }
      // Reset beat scheduling on non-idle transition from idle
      if (prev === 'idle' && s !== 'idle' && ctx) {
        nextBeat = ctx.currentTime + 0.1;
        beat = 0;
      }
    },

    setFloor(n) {
      floor = n;
      retuneDrone();
    },

    pause() {
      if (!ctx || paused) return;
      paused = true;
      // Mute all layers quickly
      const t = ctx.currentTime;
      [droneG, pulseG, arpG, bassG].forEach(g => {
        if (g) {
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(0, t + 0.3);
        }
      });
    },

    resume() {
      if (!ctx || !paused) return;
      paused = false;
      nextBeat = ctx.currentTime + 0.1;
      rampGains(0.5);
    },

    tick() {
      if (!ctx || state === 'idle' || paused) return;
      const now = ctx.currentTime;
      const bd = beatDur();
      const lookahead = 0.25;

      // Drift protection: if we fell more than 1s behind (tab throttled), snap forward
      if (nextBeat < now - 1) nextBeat = now + 0.05;

      while (nextBeat < now + lookahead) {
        const t = nextBeat;
        const tgt = TARGETS[state];
        if (tgt[1] > 0) schedPulse(t); // pulse layer active
        if (tgt[2] > 0) schedArp(t);   // arp layer active
        if (tgt[3] > 0) schedBass(t);  // bass layer active
        nextBeat += bd / 2; // schedule on 8th notes
        beat++;
      }
    },

    stop() {
      this.setState('idle');
    }
  };
})();

const HACKWARE = {
  EMP_BURST:    { name:'EMP Burst',    desc:'Stun nearby enemies for 2s',      colour:'#00ddff', icon:'⚡', cooldown:10 },
  PHASE_CLOAK:  { name:'Phase Cloak',  desc:'2.5s invisibility & immunity',    colour:'#cc44ff', icon:'◇', cooldown:14 },

};
const HACKWARE_KEYS = Object.keys(HACKWARE);

let hackwareEffects = []; // active world-space hackware effects (gravity wells, swarm particles)

function canTargetPlayer() {
  const p = game.player;
  if (!p || p.hp <= 0) return false;
  if (p.cloakTimer > 0) return false;
  return true;
}

function isPlayerDamageImmune() {
  const p = game.player;
  if (!p) return false;
  if (p.dashTimer > 0) return true;
  if (p.cloakTimer > 0) return true;
  return false;
}

function activateHackware(player) {
  if (!player.hackware || player.hackwareCooldown > 0 || player.hp <= 0) return;
  const hw = HACKWARE[player.hackware];
  if (!hw) return;
  player.hackwareCooldown = hw.cooldown * (hasAugment('OVERCLOCKER') ? 0.7 : 1);
  const map = game.dungeon ? game.dungeon.map : null;

  switch (player.hackware) {
    case 'EMP_BURST': {
      audio.hackwareEMP();
      spawnParticles(player.x, player.y, 'EXPLOSION', '#00ddff', 20);
      triggerShake(5, 0.2);
      const radius = 4;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(player.x, player.y, e.x, e.y);
        if (d < radius && map && hasLOS(player.x, player.y, e.x, e.y, map)) {
          const dur = e.isBoss ? 1 : 2; // bosses get reduced stun
          e.stunTimer = Math.max(e.stunTimer || 0, dur);
          spawnParticles(e.x, e.y, 'SPARK', '#00ddff', 4);
          spawnDmgText(e.x, e.y, 'STUN', '#00ddff');
        }
      }
      // Visual: expanding ring effect
      hackwareEffects.push({ type:'emp_ring', x:player.x, y:player.y, age:0, maxAge:0.4, radius });
      break;
    }
    case 'PHASE_CLOAK': {
      audio.hackwareCloak();
      player.cloakTimer = 2.5;
      spawnParticles(player.x, player.y, 'EXPLOSION', '#cc44ff', 12);
      game.msg('◇ PHASE CLOAK ACTIVE', '#cc44ff');
      break;
    }
    case 'NANO_SWARM': {
      audio.hackwareSwarm();
      spawnParticles(player.x, player.y, 'SPARK', '#44ff88', 8);
      for (let i = 0; i < 6; i++) {
        const angle = (TWO_PI / 6) * i;
        hackwareEffects.push({
          type:'swarm', x:player.x, y:player.y,
          vx:Math.cos(angle)*3, vy:Math.sin(angle)*3,
          age:0, maxAge:4, dmg:8, hitCd:0
        });
      }
      break;
    }
    case 'GRAVITY_WELL': {
      audio.hackwareGravity();
      // Place at aim position
      const cam = getCamera(player);
      const wx = (mouse.x + cam.x) / TILE;
      const wy = (mouse.y + cam.y) / TILE;
      hackwareEffects.push({
        type:'gravity', x:wx, y:wy, age:0, maxAge:3, radius:5
      });
      spawnParticles(wx, wy, 'EXPLOSION', '#ff8800', 15);
      triggerShake(3, 0.15);
      break;
    }
    case 'STATIC_FIELD': {
      audio.hackwareStaticField();
      // Place at aim position (same pattern as Gravity Well)
      const cam2 = getCamera(player);
      const sx = (mouse.x + cam2.x) / TILE;
      const sy = (mouse.y + cam2.y) / TILE;
      // Remove any existing static field (max 1 active)
      for (let j = hackwareEffects.length - 1; j >= 0; j--) {
        if (hackwareEffects[j].type === 'static_field') hackwareEffects.splice(j, 1);
      }
      hackwareEffects.push({
        type:'static_field', x:sx, y:sy, age:0, maxAge:5, radius:3,
        dmg:10, hitMap:new Map()
      });
      spawnParticles(sx, sy, 'EXPLOSION', '#44ccff', 15);
      triggerShake(3, 0.15);
      game.msg('⌁ STATIC FIELD DEPLOYED', '#44ccff');
      break;
    }
  }
}

function updateHackwareEffects(dt) {
  const map = game.dungeon ? game.dungeon.map : null;
  for (let i = hackwareEffects.length - 1; i >= 0; i--) {
    const fx = hackwareEffects[i];
    fx.age += dt;
    if (fx.age >= fx.maxAge) { hackwareEffects.splice(i, 1); continue; }

    if (fx.type === 'swarm') {
      // Home toward nearest visible enemy
      let best = null, bestD = 8;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(fx.x, fx.y, e.x, e.y);
        if (d < bestD && map && hasLOS(fx.x, fx.y, e.x, e.y, map)) { best = e; bestD = d; }
      }
      if (best) {
        const [dx, dy] = norm(best.x - fx.x, best.y - fx.y);
        const spd = 6;
        fx.vx += dx * spd * dt * 4;
        fx.vy += dy * spd * dt * 4;
        const mag = Math.sqrt(fx.vx * fx.vx + fx.vy * fx.vy);
        if (mag > spd) { fx.vx = (fx.vx / mag) * spd; fx.vy = (fx.vy / mag) * spd; }
      }
      fx.x += fx.vx * dt;
      fx.y += fx.vy * dt;
      // Hit detection
      fx.hitCd = Math.max(0, fx.hitCd - dt);
      if (fx.hitCd <= 0) {
        for (const e of enemies) {
          if (e.dead) continue;
          if (dist(fx.x, fx.y, e.x, e.y) < 0.6) {
            e.takeDamage(fx.dmg, { name:'Nano Swarm', isProc:true });
            fx.hitCd = 0.5;
            spawnParticles(fx.x, fx.y, 'SPARK', '#44ff88', 3);
            break;
          }
        }
      }
      // Trail particle
      if (Math.random() < dt * 10) spawnParticles(fx.x, fx.y, 'MUZZLE', '#44ff88', 1);
    }

    if (fx.type === 'gravity') {
      // Pull enemies toward center (collision-aware)
      const pullStr = 4;
      for (const e of enemies) {
        if (e.dead || e.isBoss) continue; // bosses immune to pull
        const d = dist(e.x, e.y, fx.x, fx.y);
        if (d < fx.radius && d > 0.3 && map && hasLOS(e.x, e.y, fx.x, fx.y, map)) {
          e.moveToward(fx.x, fx.y, pullStr, dt, map);
        }
      }
      // Ambient vortex particles
      if (Math.random() < dt * 8) {
        const a = Math.random() * TWO_PI;
        const r = fx.radius * 0.5 + Math.random() * fx.radius * 0.5;
        spawnParticles(fx.x + Math.cos(a) * r, fx.y + Math.sin(a) * r, 'MUZZLE', '#ff8800', 1);
      }
    }
    if (fx.type === 'static_field') {
      // Damage and slow enemies inside the field (LOS required)
      const now = fx.age;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(e.x, e.y, fx.x, fx.y);
        if (d < fx.radius && map && hasLOS(e.x, e.y, fx.x, fx.y, map)) {
          // Apply slow (stronger-wins: don't truncate existing longer/stronger slows)
          const factor = e.isBoss ? 0.85 : 0.6;
          e.slowTimer = Math.max(e.slowTimer || 0, 0.3);
          e.slowFactor = Math.min(e.slowFactor || 1, factor);
          // Damage on 1-second interval per enemy
          const lastHit = fx.hitMap.get(e) || -1;
          if (now - lastHit >= 1.0) {
            fx.hitMap.set(e, now);
            e.takeDamage(fx.dmg, { name:'Static Field', isProc:true });
            spawnParticles(e.x, e.y, 'SPARK', '#44ccff', 3);
          }
        }
      }
      // Ambient crackling particles
      if (Math.random() < dt * 6) {
        const a = Math.random() * TWO_PI;
        const r = Math.random() * fx.radius;
        spawnParticles(fx.x + Math.cos(a) * r, fx.y + Math.sin(a) * r, 'SPARK', '#44ccff', 1);
      }
    }
    // emp_ring is visual only, handled in draw
  }
}

function drawHackwareEffects(camX, camY) {
  for (const fx of hackwareEffects) {
    if (fx.type === 'emp_ring') {
      const progress = fx.age / fx.maxAge;
      const r = fx.radius * TILE * progress;
      const sx = fx.x * TILE - camX, sy = fx.y * TILE - camY;
      ctx.save();
      ctx.globalAlpha = 0.6 * (1 - progress);
      ctx.strokeStyle = '#00ddff';
      ctx.shadowBlur = 15; ctx.shadowColor = '#00ddff';
      ctx.lineWidth = 3 * (1 - progress);
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TWO_PI); ctx.stroke();
      ctx.restore();
    }
    if (fx.type === 'swarm') {
      const sx = fx.x * TILE - camX, sy = fx.y * TILE - camY;
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.shadowBlur = 8; ctx.shadowColor = '#44ff88';
      ctx.fillStyle = '#44ff88';
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, TWO_PI); ctx.fill();
      ctx.restore();
    }
    if (fx.type === 'gravity') {
      const sx = fx.x * TILE - camX, sy = fx.y * TILE - camY;
      const fade = 1 - (fx.age / fx.maxAge);
      const r = fx.radius * TILE;
      ctx.save();
      // Pulsing ring
      const pulse = 0.5 + Math.sin(fx.age * 8) * 0.2;
      ctx.globalAlpha = fade * 0.25 * pulse;
      ctx.fillStyle = '#ff8800';
      ctx.shadowBlur = 20; ctx.shadowColor = '#ff8800';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TWO_PI); ctx.fill();
      // Core
      ctx.globalAlpha = fade * 0.7;
      ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TWO_PI); ctx.fill();
      // Rotating arms
      ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 2;
      ctx.globalAlpha = fade * 0.4;
      for (let arm = 0; arm < 3; arm++) {
        const a = fx.age * 4 + (TWO_PI / 3) * arm;
        ctx.beginPath();
        ctx.moveTo(sx + Math.cos(a) * 8, sy + Math.sin(a) * 8);
        ctx.lineTo(sx + Math.cos(a) * r * 0.6, sy + Math.sin(a) * r * 0.6);
        ctx.stroke();
      }
      ctx.restore();
    }
    if (fx.type === 'static_field') {
      const sx = fx.x * TILE - camX, sy = fx.y * TILE - camY;
      const fade = 1 - (fx.age / fx.maxAge) * 0.3; // slow fade, stays visible
      const r = fx.radius * TILE;
      ctx.save();
      // Pulsing electric ring
      const pulse = 0.6 + Math.sin(fx.age * 10) * 0.2;
      ctx.globalAlpha = fade * 0.15 * pulse;
      ctx.fillStyle = '#44ccff';
      ctx.shadowBlur = 25; ctx.shadowColor = '#44ccff';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TWO_PI); ctx.fill();
      // Outer ring stroke
      ctx.globalAlpha = fade * 0.5;
      ctx.strokeStyle = '#44ccff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TWO_PI); ctx.stroke();
      // Rotating arc segments (3 arcs, 60° each)
      ctx.lineWidth = 3;
      ctx.globalAlpha = fade * 0.6;
      for (let seg = 0; seg < 3; seg++) {
        const a = fx.age * 3 + (TWO_PI / 3) * seg;
        ctx.beginPath();
        ctx.arc(sx, sy, r * 0.7, a, a + Math.PI / 3);
        ctx.stroke();
      }
      // Core spark
      ctx.globalAlpha = fade * 0.8;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sx, sy, 3 + Math.sin(fx.age * 15) * 1.5, 0, TWO_PI); ctx.fill();
      ctx.restore();
    }
  }
}

function affixEligible(affixId, baseWeapon) {
  if (affixId === 'PRECISE'  && baseWeapon.spread === 0) return false;
  if (affixId === 'TWIN'     && baseWeapon.melee)        return false;
  if (affixId === 'EXTENDED' && baseWeapon.melee)        return false;
  return true;
}

// Deterministic weapon construction from base key + affix list
function buildWeapon(baseKey, affixIds) {
  const base = WEAPONS[baseKey];
  if (!base) return { ...WEAPONS.PULSE_PISTOL, _base:'PULSE_PISTOL', _affixes:[], _rarity:0, displayName:'Pulse Pistol' };
  const w = { ...base, _base:baseKey, _affixes:[...affixIds], _rarity:affixIds.length };
  // Apply prefix stat mods (multiplicative, except countAdd which is additive)
  for (const id of affixIds) {
    const af = WEAPON_AFFIXES[id];
    if (!af || !af.mods) continue;
    if (af.mods.dmg)      w.dmg    = Math.round(w.dmg * af.mods.dmg);
    if (af.mods.rate)     w.rate   = +(w.rate * af.mods.rate).toFixed(2);
    if (af.mods.range)    w.range  = +(w.range * af.mods.range).toFixed(1);
    if (af.mods.spread !== undefined) w.spread = +(w.spread * af.mods.spread).toFixed(3);
    if (af.mods.countAdd) w.count  = w.count + af.mods.countAdd;
  }
  // Build display name: "Rapid Pulse Pistol of Flame"
  const prefix = affixIds.find(id => WEAPON_AFFIXES[id]?.slot === 'prefix');
  const suffix = affixIds.find(id => WEAPON_AFFIXES[id]?.slot === 'suffix');
  let dn = base.name;
  if (prefix) dn = WEAPON_AFFIXES[prefix].label + ' ' + dn;
  if (suffix) dn = dn + ' ' + WEAPON_AFFIXES[suffix].label;
  w.displayName = dn;
  // Collect on-hit/on-kill effects
  w._effects = affixIds.map(id => WEAPON_AFFIXES[id]?.effect).filter(Boolean);
  return w;
}

// Roll random affixes based on floor depth
function rollWeapon(baseKey, floor) {
  if (floor <= 1) return buildWeapon(baseKey, []);
  const base = WEAPONS[baseKey];
  if (!base) return buildWeapon(baseKey, []);
  // Affix chance tiers
  let pTwo, pOne;
  if (floor <= 3)      { pTwo = 0;    pOne = 0.50; }
  else if (floor <= 5) { pTwo = 0.25; pOne = 0.45; }
  else                 { pTwo = 0.40; pOne = 0.40; }
  const roll = Math.random();
  let wantCount;
  if (roll < pTwo)           wantCount = 2;
  else if (roll < pTwo+pOne) wantCount = 1;
  else                       wantCount = 0;
  if (wantCount === 0) return buildWeapon(baseKey, []);
  const affixes = [];
  // Pick eligible prefix
  const eligPre = AFFIX_PREFIXES.filter(id => affixEligible(id, base));
  // Pick eligible suffix
  const eligSuf = AFFIX_SUFFIXES.filter(id => affixEligible(id, base));
  if (wantCount >= 2 && eligPre.length && eligSuf.length) {
    affixes.push(eligPre[rndInt(0, eligPre.length - 1)]);
    affixes.push(eligSuf[rndInt(0, eligSuf.length - 1)]);
  } else if (wantCount >= 1) {
    // Pick from either pool
    const combined = [...eligPre, ...eligSuf];
    if (combined.length) affixes.push(combined[rndInt(0, combined.length - 1)]);
  }
  return buildWeapon(baseKey, affixes);
}

const DIFF_ORDER = ['EASY','NORMAL','HARD'];
function getDiff() { return DIFFICULTIES[game.difficulty] || DIFFICULTIES.NORMAL; }

const FLOOR_MODIFIERS = {
  BLACKOUT:  { label:'BLACKOUT',  desc:'Emergency lights only',     colour:'#4466aa', icon:'◐' },
  SWARM:     { label:'SWARM',     desc:'Alert — all units respond', colour:'#ff6644', icon:'⚠' },

// ─── Particles ───────────────────────────────────────────────────────────────
let particles = [];
function spawnParticles(wx, wy, type, colour, count) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*TWO_PI;
    const spd = type==='EXPLOSION' ? rnd(1,4) : rnd(0.5,3);
    particles.push({
      x: wx*TILE, y: wy*TILE,
      vx: Math.cos(a)*spd*(TILE/2), vy: Math.sin(a)*spd*(TILE/2),
      life: 1, maxLife: type==='MUZZLE'?0.08:type==='EXPLOSION'?0.5:rnd(0.3,0.6),
      size: type==='EXPLOSION' ? rnd(3,8) : rnd(1,3),
      colour, type,
      grav: type==='BLOOD' ? 40 : 0,
    });
  }
}
function updateParticles(dt) {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.life -= dt / p.maxLife;
    if (p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(camX, camY) {
  for (const p of particles) {
    const sx = p.x - camX, sy = p.y - camY;
    if (sx < -20 || sx > W+20 || sy < -20 || sy > H+20) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'EXPLOSION') {
      ctx.shadowBlur = 10; ctx.shadowColor = p.colour;
      ctx.fillStyle = p.colour;
      ctx.beginPath();
      ctx.arc(sx, sy, p.size * (1 - p.life * 0.5 + 0.5), 0, TWO_PI);
      ctx.fill();
    } else {
      ctx.fillStyle = p.colour;
      ctx.fillRect(sx - p.size/2, sy - p.size/2, p.size, p.size);
    }
    ctx.restore();
  }
}

// ─── Dungeon Generator ───────────────────────────────────────────────────────
function createMap() {
  return Array.from({length: MAP_H}, () => new Uint8Array(MAP_W).fill(T.WALL));
}

function carveRect(map, x, y, w, h, tile) {
  for (let ty=y; ty<y+h; ty++)
    for (let tx=x; tx<x+w; tx++)
      if (tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H) map[ty][tx]=tile;
}

function carveCorridor(map, x1, y1, x2, y2) {
  let x=x1, y=y1;
  while (x!==x2) { map[y][x]=T.FLOOR; x += x<x2?1:-1; }
  while (y!==y2) { map[y][x]=T.FLOOR; y += y<y2?1:-1; }
}

class BSPNode {
  constructor(x,y,w,h) { this.x=x; this.y=y; this.w=w; this.h=h; this.left=null; this.right=null; this.room=null; }
  split(depth) {
    if (depth<=0 || (this.w<16 && this.h<16)) return;
    const horiz = this.h > this.w ? true : this.w > this.h ? false : Math.random()<0.5;
    if (horiz) {
      const split = rndInt(8, this.h-8);
      this.left  = new BSPNode(this.x, this.y, this.w, split);
      this.right = new BSPNode(this.x, this.y+split, this.w, this.h-split);
    } else {
      const split = rndInt(8, this.w-8);
      this.left  = new BSPNode(this.x, this.y, split, this.h);
      this.right = new BSPNode(this.x+split, this.y, this.w-split, this.h);
    }
    this.left.split(depth-1);
    this.right.split(depth-1);
  }
  getLeaves() {
    if (!this.left && !this.right) return [this];
    return [...(this.left?.getLeaves()??[]), ...(this.right?.getLeaves()??[])];
  }
  carveRooms(map) {
    if (!this.left && !this.right) {
      const rw = rndInt(5, Math.max(6,this.w-2));
      const rh = rndInt(5, Math.max(6,this.h-2));
      const rx = this.x + rndInt(1, Math.max(2,this.w-rw-1));
      const ry = this.y + rndInt(1, Math.max(2,this.h-rh-1));
      this.room = {x:rx, y:ry, w:rw, h:rh,
        cx: Math.floor(rx+rw/2), cy: Math.floor(ry+rh/2)};
      carveRect(map, rx, ry, rw, rh, T.FLOOR);
      return;
    }
    this.left?.carveRooms(map);
    this.right?.carveRooms(map);
    const lr = this.left?.getRoom();
    const rr = this.right?.getRoom();
    if (lr && rr) carveCorridor(map, lr.cx, lr.cy, rr.cx, rr.cy);
  }
  getRoom() {
    if (this.room) return this.room;
    const l = this.left?.getRoom(), r = this.right?.getRoom();
    if (!l) return r; if (!r) return l;
    return Math.random()<0.5?l:r;
  }
}

function bfsRooms(rooms, startRoom, map) {
  const dist = new Map();
  const q = [startRoom];
  dist.set(startRoom, 0);
  while (q.length) {
    const cur = q.shift();
    for (const other of rooms) {
      if (dist.has(other)) continue;
      if (hasLOS(cur.cx, cur.cy, other.cx, other.cy, map) ||
          dist2(cur.cx,cur.cy,other.cx,other.cy) < 400) {
        dist.set(other, dist.get(cur)+1);
        q.push(other);
      }
    }
  }
  return dist;
}

function generateFloor(floorNum) {
  const map = createMap();
  const root = new BSPNode(0,0,MAP_W,MAP_H);
  root.split(5);
  root.carveRooms(map);
  const rooms = root.getLeaves().map(l=>l.room).filter(Boolean);

  // spawn in first room
  const spawnRoom = rooms[0];
  const playerPos = { x: spawnRoom.cx + 0.5, y: spawnRoom.cy + 0.5 };

  // furthest room from spawn for stairs
  const dist = bfsRooms(rooms, spawnRoom, map);
  let farthest = spawnRoom, farthestD = 0;
  for (const [r,d] of dist) { if (d>farthestD) { farthestD=d; farthest=r; } }
  map[farthest.cy][farthest.cx] = floorNum>=10 ? T.TERMINAL : T.STAIRS;

  // boss room on floors 3,6,10
  let bossRoom = null;
  let bossEntrances = [];
  if (floorNum===3||floorNum===6||floorNum===10) {
    // use the room furthest from spawn that isn't the stair room
    let br = null, bd = 0;
    for (const [r,d] of dist) {
      if (r===farthest) continue;
      if (d>bd) { bd=d; br=r; }
    }
    bossRoom = br || rooms[Math.floor(rooms.length/2)];

    // Enforce minimum boss room size (15×15) by expanding if needed
    const MIN_BOSS = 15;
    if (bossRoom.w < MIN_BOSS || bossRoom.h < MIN_BOSS) {
      const nw = Math.max(bossRoom.w, MIN_BOSS);
      const nh = Math.max(bossRoom.h, MIN_BOSS);
      // centre the expansion on the current room centre, clamped to map
      const nx = Math.max(1, Math.min(MAP_W - nw - 1, bossRoom.cx - Math.floor(nw/2)));
      const ny = Math.max(1, Math.min(MAP_H - nh - 1, bossRoom.cy - Math.floor(nh/2)));
      bossRoom.x = nx; bossRoom.y = ny; bossRoom.w = nw; bossRoom.h = nh;
      bossRoom.cx = Math.floor(nx + nw/2); bossRoom.cy = Math.floor(ny + nh/2);
      carveRect(map, nx, ny, nw, nh, T.FLOOR);
      // re-carve corridors to this room from neighbours
      for (const r of rooms) {
        if (r === bossRoom) continue;
        const dx = Math.abs(r.cx - bossRoom.cx), dy = Math.abs(r.cy - bossRoom.cy);
        if (dx < 20 && dy < 20) carveCorridor(map, r.cx, r.cy, bossRoom.cx, bossRoom.cy);
      }
      // Re-place stairs/terminal in case expansion overwrote it
      map[farthest.cy][farthest.cx] = floorNum>=10 ? T.TERMINAL : T.STAIRS;
    }

    // Record entrance tiles: floor tiles on room boundary that connect to corridors
    const rx=bossRoom.x, ry=bossRoom.y, rw=bossRoom.w, rh=bossRoom.h;
    for (let tx=rx; tx<rx+rw; tx++) {
      // top edge
      if (ry>0 && map[ry][tx]===T.FLOOR && map[ry-1][tx]===T.FLOOR)
        bossEntrances.push({x:tx, y:ry});
      // bottom edge
      const by=ry+rh-1;
      if (by<MAP_H-1 && map[by][tx]===T.FLOOR && map[by+1][tx]===T.FLOOR)
        bossEntrances.push({x:tx, y:by});
    }
    for (let ty=ry; ty<ry+rh; ty++) {
      // left edge
      if (rx>0 && map[ty][rx]===T.FLOOR && map[ty][rx-1]===T.FLOOR)
        bossEntrances.push({x:rx, y:ty});
      // right edge
      const bx=rx+rw-1;
      if (bx<MAP_W-1 && map[ty][bx]===T.FLOOR && map[ty][bx+1]===T.FLOOR)
        bossEntrances.push({x:bx, y:ty});
    }
  }

  // lights
  const lights = [];
  for (const r of rooms) {
    lights.push({x:r.x+1,y:r.y+1});
    lights.push({x:r.x+r.w-2,y:r.y+r.h-2});
  }

  // fog of war
  const visited = Array.from({length:MAP_H},()=>new Uint8Array(MAP_W));
  const light   = Array.from({length:MAP_H},()=>new Float32Array(MAP_W));

  return { map, rooms, spawnRoom, stairRoom:farthest, bossRoom, bossEntrances, playerPos, lights, visited, light };
}

// ─── Lighting ────────────────────────────────────────────────────────────────
function updateLighting(dungeon, px, py) {
  const r = 9;
  const tx = Math.floor(px), ty = Math.floor(py);
  for (let dy=-r; dy<=r; dy++)
    for (let dx=-r; dx<=r; dx++) {
      const x=tx+dx, y=ty+dy;
      if (x<0||y<0||x>=MAP_W||y>=MAP_H) continue;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d <= r) {
        const l = Math.max(0, 1 - d/r);
        dungeon.light[y][x] = Math.max(dungeon.light[y][x], l);
        dungeon.visited[y][x] = 1;
      }
    }
  // sconce lights
  for (const sc of dungeon.lights) {
    const sdx=sc.x-tx, sdy=sc.y-ty;
    if (Math.abs(sdx)>6||Math.abs(sdy)>6) continue;
    for (let dy=-4; dy<=4; dy++)
      for (let dx=-4; dx<=4; dx++) {
        const x=sc.x+dx, y=sc.y+dy;
        if (x<0||y<0||x>=MAP_W||y>=MAP_H) continue;
        const d=Math.sqrt(dx*dx+dy*dy);
        if (d<=4) dungeon.light[y][x]=Math.max(dungeon.light[y][x],0.4*(1-d/4));
      }
  }
}

// ─── Projectiles ─────────────────────────────────────────────────────────────
let projectiles = [];
class Projectile {
  constructor(x,y,dx,dy,spd,dmg,range,colour,piercing,fromPlayer,weaponName) {
    this.x=x; this.y=y;
    [this.dx,this.dy]=norm(dx,dy);
    this.spd=spd; this.dmg=dmg;
    this.maxRange=range; this.travelled=0;
    this.colour=colour; this.piercing=piercing;
    this.fromPlayer=fromPlayer; this.dead=false;
    this.weaponName=weaponName||null;
    this.hitEnemies=new Set();
  }
  update(dt, map, player, enemies) {
    const mx=this.dx*this.spd*dt, my=this.dy*this.spd*dt;
    this.x+=mx; this.y+=my;
    this.travelled+=Math.sqrt(mx*mx+my*my);
    if (this.travelled>=this.maxRange) { this.dead=true; return; }
    const tx=Math.floor(this.x), ty=Math.floor(this.y);
    if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||map[ty][tx]===T.WALL) {
      spawnParticles(this.x,this.y,'SPARK',this.colour,3);
      this.dead=true; return;
    }
    if (this.fromPlayer) {
      for (const e of enemies) {
        if (e.dead||this.hitEnemies.has(e)) continue;
        if (dist(this.x,this.y,e.x,e.y)<0.6) {
          e.takeDamage(this.dmg, this.weaponName);
          spawnParticles(this.x,this.y,'BLOOD','#ff3333',4);
          if (!this.piercing) { this.dead=true; return; }
          this.hitEnemies.add(e);
        }
      }
    } else {
      if (!player.invincibleTimer && dist(this.x,this.y,player.x,player.y)<0.5) {
        player.takeDamage(this.dmg);
        this.dead=true;
      }
    }
  }
  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    ctx.save();
    ctx.shadowBlur=8; ctx.shadowColor=this.colour;
    ctx.fillStyle=this.colour;
    ctx.beginPath();
    ctx.arc(sx,sy,3,0,TWO_PI);
    ctx.fill();
    ctx.restore();
  }
}

// ─── Items ───────────────────────────────────────────────────────────────────
const ITEM_TYPES = [
  {id:'MED_PACK',   name:'Med-Pack',     colour:'#00ff88', rarity:40, fn: p=>{ p.hp=Math.min(p.maxHp,p.hp+40); }},
  {id:'NANO_REPAIR',name:'Nano-Repair',  colour:'#88ff88', rarity:35, fn: p=>{ p.hp=Math.min(p.maxHp,p.hp+15); }},
  {id:'SHIELD_CELL',name:'Shield Cell',  colour:'#00aaff', rarity:20, fn: p=>{ p.def+=5; p.shieldBonus+=5; }},
  {id:'XP_CHIP',    name:'XP Chip',      colour:'#ffff00', rarity:20, fn: p=>{ p.gainXP(50); }},
  {id:'WEAPON_CRATE',name:'Weapon Crate',colour:'#ff8800', rarity:10, fn: p=>{ const k=WEAPON_KEYS[rndInt(0,WEAPON_KEYS.length-1)]; p.weapon=WEAPONS[k]; game.msg('Found '+WEAPONS[k].name+'!','#ff8800'); }},
  {id:'OVERCLOCK',  name:'Overclock',    colour:'#ff00c8', rarity:8,  fn: p=>{ p.speedBoost=1.5; p.speedTimer=20; }},
  {id:'VOID_SHARD', name:'Void Shard',   colour:'#aa00ff', rarity:4,  fn: p=>{ p.shards=(p.shards||0)+1; game.msg('Got Void Shard! ('+p.shards+')',  '#aa00ff'); }},
];

function pickItemType() {
  const total=ITEM_TYPES.reduce((s,t)=>s+t.rarity,0);
  let r=Math.random()*total;
  for (const t of ITEM_TYPES) { r-=t.rarity; if (r<=0) return t; }
  return ITEM_TYPES[0];
}

class Item {
  constructor(x,y,type) {
    this.x=x; this.y=y; this.type=type||pickItemType();
    this.dead=false; this.bob=Math.random()*TWO_PI;
  }
  update(dt) { this.bob+=dt*2; }
  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY+Math.sin(this.bob)*2;
    ctx.save();
    ctx.shadowBlur=12; ctx.shadowColor=this.type.colour;
    ctx.fillStyle=this.type.colour;
    ctx.fillRect(sx-5,sy-5,10,10);
    ctx.restore();
  }
}

// ─── Enemies ─────────────────────────────────────────────────────────────────
let enemies = [];
let items   = [];

class Enemy {
  constructor(x,y,hp,atk,spd,xpVal,colour,type) {
    this.x=x; this.y=y;
    this.hp=hp; this.maxHp=hp;
    this.atk=atk; this.spd=spd;
    this.xpValue=xpVal; this.colour=colour; this.type=type;
    this.dead=false;
    this.state='PATROL';
    this.patrolTarget=null;
    this.attackTimer=0;
    this.shootTimer=0;
    this.bobAngle=Math.random()*TWO_PI;
    this.visible=true;
    this.teleportTimer=0;
    this.zigzag=0;
    this.room=null;
    this.isBoss=false;
    this.elite=false;
    this.phase=1;
    this.bossTimers={};
    this.spawnCooldown=0;
    this.shieldBurstTimer=0;
    this.flashTimer=0;
    this.voidOrbs=[];
    this.prevPhase=1;
  }

  takeDamage(dmg, weaponName) {
    if (this.type==='PHANTOM' && !this.visible) { this.visible=true; }
    this.hp -= dmg;
    this.flashTimer = 0.1;
    if (this.hp<=0) { this.hp=0; this.die(); }
    else audio.hit(false, weaponName);
  }

  die() {
    this.dead=true;
    audio.death();
    spawnParticles(this.x,this.y,'EXPLOSION',this.colour,12);
    if (Math.random()<0.2) items.push(new Item(this.x,this.y));
    game.player.gainXP(this.xpValue);
    game.player.score += this.xpValue * game.floor;
  }

  update(dt, player, map) {
    if (this.dead) return;
    this.bobAngle+=dt*3;
    this.flashTimer=Math.max(0,this.flashTimer-dt);
    this.attackTimer=Math.max(0,this.attackTimer-dt);
    this.shootTimer =Math.max(0,this.shootTimer-dt);
    this.spawnCooldown=Math.max(0,this.spawnCooldown-dt);

    const d = dist(this.x,this.y,player.x,player.y);
    const los = d<15 && hasLOS(this.x,this.y,player.x,player.y,map);

    // type-specific AI
    switch(this.type) {
      case 'GUARD':    this.aiGuard(dt,player,map,d,los);    break;
      case 'TURRET':   this.aiTurret(dt,player,map,d,los);   break;
      case 'CRAWLER':  this.aiCrawler(dt,player,map,d,los);  break;
      case 'PHANTOM':  this.aiPhantom(dt,player,map,d,los);  break;
      case 'DRONE':    this.aiDrone(dt,player,map,d,los);    break;
      case 'SENTINEL': this.aiBossSentinel(dt,player,map,d,los); break;
      case 'HIVE':     this.aiBossHive(dt,player,map,d,los);     break;
      case 'OMEGA':    this.aiBossOmega(dt,player,map,d,los);    break;
    }
  }

  moveToward(tx,ty,spd,dt,map,ignoreWalls) {
    let [dx,dy]=norm(tx-this.x,ty-this.y);
    const nx=this.x+dx*spd*dt, ny=this.y+dy*spd*dt;
    if (ignoreWalls) { this.x=nx; this.y=ny; return; }
    const fx=Math.floor(nx), fy=Math.floor(this.y);
    const xf=Math.floor(this.x), yf=Math.floor(ny);
    if (fx>=0&&fy>=0&&fx<MAP_W&&fy<MAP_H && map[fy][fx]!==T.WALL) this.x=nx;
    if (xf>=0&&yf>=0&&xf<MAP_W&&yf<MAP_H && map[yf][xf]!==T.WALL) this.y=ny;
  }

  patrol(dt,map) {
    if (!this.patrolTarget || dist(this.x,this.y,this.patrolTarget.x,this.patrolTarget.y)<0.5) {
      if (this.room) {
        this.patrolTarget={
          x:this.room.x+rnd(1,this.room.w-1),
          y:this.room.y+rnd(1,this.room.h-1)
        };
      }
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,this.spd*0.5,dt,map);
  }

  meleeAttack(player) {
    if (this.attackTimer<=0) {
      player.takeDamage(this.atk);
      this.attackTimer=1.0;
      spawnParticles(player.x,player.y,'SPARK','#ff4444',5);
    }
  }

  fireAt(px,py,spd,dmg,range,colour) {
    const [dx,dy]=norm(px-this.x,py-this.y);
    projectiles.push(new Projectile(this.x,this.y,dx,dy,spd,dmg,range,colour,false,false));
    audio.shoot(false);
  }

  aiGuard(dt,player,map,d,los) {
    const detectRange = 10 + (game.floor || 1) * 0.4;
    if (los && d<detectRange) { this.state='CHASE'; }
    else if (d>detectRange+2) { this.state='PATROL'; }
    if (this.state==='PATROL') this.patrol(dt,map);
    else {
      this.moveToward(player.x,player.y,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    }
  }

  aiTurret(dt,player,map,d,los) {
    const cooldown = Math.max(1.0, 2.0 - (game.floor || 1) * 0.11);
    if (los && d<12 && this.shootTimer<=0) {
      this.fireAt(player.x,player.y,8,this.atk,13,'#ffb700');
      this.shootTimer=cooldown;
    }
  }

  aiCrawler(dt,player,map,d,los) {
    if (los||d<8) {
      this.zigzag+=dt*5;
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      const perp={x:-dy,y:dx};
      const tx=player.x+perp.x*Math.sin(this.zigzag)*1.5;
      const ty=player.y+perp.y*Math.sin(this.zigzag)*1.5;
      this.moveToward(tx,ty,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    } else this.patrol(dt,map);
  }

  aiPhantom(dt,player,map,d,los) {
    this.teleportTimer=Math.max(0,this.teleportTimer-dt);
    if (d>3) {
      this.visible=false;
      if (this.teleportTimer<=0 && this.room) {
        this.x=this.room.x+rnd(1,this.room.w-1);
        this.y=this.room.y+rnd(1,this.room.h-1);
        this.teleportTimer=4;
      }
    } else {
      this.visible=true;
      this.moveToward(player.x,player.y,this.spd,dt,map);
      if (d<1.2) this.meleeAttack(player);
    }
  }

  aiDrone(dt,player,map,d,los) {
    const cooldown = Math.max(0.9, 1.5 - (game.floor || 1) * 0.07);
    if (d<15) {
      // Drones respect walls when boss room is sealed
      const canPhase = !game.bossSealed;
      this.moveToward(player.x,player.y,this.spd,dt,map,canPhase);
      if (this.shootTimer<=0) {
        this.fireAt(player.x,player.y,7,this.atk,16,'#00aaff');
        this.shootTimer=cooldown;
      }
    }
  }

  aiBossSentinel(dt,player,map,d,los) {
    if (this.hp<100) this.phase=2; else this.phase=1;
    if (this.phase!==this.prevPhase) {
      spawnParticles(this.x,this.y,'EXPLOSION',this.colour,20);
      audio.phaseShift();
      this.prevPhase=this.phase;
    }

    this.bossTimers.laser=(this.bossTimers.laser||0)-dt;
    this.bossTimers.move=(this.bossTimers.move||0)-dt;
    this.bossTimers.shield=(this.bossTimers.shield||0)-dt;

    if (this.bossTimers.move<=0) {
      if (this.room) {
        this.patrolTarget={x:this.room.cx+rnd(-5,5),y:this.room.cy+rnd(-5,5)};
      }
      this.bossTimers.move=2;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,2,dt,map);

    const rate=this.phase===2?2:3;
    if (this.bossTimers.laser<=0) {
      for (let i=0;i<(this.phase===2?8:5);i++) {
        const a=(i/(this.phase===2?8:5))*TWO_PI;
        projectiles.push(new Projectile(this.x,this.y,Math.cos(a),Math.sin(a),7,this.atk,14,'#ff4444',false,false));
      }
      audio.shoot(false);
      this.bossTimers.laser=rate;
    }

    if (this.phase===2 && this.bossTimers.shield<=0) {
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      player.x-=dx*3; player.y-=dy*3;
      clampToBossRoom(player);
      player.takeDamage(20);
      spawnParticles(player.x,player.y,'EXPLOSION','#ff4444',8);
      this.bossTimers.shield=5;
    }
  }

  aiBossHive(dt,player,map,d,los) {
    if (this.hp<150) this.phase=3;
    else if (this.hp<350) this.phase=2;
    else this.phase=1;

    if (this.phase!==this.prevPhase) {
      spawnParticles(this.x,this.y,'EXPLOSION',this.colour,20);
      audio.phaseShift();
      game.msg('⚠ HIVE PHASE '+this.phase,'#aa00ff');
      this.prevPhase=this.phase;
    }

    this.bossTimers.homing=(this.bossTimers.homing||0)-dt;
    this.bossTimers.spawn=(this.bossTimers.spawn||0)-dt;
    this.bossTimers.shock=(this.bossTimers.shock||0)-dt;
    this.bossTimers.move=(this.bossTimers.move||0)-dt;

    if (this.bossTimers.move<=0) {
      if (this.room) this.patrolTarget={x:this.room.x+rnd(2,this.room.w-2),y:this.room.y+rnd(2,this.room.h-2)};
      this.bossTimers.move=3;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x,this.patrolTarget.y,1.5,dt,map);

    if (this.bossTimers.homing<=0) {
      const [dx,dy]=norm(player.x-this.x,player.y-this.y);
      // homing: just fires at player
      this.fireAt(player.x,player.y,6,this.atk,18,'#aa00ff');
      this.bossTimers.homing=2;
    }

    if (this.phase>=2 && this.bossTimers.spawn<=0 && this.spawnCooldown<=0) {
      for (let i=0;i<2;i++) {
        const cr=spawnEnemy('CRAWLER',this.x+rnd(-2,2),this.y+rnd(-2,2),game.floor,this.room,false);
        enemies.push(cr);
      }
      this.bossTimers.spawn=5;
      this.spawnCooldown=1;
    }

    if (this.phase===3 && this.bossTimers.shock<=0) {
      if (dist(game.player.x,game.player.y,this.x,this.y)<8) {
        game.player.takeDamage(25);
        spawnParticles(this.x,this.y,'EXPLOSION','#aa00ff',15);
      }
      this.bossTimers.shock=4;
    }
  }

  aiBossOmega(dt,player,map,d,los) {
    // Phase transitions based on maxHp percentage
    const hpPct = this.hp / this.maxHp;
    if (hpPct <= 0.2) this.phase = 4;
    else if (hpPct <= 0.4) this.phase = 3;
    else if (hpPct <= 0.7) this.phase = 2;
    else this.phase = 1;

    // Phase transition VFX
    if (this.phase !== this.prevPhase) {
      spawnParticles(this.x, this.y, 'EXPLOSION', this.colour, 25);
      audio.phaseShift();
      game.msg('⚠ OMEGA PHASE ' + this.phase, '#ff00c8');
      this.prevPhase = this.phase;
    }

    const spd = [1, 1.2, 1.5, 2][this.phase - 1];
    const T = this.bossTimers;
    T.turret = (T.turret || 0) - dt;
    T.homing = (T.homing || 0) - dt;
    T.spawn  = (T.spawn  || 0) - dt;
    T.beam   = (T.beam   || 0) - dt;
    T.shield = (T.shield || 0) - dt;
    T.void   = (T.void   || 0) - dt;
    T.shock  = (T.shock  || 0) - dt;
    T.move   = (T.move   || 0) - dt;

    // Movement — patrol within boss room
    if (T.move <= 0) {
      if (this.room) this.patrolTarget = {
        x: this.room.x + rnd(2, this.room.w - 2),
        y: this.room.y + rnd(2, this.room.h - 2)
      };
      T.move = 1.5 / spd;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x, this.patrolTarget.y, spd * 2, dt, map);

    // Phase 1+: Radial turret shots (from SENTINEL)
    if (T.turret <= 0) {
      const n = this.phase >= 3 ? 8 : this.phase >= 2 ? 5 : 4;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TWO_PI + this.bobAngle;
        projectiles.push(new Projectile(this.x, this.y, Math.cos(a), Math.sin(a), 8, this.atk, 18, '#ff00c8', false, false));
      }
      audio.shoot(false);
      T.turret = 2 / spd;
    }

    // Phase 1+: Homing missile at player (from HIVE)
    if (T.homing <= 0 && los) {
      this.fireAt(player.x, player.y, 7, this.atk + 5, 20, '#aa00ff');
      T.homing = 2.5 / spd;
    }

    // Phase 2+: Spawn crawlers (inherited from HIVE) and drones — capped at 8 active adds
    if (this.phase >= 2 && T.spawn <= 0 && this.spawnCooldown <= 0) {
      const activeAdds = enemies.filter(e => !e.dead && !e.isBoss && e.room === this.room).length;
      if (activeAdds < 8) {
        const addType = Math.random() < 0.6 ? 'CRAWLER' : 'DRONE';
        const count = Math.min(this.phase >= 4 ? 3 : 2, 8 - activeAdds);
        for (let i = 0; i < count; i++) {
          const add = spawnEnemy(addType, this.x + rnd(-3, 3), this.y + rnd(-3, 3), game.floor, this.room, false);
          enemies.push(add);
        }
      }
      T.spawn = 5 / spd;
      this.spawnCooldown = 0.5;
    }

    // Phase 3+: Beam fan (5–7 piercing beams aimed at player)
    if (this.phase >= 3 && T.beam <= 0) {
      const [dx, dy] = norm(player.x - this.x, player.y - this.y);
      const count = this.phase >= 4 ? 7 : 5;
      const half = Math.floor(count / 2);
      for (let i = -half; i <= half; i++) {
        const a = Math.atan2(dy, dx) + i * 0.18;
        projectiles.push(new Projectile(this.x, this.y, Math.cos(a), Math.sin(a), 14, 35, 22, '#ff00c8', true, false));
      }
      audio.shoot(false);
      T.beam = 3.5 / spd;
    }

    // Phase 3+: Shield burst — AoE knockback+damage within 5 tiles (from SENTINEL)
    if (this.phase >= 3 && T.shield <= 0) {
      if (d < 5) {
        const [kx, ky] = norm(player.x - this.x, player.y - this.y);
        player.x += kx * 3;
        player.y += ky * 3;
        clampToBossRoom(player);
        player.takeDamage(20);
        spawnParticles(this.x, this.y, 'EXPLOSION', '#ff00c8', 12);
      }
      T.shield = 6 / spd;
    }

    // Phase 4: Psionic shockwave — AoE damage within 7 tiles (from HIVE)
    if (this.phase >= 4 && T.shock <= 0) {
      if (d < 7) {
        player.takeDamage(25);
        spawnParticles(player.x, player.y, 'EXPLOSION', '#aa00ff', 10);
      }
      spawnParticles(this.x, this.y, 'EXPLOSION', '#aa00ff', 20);
      T.shock = 4 / spd;
    }

    // Phase 4: Void orbs — expanding AoE zones that fill the room
    if (this.phase >= 4 && T.void <= 0 && this.room) {
      const count = rndInt(2, 3);
      for (let i = 0; i < count; i++) {
        this.voidOrbs.push({
          x: this.room.x + rnd(2, this.room.w - 2),
          y: this.room.y + rnd(2, this.room.h - 2),
          radius: 0, maxRadius: rnd(4, 7),
          age: 0, maxAge: 2.5,
          tickCd: 0
        });
      }
      T.void = 3.5 / spd;
    }

    // Update void orbs — expand and tick damage
    for (let i = this.voidOrbs.length - 1; i >= 0; i--) {
      const orb = this.voidOrbs[i];
      orb.age += dt;
      orb.radius = orb.maxRadius * Math.min(1, orb.age / (orb.maxAge * 0.6));
      orb.tickCd = Math.max(0, orb.tickCd - dt);
      if (orb.age >= orb.maxAge) { this.voidOrbs.splice(i, 1); continue; }
      // tick damage every 0.5s while player is inside
      if (orb.tickCd <= 0 && dist(player.x, player.y, orb.x, orb.y) < orb.radius) {
        player.takeDamage(15);
        spawnParticles(player.x, player.y, 'SPARK', '#aa00ff', 4);
        orb.tickCd = 0.5;
      }
    }
  }

  draw(camX,camY) {
    if (this.dead) return;
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    if (sx<-40||sx>W+40||sy<-40||sy>H+40) return;

    let alpha=1;
    if (this.type==='PHANTOM' && !this.visible) alpha=0.08;

    ctx.save();
    ctx.globalAlpha=alpha;

    const col=this.flashTimer>0?'#ffffff':this.colour;
    const elitePulse = this.elite ? 12 + Math.sin(this.bobAngle * 2) * 8 : 0;
    ctx.shadowBlur=this.isBoss?20: this.elite ? 10 + elitePulse : 10;
    ctx.shadowColor=col;
    ctx.fillStyle=col;

    if (this.isBoss) {
      // Draw void orbs as ground effects (OMEGA phase 4)
      if (this.voidOrbs.length > 0) {
        for (const orb of this.voidOrbs) {
          const ox = orb.x * TILE - camX, oy = orb.y * TILE - camY;
          const r = orb.radius * TILE;
          const fade = 1 - (orb.age / orb.maxAge);
          ctx.save();
          ctx.globalAlpha = fade * 0.3;
          ctx.fillStyle = '#aa00ff';
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#aa00ff';
          ctx.beginPath();
          ctx.arc(ox, oy, r, 0, TWO_PI);
          ctx.fill();
          // Ring edge
          ctx.globalAlpha = fade * 0.7;
          ctx.strokeStyle = '#ff00c8';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      }

      const sz=this.type==='OMEGA'?22:18;
      ctx.beginPath();
      ctx.arc(sx,sy,sz,0,TWO_PI);
      ctx.fill();
      // boss HP bar
      ctx.shadowBlur=0;
      ctx.fillStyle='#333';
      ctx.fillRect(sx-25,sy-30,50,5);
      ctx.fillStyle=this.colour;
      ctx.fillRect(sx-25,sy-30,50*(this.hp/this.maxHp),5);
    } else {
      const sz=TILE*0.4;
      ctx.fillRect(sx-sz/2, sy-sz/2, sz, sz);
      // elite diamond marker
      if (this.elite) {
        ctx.fillStyle='#ffffff';
        ctx.shadowColor='#ffffff';
        ctx.shadowBlur=6;
        ctx.beginPath();
        ctx.moveTo(sx, sy - sz - 4);
        ctx.lineTo(sx + 3, sy - sz - 1);
        ctx.lineTo(sx, sy - sz + 2);
        ctx.lineTo(sx - 3, sy - sz - 1);
        ctx.closePath();
        ctx.fill();
      }
      // small hp bar
      if (this.hp<this.maxHp) {
        ctx.shadowBlur=0;
        ctx.fillStyle='#333';
        ctx.fillRect(sx-8,sy-12,16,2);
        ctx.fillStyle= this.elite ? '#ffffff' : this.colour;
        ctx.fillRect(sx-8,sy-12,16*(this.hp/this.maxHp),2);
      }
    }
    ctx.restore();
  }
}

// ─── Enemy Weights & Spawning ─────────────────────────────────────────────────
const ENEMY_WEIGHTS = {
  GUARD:   { base: 40, perFloor: -3 },   // common early, fades
  TURRET:  { base: 20, perFloor: 1 },    // steady
  CRAWLER: { base: 10, perFloor: 3 },    // ramps up mid-game
  PHANTOM: { base: 5,  perFloor: 4 },    // late-game threat
  DRONE:   { base: 5,  perFloor: 3 },    // late-game ranged
};
const ENEMY_TYPES_LIST = Object.keys(ENEMY_WEIGHTS);

function pickEnemyType(floorNum) {
  const weights = [];
  let total = 0;
  for (const t of ENEMY_TYPES_LIST) {
    const w = Math.max(1, ENEMY_WEIGHTS[t].base + ENEMY_WEIGHTS[t].perFloor * (floorNum - 1));
    weights.push({ type: t, w });
    total += w;
  }
  let r = Math.random() * total;
  for (const { type, w } of weights) { r -= w; if (r <= 0) return type; }
  return 'GUARD';
}

function spawnEnemy(type,x,y,floorNum,room,allowElite) {
  const scale=1+0.15*(floorNum-1);
  let hp,atk,spd,xpVal,colour;
  switch(type) {
    case 'GUARD':   hp=40;  atk=8;  spd=2;   xpVal=20; colour='#ff3333'; break;
    case 'TURRET':  hp=25;  atk=12; spd=0;   xpVal=15; colour='#ffb700'; break;
    case 'CRAWLER': hp=20;  atk=6;  spd=4;   xpVal=10; colour='#39ff14'; break;
    case 'PHANTOM': hp=35;  atk=10; spd=2.5; xpVal=30; colour='#cc00ff'; break;
    case 'DRONE':   hp=15;  atk=8;  spd=3;   xpVal=12; colour='#00aaff'; break;
    case 'SENTINEL':hp=300; atk=15; spd=1.5; xpVal=200;colour='#ff4444'; break;
    case 'HIVE':    hp=500; atk=18; spd=1.2; xpVal=350;colour='#aa00ff'; break;
    case 'OMEGA':   hp=1000;atk=22; spd=1.8; xpVal=800;colour='#ff00c8'; break;
  }
  const isBoss = ['SENTINEL','HIVE','OMEGA'].includes(type);
  const e=new Enemy(x,y,
    Math.round(hp*scale), Math.round(atk*scale),
    spd, xpVal, colour, type);
  e.room=room;
  e.isBoss=isBoss;
  e.elite=false;
  if (type==='PHANTOM') e.visible=false;
  if (isBoss) { e.maxHp=e.hp; }
  // Elite roll: 8% chance on floor 3+, never on bosses or disallowed spawns
  if (allowElite !== false && !isBoss && floorNum >= 3 && Math.random() < 0.08) {
    e.elite = true;
    e.hp = Math.round(e.hp * 1.8);
    e.maxHp = e.hp;
    e.atk = Math.round(e.atk * 1.3);
    e.spd *= 1.15;
    e.xpValue = Math.round(e.xpValue * 1.25);
  }
  return e;
}

// ─── Player ───────────────────────────────────────────────────────────────────
class Player {
  constructor() { this.reset(); }
  reset() {
    this.x=5; this.y=5;
    this.hp=100; this.maxHp=100;
    this.atk=10; this.def=2; this.spd=3.5;
    this.level=1; this.xp=0;
    this.weapon=WEAPONS.PULSE_PISTOL;
    this.score=0;
    this.invincibleTimer=0;
    this.shootCooldown=0;
    this.facing={x:1,y:0};
    this.speedBoost=0; this.speedTimer=0;
    this.shieldBonus=0;
    this.shards=0;
    this.flashTimer=0;
    this.levelFlash=0;
    this.lowHpTimer=0;
  }

  xpNeeded() { return this.level*80; }

  gainXP(amount) {
    this.xp+=amount;
    while (this.xp>=this.xpNeeded() && this.level<10) {
      this.xp-=this.xpNeeded();
      this.level++;
      this.maxHp+=20; this.hp=this.maxHp;
      this.atk+=3; this.def+=1;
      this.levelFlash=1.5;
      audio.levelUp();
      game.msg('LEVEL UP! Now level '+this.level,'#00f5ff');
    }
  }

  takeDamage(dmg) {
    if (this.invincibleTimer>0) return;
    const actual=Math.max(1,dmg-this.def);
    this.hp=Math.max(0,this.hp-actual);
    this.invincibleTimer=0.5;
    this.flashTimer=0.2;
    audio.hit(true);
    spawnParticles(this.x,this.y,'BLOOD','#ff4444',5);
    if (this.hp<=0) { audio.gameOver(); game.endRun(false); }
  }

  shoot(aimX,aimY,map) {
    if (this.shootCooldown>0) return;
    const w=this.weapon;
    const [dx,dy]=norm(aimX-this.x,aimY-this.y);

    if (w.melee) {
      // plasma sword arc
      spawnParticles(this.x+dx*1.5, this.y+dy*1.5,'EXPLOSION',w.colour,8);
      for (const e of enemies) {
        if (e.dead) continue;
        if (dist(this.x,this.y,e.x,e.y)<w.range) {
          e.takeDamage(w.dmg+this.atk, w.name);
        }
      }
    } else {
      for (let i=0;i<w.count;i++) {
        const spread=(Math.random()-0.5)*w.spread;
        const a=Math.atan2(dy,dx)+spread;
        const pdx=Math.cos(a), pdy=Math.sin(a);
        projectiles.push(new Projectile(
          this.x,this.y,pdx,pdy,12,w.dmg+this.atk,w.range,
          w.colour,!!w.piercing,true,w.name
        ));
      }
      spawnParticles(this.x+dx*0.8,this.y+dy*0.8,'MUZZLE',w.colour,3);
    }
    audio.shoot(true, w);
    this.shootCooldown=1/w.rate;
  }

  useVoidShard() {
    if (!this.shards) return;
    this.shards--;
    for (const e of enemies) {
      if (!e.dead && dist(this.x,this.y,e.x,e.y)<6) e.takeDamage(80, 'Void Cannon');
    }
    spawnParticles(this.x,this.y,'EXPLOSION','#aa00ff',30);
    game.msg('VOID SHARD DETONATED!','#aa00ff');
  }

  update(dt,map) {
    this.invincibleTimer=Math.max(0,this.invincibleTimer-dt);
    this.shootCooldown=Math.max(0,this.shootCooldown-dt);
    this.flashTimer=Math.max(0,this.flashTimer-dt);
    this.levelFlash=Math.max(0,this.levelFlash-dt);
    if (this.speedTimer>0) { this.speedTimer-=dt; if(this.speedTimer<=0)this.speedBoost=0; }

    // Low health warning pulse
    if (this.hp > 0 && this.hp / this.maxHp <= 0.25) {
      this.lowHpTimer -= dt;
      if (this.lowHpTimer <= 0) { audio.lowHealth(); this.lowHpTimer = 2; }
    } else { this.lowHpTimer = 0; }

    const spd=this.spd+(this.speedBoost||0);
    let mx=0,my=0;
    if (keys.has('KeyW')||keys.has('ArrowUp'))    my=-1;
    if (keys.has('KeyS')||keys.has('ArrowDown'))  my= 1;
    if (keys.has('KeyA')||keys.has('ArrowLeft'))  mx=-1;
    if (keys.has('KeyD')||keys.has('ArrowRight')) mx= 1;
    // touch joystick
    if (touch.joystick.active) { mx+=touch.joystick.dx; my+=touch.joystick.dy; }

    if (mx||my) {
      const [ndx,ndy]=norm(mx,my);
      const nx=this.x+ndx*spd*dt;
      const ny=this.y+ndy*spd*dt;
      const tx=Math.floor(nx), ty=Math.floor(this.y);
      const ox=Math.floor(this.x),oy=Math.floor(ny);
      if (tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H && map[ty][tx]!==T.WALL) this.x=nx;
      if (ox>=0&&oy>=0&&ox<MAP_W&&oy<MAP_H && map[oy][ox]!==T.WALL) this.y=ny;
      this.facing={x:ndx,y:ndy};
    }

    // void shard
    if (jp('KeyV')) this.useVoidShard();
  }

  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    const col=this.flashTimer>0?'#ffffff':'#00f5ff';

    ctx.save();
    // body
    ctx.shadowBlur=15; ctx.shadowColor=col;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(sx,sy,7,0,TWO_PI);
    ctx.fill();
    // direction pip
    ctx.shadowBlur=5;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(sx+this.facing.x*7,sy+this.facing.y*7,2.5,0,TWO_PI);
    ctx.fill();
    ctx.restore();
  }
}

// ─── Camera ───────────────────────────────────────────────────────────────────
function getCamera(player) {
  const worldW = MAP_W * TILE, worldH = MAP_H * TILE;
  const camX = W >= worldW
    ? -(W - worldW) / 2
    : clamp(player.x * TILE - W / 2, 0, worldW - W);
  const botClear = layout.hudH / 2;
  const camY = H >= worldH
    ? -(H - worldH) / 2
    : clamp(player.y * TILE - H / 2 + botClear, 0, worldH - H + botClear);
  return { x: camX, y: camY };
}

// ─── Renderer ─────────────────────────────────────────────────────────────────
function drawWorld(dungeon, camX, camY) {
  const startX=Math.max(0,Math.floor(camX/TILE)-1);
  const startY=Math.max(0,Math.floor(camY/TILE)-1);
  const endX=Math.min(MAP_W,startX+Math.ceil(W/TILE)+2);
  const endY=Math.min(MAP_H,startY+Math.ceil((H-layout.hudH)/TILE)+2);

  for (let ty=startY; ty<endY; ty++) {
    for (let tx=startX; tx<endX; tx++) {
      const tile=dungeon.map[ty][tx];
      const vis=dungeon.visited[ty][tx];
      if (!vis) continue;
      const lv=dungeon.light[ty][tx];
      const brightness=lv>0 ? Math.max(0.2,lv) : 0.12;
      const sx=tx*TILE-camX, sy=ty*TILE-camY;

      ctx.save();
      ctx.globalAlpha=brightness;
      switch(tile) {
        case T.WALL: {
          const isSealed = game.bossSealed && game.bossEntrances.some(e=>e.x===tx&&e.y===ty);
          ctx.fillStyle = isSealed ? '#2e1a1a' : '#1a1a2e';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle = isSealed ? '#5e2d2d' : '#2d2d5e';
          ctx.fillRect(sx,sy,TILE,2);
          ctx.fillRect(sx,sy,2,TILE);
          if (isSealed) {
            ctx.shadowBlur=8; ctx.shadowColor='#ff3333';
            ctx.fillStyle='#ff3333';
            ctx.globalAlpha=brightness*0.4;
            ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
          }
          break;
        }
        case T.FLOOR:
          ctx.fillStyle='#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          if ((tx+ty)%4===0) { ctx.fillStyle='#13132a'; ctx.fillRect(sx,sy,TILE,TILE); }
          break;
        case T.STAIRS:
          ctx.fillStyle='#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness;
          ctx.shadowBlur=8; ctx.shadowColor='#ffff00';
          ctx.fillStyle='#ffff00';
          ctx.font='14px monospace';
          ctx.fillText('▼',sx+3,sy+14);
          break;
        case T.TERMINAL:
          ctx.fillStyle='#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.shadowBlur=12; ctx.shadowColor='#00f5ff';
          ctx.fillStyle='#00f5ff';
          ctx.font='13px monospace';
          ctx.fillText('⬡',sx+2,sy+14);
          break;
      }
      ctx.restore();
    }
  }
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD(player) {
  const y = layout.hudTop;
  const lx = 14 + safeLeft;   // left anchor respecting safe area
  ctx.save();
  ctx.fillStyle='rgba(10,10,18,0.85)';
  ctx.fillRect(0, y - 2, W, H - y + 2);

  if (layout.compact) {
    // ── Compact portrait: two rows ──
    const fs = 10;
    const r1 = y + 4;   // row 1 baseline offset
    const r2 = y + 28;  // row 2 baseline offset
    const hpW = Math.min(100, W * 0.25);

    // Row 1: HP bar + FLR + score
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(lx, r1, hpW, 12);
    const hpFrac = player.hp / player.maxHp;
    const hpCol = hpFrac > 0.5 ? '#00f5ff' : hpFrac > 0.25 ? '#ffb700' : '#ff3333';
    ctx.shadowBlur=6; ctx.shadowColor=hpCol;
    ctx.fillStyle=hpCol; ctx.fillRect(lx, r1, hpW * hpFrac, 12);
    ctx.shadowBlur=0;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`HP ${player.hp}/${player.maxHp}`, lx + 2, r1 + 10);

    const mid = lx + hpW + 10;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`FLR:${game.floor}`, mid, r1 + 10);

    ctx.shadowBlur=4; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700'; ctx.font=`${fs + 1}px monospace`;
    ctx.textAlign='right';
    ctx.fillText(`SCORE:${player.score}`, W - 10 - safeRight, r1 + 10);
    ctx.textAlign='left'; ctx.shadowBlur=0;

    // Row 2: LVL + XP bar + ATK + DEF + weapon
    ctx.fillStyle='#aaaacc'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`LV:${player.level}`, lx, r2 + 10);
    const xpBarX = lx + 34;
    const xpFrac = player.xp / player.xpNeeded();
    ctx.fillStyle='#333'; ctx.fillRect(xpBarX, r2 + 3, 36, 4);
    ctx.fillStyle='#ffb700'; ctx.fillRect(xpBarX, r2 + 3, 36 * xpFrac, 4);

    const statsX = xpBarX + 44;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`A:${player.atk}`, statsX, r2 + 10);
    ctx.fillText(`D:${player.def}`, statsX + 36, r2 + 10);

    // Weapon — truncate if needed
    ctx.shadowBlur=6; ctx.shadowColor='#ff00c8';
    ctx.fillStyle='#ff00c8'; ctx.font=`${fs}px monospace`;
    const weapMaxW = W - (statsX + 80) - safeRight - 10;
    let weapName = player.weapon.name;
    if (ctx.measureText(weapName).width > weapMaxW && weapMaxW > 20) {
      while (weapName.length > 3 && ctx.measureText(weapName + '…').width > weapMaxW) weapName = weapName.slice(0, -1);
      weapName += '…';
    }
    ctx.fillText(weapName, statsX + 74, r2 + 10);
    ctx.shadowBlur=0;

    if (player.shards > 0) {
      ctx.fillStyle='#aa00ff'; ctx.font=`${fs}px monospace`;
      ctx.fillText(`V×${player.shards}`, statsX + 74, r2 + 22);
    }
  } else {
    // ── Standard landscape HUD: single row ──
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(lx, y + 4, 130, 14);
    const hpFrac = player.hp / player.maxHp;
    const hpCol = hpFrac > 0.5 ? '#00f5ff' : hpFrac > 0.25 ? '#ffb700' : '#ff3333';
    ctx.shadowBlur=6; ctx.shadowColor=hpCol;
    ctx.fillStyle=hpCol; ctx.fillRect(lx, y + 4, 130 * hpFrac, 14);
    ctx.shadowBlur=0;

    ctx.fillStyle='#e0e0ff'; ctx.font='11px monospace';
    ctx.fillText(`HP ${player.hp}/${player.maxHp}`, lx + 4, y + 15);

    const colBase = lx + 141;
    ctx.fillStyle='#aaaacc'; ctx.font='11px monospace';
    ctx.fillText(`LVL:${player.level}`, colBase, y + 10);
    const xpFrac = player.xp / player.xpNeeded();
    ctx.fillStyle='#333'; ctx.fillRect(colBase, y + 12, 50, 4);
    ctx.fillStyle='#ffb700'; ctx.fillRect(colBase, y + 12, 50 * xpFrac, 4);

    ctx.fillStyle='#e0e0ff';
    ctx.fillText(`ATK:${player.atk}`, colBase + 60, y + 10);
    ctx.fillText(`DEF:${player.def}`, colBase + 105, y + 10);
    ctx.fillText(`FLR:${game.floor}`, colBase + 160, y + 10);

    ctx.shadowBlur=6; ctx.shadowColor='#ff00c8';
    ctx.fillStyle='#ff00c8';
    ctx.fillText(player.weapon.name, colBase + 220, y + 10);
    ctx.shadowBlur=0;

    if (player.shards > 0) {
      ctx.fillStyle='#aa00ff'; ctx.fillText(`[V] Void Shard ×${player.shards}`, colBase + 220, y + 22);
    }

    ctx.shadowBlur=4; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700';
    ctx.font='12px monospace';
    ctx.fillText(`SCORE: ${player.score}`, W - 160 - safeRight, y + 12);
  }
  ctx.restore();

  // level up flash
  if (player.levelFlash>0) {
    ctx.save();
    ctx.globalAlpha=Math.min(0.5,player.levelFlash*0.35);
    ctx.fillStyle='#00f5ff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    if (player.levelFlash>0.5) {
      ctx.save();
      ctx.shadowBlur=20; ctx.shadowColor='#00f5ff';
      ctx.fillStyle='#00f5ff'; ctx.font='bold 36px monospace';
      ctx.textAlign='center'; ctx.fillText('LEVEL UP!',W/2,H/2-40);
      ctx.textAlign='left'; ctx.restore();
    }
  }
}

// ─── Minimap ──────────────────────────────────────────────────────────────────
function drawMinimap(dungeon, player) {
  const MW=120, MH=80, MX=W-MW-8-safeRight, MY=8+safeTop;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(MX-2,MY-2,MW+4,MH+4);
  ctx.strokeStyle='#2d2d5e'; ctx.lineWidth=1; ctx.strokeRect(MX-2,MY-2,MW+4,MH+4);

  const sx=MW/MAP_W, sy=MH/MAP_H;
  for (let ty=0;ty<MAP_H;ty++) {
    for (let tx=0;tx<MAP_W;tx++) {
      if (!dungeon.visited[ty][tx]) continue;
      const tile=dungeon.map[ty][tx];
      const px2=MX+tx*sx, py2=MY+ty*sy;
      let col=null;
      if (tile===T.WALL) {
        col = (game.bossSealed && game.bossEntrances.some(e=>e.x===tx&&e.y===ty)) ? '#5e2d2d' : '#1a1a2e';
      }
      else if (tile===T.FLOOR) col='#202040';
      else if (tile===T.STAIRS||tile===T.TERMINAL) col='#ffff00';
      if (col) { ctx.fillStyle=col; ctx.fillRect(px2,py2,Math.max(1,sx),Math.max(1,sy)); }
    }
  }

  // enemies in visited areas
  for (const e of enemies) {
    if (e.dead||!dungeon.visited[Math.floor(e.y)]?.[Math.floor(e.x)]) continue;
    ctx.fillStyle='#ff3333';
    ctx.fillRect(MX+e.x*sx-1,MY+e.y*sy-1,2,2);
  }

  // player dot
  ctx.shadowBlur=6; ctx.shadowColor='#00f5ff';
  ctx.fillStyle='#00f5ff';
  ctx.fillRect(MX+player.x*sx-2,MY+player.y*sy-2,4,4);
  ctx.restore();
}

// ─── Messages ─────────────────────────────────────────────────────────────────
let messages=[];
function drawMessages() {
  for (let i=messages.length-1;i>=0;i--) {
    const m=messages[i];
    m.life-=1/60;
    if (m.life<=0){messages.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=Math.min(1,m.life);
    ctx.shadowBlur=6; ctx.shadowColor=m.colour;
    ctx.fillStyle=m.colour; ctx.font='13px monospace';
    ctx.fillText(m.text, 14+safeLeft, layout.msgBase-(messages.length-1-i)*16);
    ctx.restore();
  }
}

// ─── Floor population ─────────────────────────────────────────────────────────
function populateFloor(dungeon, floorNum) {
  enemies=[]; items=[]; projectiles=[]; particles=[];

  const spawnRoom=dungeon.spawnRoom;
  const bossRoom=dungeon.bossRoom;
  const bossTypes={3:'SENTINEL',6:'HIVE',10:'OMEGA'};

  for (let i=0;i<dungeon.rooms.length;i++) {
    const room=dungeon.rooms[i];
    if (room===spawnRoom) continue;

    if (bossRoom && room===bossRoom) {
      const btype=bossTypes[floorNum];
      if (btype) {
        const b=spawnEnemy(btype,room.cx,room.cy,floorNum,room);
        enemies.push(b);
        game.bossRoom=bossRoom;
        game.bossEntrances=dungeon.bossEntrances||[];
        game.bossSealed=false;
        game.bossAlive=true;
      }
      continue;
    }

    // Enemy count scales with floor, capped by room area
    const minE = 2 + Math.floor(floorNum / 3);
    const maxE = Math.min(8, 4 + Math.floor(floorNum / 2));
    const areaCap = Math.floor(room.w * room.h / 8);
    const count = Math.min(areaCap, rndInt(minE, maxE));

    let roomElite = false;  // max 1 elite per room
    const typeCounts = {};  // per-type caps within room
    const TYPE_CAPS = { PHANTOM: 1, TURRET: 2, DRONE: 2 };
    for (let j=0;j<count;j++) {
      let type = pickEnemyType(floorNum);
      // Per-type room caps — reroll among uncapped types if hit
      if ((typeCounts[type] || 0) >= (TYPE_CAPS[type] || 99)) {
        const open = ENEMY_TYPES_LIST.filter(t => (typeCounts[t] || 0) < (TYPE_CAPS[t] || 99));
        type = open.length ? open[rndInt(0, open.length - 1)] : 'GUARD';
      }
      typeCounts[type] = (typeCounts[type] || 0) + 1;

      const ex=room.x+rnd(1,room.w-1), ey=room.y+rnd(1,room.h-1);
      const e = spawnEnemy(type,ex,ey,floorNum,room, !roomElite);
      if (e.elite) roomElite = true;
      enemies.push(e);
    }

    const itemCount=rndInt(0,2);
    for (let j=0;j<itemCount;j++) {
      const ix=room.x+rnd(1,room.w-1), iy=room.y+rnd(1,room.h-1);
      items.push(new Item(ix,iy));
    }
  }
}

// ─── Game State Machine ───────────────────────────────────────────────────────
const game = {
  state: 'MENU',
  floor: 1,
  player: null,
  dungeon: null,
  fadeAlpha: 0,
  fadeDir: 0,
  fadeCallback: null,
  fadeNextState: null,
  fadeTime: 0,
  fadeHold: 0,
  fadeGlitchBars: [],
  fadeGlitchTimer: 0,
  transitionText: '',
  menuParticles: [],
  bossRoom: null,
  bossEntrances: [],
  bossSealed: false,
  bossAlive: false,
  msgList: [],
  nameEntry: null,
  lastSavedRank: -1,

  msg(text,colour) {
    messages.push({text,colour:colour||'#e0e0ff',life:3});
  },

  setState(s, callback) {
    this.state=s;
    if (callback) callback();
  },

  fadeTo(text, callback, nextState) {
    this.state='FADE';
    this.transitionText=text;
    this.fadeAlpha=0;
    this.fadeDir=1;
    this.fadeTime=0;
    this.fadeHold=0;
    this.fadeGlitchBars=[];
    this.fadeGlitchTimer=0;
    this.fadeCallback=callback;
    this.fadeNextState=nextState||null;
    audio.transition();
  },

  init() {
    this.player=new Player();
    this.loadFloor(1);
  },

  loadFloor(n) {
    this.floor=n;
    // Strip floor-only shield bonus from previous floor
    this.player.def-=this.player.shieldBonus;
    this.player.shieldBonus=0;
    this.dungeon=generateFloor(n);
    // Reset boss state before populating (populateFloor sets them for boss floors)
    this.bossRoom=null;
    this.bossEntrances=[];
    this.bossSealed=false;
    this.bossAlive=false;
    populateFloor(this.dungeon,n);
    this.player.x=this.dungeon.playerPos.x;
    this.player.y=this.dungeon.playerPos.y;
    messages=[];
    this.msg('FLOOR '+n,'#ff00c8');
    if (n===3||n===6||n===10) {
      setTimeout(()=>{ audio.bossEnter(); this.msg('⚠ BOSS DETECTED','#ff3333'); },500);
    }
  },

  startGame() {
    audio.resume();
    this.player=new Player();
    this.loadFloor(1);
    this.setState('PLAYING');
  },

  descend() {
    if (this.floor>=10) {
      // victory
      audio.victory();
      this.player.score+=500*this.floor+this.player.hp*10;
      this.endRun(true);
    } else {
      audio.descend();
      this.player.score+=500*this.floor+this.player.hp*10;
      const next=this.floor+1;
      this.fadeTo('DESCENDING TO FLOOR '+next, ()=>{
        this.loadFloor(next);
      }, 'PLAYING');
    }
  },

  saveScore(name) {
    const scores=this.getScores();
    const entry={name:name||'ANON',score:this.player.score,floor:this.floor,date:new Date().toLocaleDateString()};
    scores.push(entry);
    scores.sort((a,b)=>b.score-a.score);
    this.lastSavedRank=scores.findIndex(s=>s===entry);
    scores.splice(10);
    try { localStorage.setItem('neonDungeonScores',JSON.stringify(scores)); } catch(e){}
  },

  endRun(victory) {
    const scores=this.getScores();
    const testEntry={score:this.player.score};
    scores.push(testEntry);
    scores.sort((a,b)=>b.score-a.score);
    const rank=scores.findIndex(s=>s===testEntry);
    if (rank>=0 && rank<10) {
      this.nameEntry={name:'',rank,victory,cursorBlink:0};
      this.setState('NAME_ENTRY');
    } else {
      this.saveScore('ANON');
      this.setState(victory?'VICTORY':'GAME_OVER');
    }
  },

  getScores() {
    try { return JSON.parse(localStorage.getItem('neonDungeonScores'))||[]; } catch(e){return[];}
  },

  update(dt) {
    switch(this.state) {
      case 'MENU':        this.updateMenu(dt);    break;
      case 'PLAYING':     this.updatePlaying(dt); break;
      case 'PAUSED':      this.updatePaused();    break;
      case 'FADE':        this.updateFade(dt);    break;
      case 'GAME_OVER':   this.updateGameOver();  break;
      case 'VICTORY':     this.updateVictory();   break;
      case 'NAME_ENTRY':  this.updateNameEntry(dt); break;
    }
  },

  updateMenu(dt) {
    // animate bg particles
    this.menuParticles=this.menuParticles||[];
    if (Math.random()<0.3) {
      this.menuParticles.push({
        x:Math.random()*W, y:H, vx:(Math.random()-0.5)*20,
        vy:-rnd(20,60), life:1, col:['#00f5ff','#ff00c8','#39ff14','#ffb700'][rndInt(0,3)]
      });
    }
    for (let i=this.menuParticles.length-1;i>=0;i--) {
      const p=this.menuParticles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*0.4;
      if (p.life<=0||p.y<-10) this.menuParticles.splice(i,1);
    }
    if (jp('Enter')||jp('MouseLeft')) { audio.menuSelect(); this.startGame(); }
  },

  updatePlaying(dt) {
    const player=this.player;
    const dungeon=this.dungeon;

    player.update(dt,dungeon.map);

    const cam=getCamera(player);

    // sync touch aim: synthesise a mouse position far in the joystick direction
    if (touch.aim.active) {
      mouse.down = touch.aim.shooting;
      if (touch.aim.dx !== 0 || touch.aim.dy !== 0) {
        mouse.x = player.x * TILE - cam.x + touch.aim.dx * 300;
        mouse.y = player.y * TILE - cam.y + touch.aim.dy * 300;
      }
    }

    // aim with mouse
    const worldAimX=(mouse.x+cam.x)/TILE;
    const worldAimY=(mouse.y+cam.y)/TILE;
    const [afx,afy]=norm(worldAimX-player.x,worldAimY-player.y);
    if (afx||afy) player.facing={x:afx,y:afy};

    // shoot
    if ((mouse.down||keys.has('Space')) && player.shootCooldown<=0) {
      player.shoot(worldAimX,worldAimY,dungeon.map);
    }

    // update enemies
    for (const e of enemies) e.update(dt,player,dungeon.map);

    // update projectiles
    for (let i=projectiles.length-1;i>=0;i--) {
      projectiles[i].update(dt,dungeon.map,player,enemies);
      if (projectiles[i].dead) projectiles.splice(i,1);
    }

    // update items
    for (const it of items) it.update(dt);

    // item pickup
    for (let i=items.length-1;i>=0;i--) {
      const it=items[i];
      if (!it.dead && dist(player.x,player.y,it.x,it.y)<0.7) {
        it.type.fn(player);
        audio.pickup();
        this.msg('Picked up '+it.type.name, it.type.colour);
        items.splice(i,1);
      }
    }

    // remove dead enemies
    for (let i=enemies.length-1;i>=0;i--) {
      if (enemies[i].dead) enemies.splice(i,1);
    }

    // update lighting
    updateLighting(dungeon,player.x,player.y);
    updateParticles(dt);

    // stairs interaction
    const tx=Math.floor(player.x), ty=Math.floor(player.y);
    const tile=dungeon.map[ty]?.[tx];
    const bossBlocking = tile===T.TERMINAL && this.bossAlive;
    if ((tile===T.STAIRS||tile===T.TERMINAL) && !bossBlocking && jp('KeyE')) {
      this.descend();
    }
    if (tile===T.STAIRS) this.msg('Press E to descend','#ffff00');
    if (tile===T.TERMINAL && bossBlocking) this.msg('CORE terminal locked — destroy OMEGA CORE first','#ff3333');
    if (tile===T.TERMINAL && !bossBlocking) this.msg('Press E to interface with CORE terminal','#00f5ff');

    // pause
    if (jp('Escape')) this.setState('PAUSED');

    // boss seal check — seal when player enters the boss room
    if (this.bossRoom && !this.bossSealed && this.bossAlive) {
      const r = this.bossRoom;
      if (player.x >= r.x && player.x < r.x + r.w &&
          player.y >= r.y && player.y < r.y + r.h) {
        this.bossSealed = true;
        // Convert entrance tiles to walls
        for (const e of this.bossEntrances) {
          e.origTile = dungeon.map[e.y][e.x];
          dungeon.map[e.y][e.x] = T.WALL;
        }
        audio.roomSeal();
        this.msg('⚠ ROOM SEALED','#ff3333');
      }
    }

    // boss death — unseal room and update state
    if (this.bossAlive && !enemies.some(e=>e.isBoss && !e.dead)) {
      this.bossAlive=false;
      // Restore entrance tiles
      if (this.bossSealed) {
        for (const e of this.bossEntrances) {
          if (e.origTile !== undefined) dungeon.map[e.y][e.x] = e.origTile;
        }
        audio.roomUnseal();
      }
      this.bossSealed=false;
      const bossNames={3:'SENTINEL MK-I',6:'NEURAL HIVE',10:'OMEGA CORE'};
      game.msg((bossNames[this.floor]||'BOSS')+' DESTROYED','#39ff14');
    }
  },

  updatePaused() {
    if (jp('Escape')) { audio.menuSelect(); this.setState('PLAYING'); }
    else if (jp('KeyQ')) { audio.menuSelect(); this.setState('MENU'); }
  },

  updateFade(dt) {
    this.fadeTime+=dt;
    // Refresh glitch bars every ~100ms
    this.fadeGlitchTimer-=dt;
    if (this.fadeGlitchTimer<=0) {
      this.fadeGlitchTimer=0.1;
      const count=3+Math.floor(Math.random()*3);
      this.fadeGlitchBars=[];
      for (let i=0;i<count;i++) {
        this.fadeGlitchBars.push({
          y: Math.random()*H,
          h: 1+Math.random()*4,
          x: Math.random()*W*0.3,
          w: W*(0.3+Math.random()*0.7),
          color: Math.random()>0.5 ? '#ff00c8' : '#00f5ff',
          alpha: 0.15+Math.random()*0.35
        });
      }
    }
    if (this.fadeDir===1) {
      this.fadeAlpha+=dt*(1/0.4);
      if (this.fadeAlpha>=1) {
        this.fadeAlpha=1;
        this.fadeDir=2; // hold phase
        this.fadeHold=0;
        if (this.fadeCallback) {
          this.fadeCallback();
          this.fadeCallback=null;
        }
      }
    } else if (this.fadeDir===2) {
      // Hold at peak for 150ms
      this.fadeHold+=dt;
      if (this.fadeHold>=0.15) this.fadeDir=-1;
    } else if (this.fadeDir===-1) {
      this.fadeAlpha-=dt*(1/0.4);
      if (this.fadeAlpha<=0) {
        this.fadeAlpha=0; this.fadeDir=0;
        if (this.fadeNextState) this.setState(this.fadeNextState);
      }
    }
  },

  // ─── Virtual Keyboard Layout ──────────────────────────────────────────────
  _vkChars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-'.split(''),
  _vkCols: 10,

  _vkLayout(narrow) {
    const cols=this._vkCols;
    const cellW=narrow?28:36, cellH=narrow?28:36, gap=narrow?3:4;
    const rows=Math.ceil((this._vkChars.length+2)/cols); // +2 for DEL/OK
    const gridW=cols*(cellW+gap)-gap;
    const ox=(W-gridW)/2;
    return {cellW,cellH,gap,cols,rows,ox,gridW};
  },

  _vkHitTest(cx,cy,oy,narrow) {
    const {cellW,cellH,gap,cols,ox}=this._vkLayout(narrow);
    const allKeys=[...this._vkChars,'←','OK'];
    for (let i=0;i<allKeys.length;i++) {
      const col=i%cols, row=Math.floor(i/cols);
      const kx=ox+col*(cellW+gap), ky=oy+row*(cellH+gap);
      // OK key is double-wide
      const kw=allKeys[i]==='OK'?(cellW*2+gap):cellW;
      if (cx>=kx&&cx<=kx+kw&&cy>=ky&&cy<=ky+cellH) return allKeys[i];
    }
    return null;
  },

  updateNameEntry(dt) {
    const ne=this.nameEntry;
    if (!ne) return;
    ne.cursorBlink=(ne.cursorBlink||0)+dt;

    // Desktop keyboard input
    if (lastKey.length===1 && /[A-Za-z0-9 \-_]/.test(lastKey)) {
      if (ne.name.length<12) ne.name+=lastKey.toUpperCase();
    }
    if (jp('Backspace')) ne.name=ne.name.slice(0,-1);

    // Touch/click virtual keyboard
    if (nameEntryTap) {
      const narrow=layout.compact;
      const oy=narrow?280:340;
      const hit=this._vkHitTest(nameEntryTap[0],nameEntryTap[1],oy,narrow);
      if (hit==='←') ne.name=ne.name.slice(0,-1);
      else if (hit==='OK') { if (ne.name.length===0) ne.name='ANON'; jp('Enter'); justPressed.add('Enter'); }
      else if (hit && ne.name.length<12) ne.name+=hit;
    }
    // Mouse click on virtual keyboard (desktop)
    if (jp('MouseLeft') && !nameEntryTap) {
      const narrow=layout.compact;
      const oy=narrow?280:340;
      const hit=this._vkHitTest(mouse.x,mouse.y,oy,narrow);
      if (hit==='←') ne.name=ne.name.slice(0,-1);
      else if (hit==='OK') { if (ne.name.length===0) ne.name='ANON'; justPressed.add('Enter'); }
      else if (hit && ne.name.length<12) ne.name+=hit;
    }

    // Confirm (Enter on keyboard or OK on virtual keyboard)
    if (jp('Enter')) {
      if (ne.name.length===0) ne.name='ANON';
      audio.menuSelect();
      this.saveScore(ne.name);
      const dest=ne.victory?'VICTORY':'GAME_OVER';
      this.nameEntry=null;
      this.setState(dest);
    }
  },

  renderNameEntry() {
    const ne=this.nameEntry;
    if (!ne) return;
    const narrow=layout.compact;
    const isTouch=isTouchDevice();

    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.95)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';

    // Title
    ctx.shadowBlur=30; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700'; ctx.font=`bold ${narrow?28:40}px monospace`;
    ctx.fillText('HIGH SCORE!',W/2,narrow?60:80);

    // Rank + score
    ctx.shadowBlur=0;
    ctx.fillStyle='#aaaacc'; ctx.font=`${narrow?14:18}px monospace`;
    ctx.fillText(`Rank #${ne.rank+1}  •  Score: ${this.player.score}  •  Floor: ${this.floor}`,W/2,narrow?95:125);

    // Name input field
    const fieldY=narrow?130:170;
    ctx.fillStyle='#555577'; ctx.font=`${narrow?12:14}px monospace`;
    ctx.fillText('ENTER YOUR NAME',W/2,fieldY);

    const nameDisplay=ne.name+(Math.floor(ne.cursorBlink*3)%2===0?'_':'');
    ctx.shadowBlur=15; ctx.shadowColor='#00f5ff';
    ctx.fillStyle='#00f5ff'; ctx.font=`bold ${narrow?24:32}px monospace`;
    ctx.fillText(nameDisplay,W/2,fieldY+(narrow?30:40));
    ctx.shadowBlur=0;

    // Virtual keyboard
    const oy=narrow?280:340;
    const {cellW,cellH,gap,cols,ox}=this._vkLayout(narrow);
    const allKeys=[...this._vkChars,'←','OK'];
    const fontSize=narrow?12:14;

    for (let i=0;i<allKeys.length;i++) {
      const col=i%cols, row=Math.floor(i/cols);
      const kx=ox+col*(cellW+gap), ky=oy+row*(cellH+gap);
      const key=allKeys[i];
      const isOK=key==='OK';
      const isDel=key==='←';
      const kw=isOK?(cellW*2+gap):cellW;

      // Hover highlight
      let hover=false;
      if (nameEntryTap) {
        const [tx,ty]=nameEntryTap;
        hover=tx>=kx&&tx<=kx+kw&&ty>=ky&&ty<=ky+cellH;
      } else if (mouse.x>=kx&&mouse.x<=kx+kw&&mouse.y>=ky&&mouse.y<=ky+cellH) {
        hover=true;
      }

      // Key background
      ctx.fillStyle=hover?(isOK?'#39ff14':isDel?'#ff3333':'#00f5ff'):'rgba(255,255,255,0.08)';
      ctx.globalAlpha=hover?0.3:1;
      ctx.fillRect(kx,ky,kw,cellH);
      ctx.globalAlpha=1;

      // Key border
      ctx.strokeStyle=isOK?'#39ff14':isDel?'#ff3333':'#555577';
      ctx.lineWidth=1;
      ctx.strokeRect(kx,ky,kw,cellH);

      // Key label
      ctx.fillStyle=isOK?'#39ff14':isDel?'#ff3333':'#aaaacc';
      ctx.font=`${isOK?'bold ':''}${fontSize}px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(key,kx+kw/2,ky+cellH/2);
    }
    ctx.textBaseline='alphabetic';

    // Hint
    ctx.textAlign='center';
    ctx.fillStyle='#555577'; ctx.font=`${narrow?10:12}px monospace`;
    if (isTouch) {
      ctx.fillText('TAP KEYS TO ENTER NAME  •  TAP OK TO CONFIRM',W/2,oy+(narrow?130:155));
    } else {
      ctx.fillText('TYPE YOUR NAME  •  PRESS ENTER TO CONFIRM',W/2,oy+(narrow?130:155));
    }

    ctx.restore();
  },

  updateGameOver() {
    if (jp('Enter')||jp('MouseLeft')) { audio.menuSelect(); this.setState('MENU'); }
  },

  updateVictory() {
    if (jp('Enter')||jp('MouseLeft')) { audio.menuSelect(); this.setState('MENU'); }
  },

  render() {
    ctx.fillStyle='#0a0a12';
    ctx.fillRect(0,0,W,H);

    switch(this.state) {
      case 'MENU':      this.renderMenu();     break;
      case 'PLAYING':   this.renderPlaying();  break;
      case 'PAUSED':    this.renderPlaying(); this.renderPaused(); break;
      case 'FADE':      this.renderPlaying(); this.renderFade();   break;
      case 'GAME_OVER': this.renderGameOver(); break;
      case 'VICTORY':   this.renderVictory();  break;
      case 'NAME_ENTRY': this.renderNameEntry(); break;
    }
  },

  renderLeaderboard(y, maxEntries, highlightRank) {
    const narrow=layout.compact;
    const scores=this.getScores().slice(0,maxEntries);
    ctx.save();
    ctx.textAlign='center';
    ctx.shadowBlur=8; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700'; ctx.font=`${narrow?12:14}px monospace`;
    ctx.fillText('— HIGH SCORES —',W/2,y);
    ctx.shadowBlur=0;
    const lineH=narrow?16:18;
    const startY=y+(narrow?18:20);
    scores.forEach((s,i)=>{
      const isHL=i===highlightRank;
      ctx.fillStyle=isHL?'#00f5ff':'#aaaacc';
      if (isHL) { ctx.shadowBlur=6; ctx.shadowColor='#00f5ff'; }
      ctx.font=`${isHL?'bold ':''}${narrow?10:12}px monospace`;
      if (narrow) {
        ctx.fillText(`${i+1}. ${s.name}  ${s.score}  FLR ${s.floor}`,W/2,startY+i*lineH);
      } else {
        ctx.fillText(`${i+1}. ${s.name.padEnd(12)} ${String(s.score).padStart(8)}  FLR ${s.floor}`,W/2,startY+i*lineH);
      }
      if (isHL) ctx.shadowBlur=0;
    });
    if (!scores.length) {
      ctx.fillStyle='#555577'; ctx.font=`${narrow?10:12}px monospace`;
      ctx.fillText('No scores yet.',W/2,startY);
    }
    ctx.restore();
  },

  renderMenu() {
    // bg particles
    for (const p of (this.menuParticles||[])) {
      ctx.save(); ctx.globalAlpha=p.life*0.6;
      ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,2,2);
      ctx.restore();
    }

    const t=Date.now()/1000;
    const isTouch = isTouchDevice();
    const narrow = layout.compact;
    const titleFs = narrow ? 48 : 72;
    // grid lines
    ctx.save(); ctx.globalAlpha=0.05; ctx.strokeStyle='#00f5ff';
    for (let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for (let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();

    // title — scale for portrait
    const ty1 = narrow ? 120 : 160;
    const ty2 = ty1 + titleFs * 0.95;
    ctx.save();
    ctx.textAlign='center';
    const flicker=Math.sin(t*7)>0.8?0.6:1;
    ctx.globalAlpha=flicker;
    ctx.shadowBlur=40; ctx.shadowColor='#00f5ff';
    ctx.fillStyle='#00f5ff'; ctx.font=`bold ${titleFs}px monospace`;
    ctx.fillText('NEON',W/2-8,ty1);
    ctx.shadowColor='#ff00c8'; ctx.fillStyle='#ff00c8';
    ctx.fillText('DUNGEON',W/2,ty2);
    ctx.restore();

    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle='#aaaacc'; ctx.font=`${narrow ? 12 : 16}px monospace`;
    ctx.fillText('A CYBERPUNK DUNGEON CRAWLER',W/2,ty2 + 35);
    ctx.restore();

    // blink start prompt — touch-aware
    const startY = ty2 + 80;
    if (Math.floor(t*2)%2===0) {
      ctx.save(); ctx.textAlign='center';
      ctx.shadowBlur=10; ctx.shadowColor='#ff00c8';
      ctx.fillStyle='#ff00c8'; ctx.font=`${narrow ? 15 : 18}px monospace`;
      ctx.fillText(isTouch ? '▶  TAP TO START  ◀' : '▶  PRESS ENTER TO START  ◀', W/2, startY);
      ctx.restore();
    }

    // controls hint — contextual
    ctx.save(); ctx.textAlign='center';
    ctx.fillStyle='#555577'; ctx.font=`${narrow ? 10 : 12}px monospace`;
    if (isTouch) {
      ctx.fillText('Left: Move  |  Right: Aim & Shoot', W/2, startY + 30);
      ctx.fillText('E: Interact  |  V: Void Shard  |  ‖: Pause', W/2, startY + 46);
    } else {
      ctx.fillText('WASD: Move  |  Mouse: Aim  |  Click/Space: Shoot', W/2, startY + 30);
      ctx.fillText('E: Interact  |  V: Void Shard  |  ESC: Pause', W/2, startY + 46);
    }
    ctx.restore();

    // high scores
    const scoresY = startY + 80;
    this.renderLeaderboard(scoresY, narrow ? 3 : 5, -1);
  },

  renderPlaying() {
    const player=this.player;
    const dungeon=this.dungeon;
    const cam=getCamera(player);

    drawWorld(dungeon,cam.x,cam.y);

    // items
    for (const it of items) it.draw(cam.x,cam.y);

    // enemies
    for (const e of enemies) e.draw(cam.x,cam.y);

    // projectiles
    for (const p of projectiles) p.draw(cam.x,cam.y);

    // particles
    drawParticles(cam.x,cam.y);

    // player
    player.draw(cam.x,cam.y);

    drawHUD(player);
    drawMinimap(dungeon,player);
    drawMessages();
    drawTouchUI();
  },

  renderPaused() {
    const isTouch = isTouchDevice();
    const narrow = layout.compact;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowBlur=20; ctx.shadowColor='#ff00c8';
    ctx.fillStyle='#ff00c8'; ctx.font=`bold ${narrow ? 36 : 48}px monospace`;
    ctx.fillText('PAUSED',W/2, narrow ? 200 : 240);
    ctx.shadowBlur=0; ctx.fillStyle='#aaaacc'; ctx.font=`${narrow ? 14 : 18}px monospace`;
    if (isTouch) {
      ctx.fillText('TAP TOP — Resume',W/2, narrow ? 260 : 300);
      ctx.fillText('TAP BOTTOM — Quit to Menu',W/2, narrow ? 290 : 330);
    } else {
      ctx.fillText('ESC — Resume',W/2, narrow ? 260 : 300);
      ctx.fillText('Q   — Quit to Menu',W/2, narrow ? 290 : 330);
    }
    ctx.restore();
  },

  renderFade() {
    const t=this.fadeTime;
    const a=this.fadeAlpha;
    ctx.save();

    // ── Base dark overlay ────────────────────────────────────────────────
    ctx.globalAlpha=a;
    ctx.fillStyle='#0a0a12';
    ctx.fillRect(0,0,W,H);

    // ── Scrolling scanlines ──────────────────────────────────────────────
    const scanAlpha=Math.min(a*1.5, 0.3);
    if (scanAlpha>0.01) {
      ctx.globalAlpha=scanAlpha;
      ctx.fillStyle='#000000';
      const scanSpeed=120;
      const offset=(t*scanSpeed)%6;
      for (let y=offset;y<H;y+=6) {
        ctx.fillRect(0,y,W,2);
      }
    }

    // ── Glitch bars ─────────────────────────────────────────────────────
    if (a>0.25) {
      for (const bar of this.fadeGlitchBars) {
        ctx.globalAlpha=bar.alpha*Math.min(1,(a-0.25)*3);
        ctx.fillStyle=bar.color;
        ctx.fillRect(bar.x,bar.y,bar.w,bar.h);
      }
    }

    // ── Coarse noise band (sweeps vertically) ────────────────────────────
    if (a>0.3) {
      const bandH=30+Math.sin(t*4)*15;
      const bandY=((t*200)%( H+bandH*2))-bandH;
      const cellSize=6;
      ctx.globalAlpha=0.15*Math.min(1,(a-0.3)*3);
      for (let x=0;x<W;x+=cellSize) {
        for (let y=bandY;y<bandY+bandH;y+=cellSize) {
          if (y<0||y>H) continue;
          const r=Math.random();
          ctx.fillStyle=r>0.6?'#ff00c8':r>0.3?'#00f5ff':'#39ff14';
          ctx.fillRect(x,y,cellSize-1,cellSize-1);
        }
      }
    }

    // ── Horizontal sweep line ────────────────────────────────────────────
    if (a>0.2) {
      const sweepY=((t*350)%(H+4))-2;
      ctx.globalAlpha=0.6*Math.min(1,(a-0.2)*3);
      const grad=ctx.createLinearGradient(0,sweepY-2,0,sweepY+2);
      grad.addColorStop(0,'transparent');
      grad.addColorStop(0.5,'#00f5ff');
      grad.addColorStop(1,'transparent');
      ctx.fillStyle=grad;
      ctx.fillRect(0,sweepY-2,W,4);
    }

    // ── Transition text with chromatic aberration ────────────────────────
    if (a>0.5 && this.transitionText) {
      const textAlpha=Math.min(1,(a-0.5)*4);
      const txt=this.transitionText;
      // Chunk reveal: show characters based on time at peak
      const peakTime=this.fadeDir===2?this.fadeHold:(this.fadeDir===-1?0.15:0);
      const revealTime=Math.max(0,t-0.2); // time since text became visible (fadeAlpha crosses 0.5)
      const charsToShow=Math.min(txt.length, Math.floor(revealTime*80));
      const shown=charsToShow>=txt.length?txt:txt.substring(0,charsToShow);

      ctx.textAlign='center';
      ctx.font='bold 28px monospace';

      // Red offset (chromatic aberration)
      const abOffset=Math.max(0, 2-peakTime*15);
      if (abOffset>0.3) {
        ctx.globalAlpha=textAlpha*0.4;
        ctx.fillStyle='#ff0040';
        ctx.shadowBlur=0;
        ctx.fillText(shown,W/2-abOffset,H/2);
      }

      // Blue offset
      if (abOffset>0.3) {
        ctx.globalAlpha=textAlpha*0.4;
        ctx.fillStyle='#0080ff';
        ctx.fillText(shown,W/2+abOffset,H/2);
      }

      // Main text with glow
      ctx.globalAlpha=textAlpha;
      ctx.shadowBlur=20; ctx.shadowColor='#00f5ff';
      ctx.fillStyle='#00f5ff';
      ctx.fillText(shown,W/2,H/2);
      ctx.shadowBlur=0;

      // Blinking cursor during reveal
      if (charsToShow<txt.length && Math.sin(t*12)>0) {
        const metrics=ctx.measureText(shown);
        ctx.fillStyle='#00f5ff';
        ctx.fillRect(W/2+metrics.width/2+4, H/2-14, 2, 20);
      }
    }

    // ── Edge vignette (neon border flash) ────────────────────────────────
    if (a>0.6) {
      const edgeAlpha=0.3*Math.min(1,(a-0.6)*4)*(0.7+0.3*Math.sin(t*8));
      ctx.globalAlpha=edgeAlpha;
      ctx.strokeStyle='#ff00c8';
      ctx.lineWidth=2;
      ctx.shadowBlur=15; ctx.shadowColor='#ff00c8';
      ctx.strokeRect(4,4,W-8,H-8);
      ctx.shadowBlur=0;
    }

    ctx.restore();
  },

  renderGameOver() {
    const isTouch = isTouchDevice();
    const narrow = layout.compact;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowBlur=30; ctx.shadowColor='#ff3333';
    ctx.fillStyle='#ff3333'; ctx.font=`bold ${narrow ? 42 : 64}px monospace`;
    ctx.fillText('GAME OVER',W/2, narrow ? 80 : 100);
    ctx.shadowBlur=0; ctx.fillStyle='#aaaacc'; ctx.font=`${narrow ? 14 : 18}px monospace`;
    const baseY = narrow ? 120 : 150;
    ctx.fillText(`Floor Reached: ${this.floor}`,W/2, baseY);
    ctx.fillText(`Final Score: ${this.player.score}`,W/2, baseY + 26);
    ctx.fillText(`Level: ${this.player.level}`,W/2, baseY + 52);
    ctx.restore();
    // leaderboard
    this.renderLeaderboard(baseY + (narrow?85:100), narrow?5:7, this.lastSavedRank);
    // continue prompt
    if (Math.floor(Date.now()/800)%2===0) {
      ctx.save(); ctx.textAlign='center';
      ctx.fillStyle='#ff00c8'; ctx.font=`${narrow ? 13 : 16}px monospace`;
      ctx.fillText(isTouch ? 'TAP TO CONTINUE' : 'PRESS ENTER TO CONTINUE', W/2, H - (narrow?30:40));
      ctx.restore();
    }
  },

  renderVictory() {
    const isTouch = isTouchDevice();
    const narrow = layout.compact;
    ctx.save();
    ctx.fillStyle='rgba(0,0,10,0.95)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    const t=Date.now()/1000;
    ctx.shadowBlur=30; ctx.shadowColor='#00f5ff';
    ctx.fillStyle='#00f5ff'; ctx.font=`bold ${narrow ? 22 : 32}px monospace`;
    ctx.fillText('NEURAL NETWORK SEVERED',W/2, narrow ? 60 : 80);
    ctx.shadowColor='#ff00c8'; ctx.fillStyle='#ff00c8';
    ctx.font=`bold ${narrow ? 32 : 48}px monospace`;
    ctx.fillText('MISSION COMPLETE',W/2, narrow ? 105 : 130);
    ctx.shadowBlur=0; ctx.fillStyle='#aaaacc'; ctx.font=`${narrow ? 14 : 18}px monospace`;
    const baseY = narrow ? 145 : 175;
    ctx.fillText(`Final Score: ${this.player.score}`,W/2, baseY);
    ctx.fillText(`Floors Cleared: 10`,W/2, baseY + 26);
    ctx.fillText(`Level Achieved: ${this.player.level}`,W/2, baseY + 52);
    ctx.restore();
    // leaderboard
    this.renderLeaderboard(baseY + (narrow?85:100), narrow?5:7, this.lastSavedRank);
    // continue prompt
    if (Math.floor(t*2)%2===0) {
      ctx.save(); ctx.textAlign='center';
      ctx.fillStyle='#ffb700'; ctx.font=`${narrow ? 13 : 16}px monospace`;
      ctx.fillText(isTouch ? 'TAP FOR MENU' : 'PRESS ENTER FOR MENU', W/2, H - (narrow?30:40));
      ctx.restore();
    }
  }
};

// ─── Main Loop ────────────────────────────────────────────────────────────────
let lastTime=0;
function loop(ts) {
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  game.update(dt);
  game.render();
  clearJust();
  requestAnimationFrame(loop);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
resize();
updateBtns();
mouse.x = W/2; mouse.y = H/2;
window.addEventListener('resize', () => { resize(); updateBtns(); resetTouch(); mouse.x = W/2; mouse.y = H/2; });
game.state='MENU';
game.menuParticles=[];
requestAnimationFrame(loop);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>

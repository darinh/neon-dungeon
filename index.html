    }

    if (this.phase>=2 && this.bossTimers.spawn<=0 && this.spawnCooldown<=0) {
      for (let i=0;i<2;i++) {
        const cr=spawnEnemy('CRAWLER',this.x+rnd(-2,2),this.y+rnd(-2,2),game.floor,this.room,false);
        enemies.push(cr);
      }
      this.bossTimers.spawn=5;
      this.spawnCooldown=1;
    }

    if (this.phase===3 && this.bossTimers.shock<=0) {
      if (dist(game.player.x,game.player.y,this.x,this.y)<8) {
        game.player.takeDamage(Math.round(25*getDiff().enemyAtk));
        spawnParticles(this.x,this.y,'EXPLOSION','#aa00ff',15);
      }
      this.bossTimers.shock=4;
    }
  }

  aiBossOmega(dt,player,map,d,los) {
    // Phase transitions based on maxHp percentage
    const hpPct = this.hp / this.maxHp;
    if (hpPct <= 0.2) this.phase = 4;
    else if (hpPct <= 0.4) this.phase = 3;
    else if (hpPct <= 0.7) this.phase = 2;
    else this.phase = 1;

    // Phase transition VFX
    if (this.phase !== this.prevPhase) {
      spawnParticles(this.x, this.y, 'EXPLOSION', this.colour, 25);
      audio.phaseShift();
      game.msg('⚠ OMEGA PHASE ' + this.phase, '#ff00c8');
      this.prevPhase = this.phase;
    }

    const spd = [1, 1.2, 1.5, 2][this.phase - 1];
    const T = this.bossTimers;
    T.turret = (T.turret || 0) - dt;
    T.homing = (T.homing || 0) - dt;
    T.spawn  = (T.spawn  || 0) - dt;
    T.beam   = (T.beam   || 0) - dt;
    T.shield = (T.shield || 0) - dt;
    T.void   = (T.void   || 0) - dt;
    T.shock  = (T.shock  || 0) - dt;
    T.move   = (T.move   || 0) - dt;

    // Movement — patrol within boss room
    if (T.move <= 0) {
      if (this.room) this.patrolTarget = {
        x: this.room.x + rnd(2, this.room.w - 2),
        y: this.room.y + rnd(2, this.room.h - 2)
      };
      T.move = 1.5 / spd;
    }
    if (this.patrolTarget) this.moveToward(this.patrolTarget.x, this.patrolTarget.y, spd * 2, dt, map);

    // Phase 1+: Radial turret shots (from SENTINEL)
    if (T.turret <= 0) {
      const n = this.phase >= 3 ? 8 : this.phase >= 2 ? 5 : 4;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TWO_PI + this.bobAngle;
        projectiles.push(new Projectile(this.x, this.y, Math.cos(a), Math.sin(a), 8, this.atk, 18, '#ff00c8', false, false));
      }
      audio.shoot(false);
      T.turret = 2 / spd;
    }

    // Phase 1+: Homing missile at player (from HIVE)
    if (T.homing <= 0 && los) {
      this.fireAt(player.x, player.y, 7, this.atk + 5, 20, '#aa00ff');
      T.homing = 2.5 / spd;
    }

    // Phase 2+: Spawn crawlers (inherited from HIVE) and drones — capped at 8 active adds
    if (this.phase >= 2 && T.spawn <= 0 && this.spawnCooldown <= 0) {
      const activeAdds = enemies.filter(e => !e.dead && !e.isBoss && e.room === this.room).length;
      if (activeAdds < 8) {
        const addType = Math.random() < 0.6 ? 'CRAWLER' : 'DRONE';
        const count = Math.min(this.phase >= 4 ? 3 : 2, 8 - activeAdds);
        for (let i = 0; i < count; i++) {
          const add = spawnEnemy(addType, this.x + rnd(-3, 3), this.y + rnd(-3, 3), game.floor, this.room, false);
          enemies.push(add);
        }
      }
      T.spawn = 5 / spd;
      this.spawnCooldown = 0.5;
    }

    // Phase 3+: Beam fan (5–7 piercing beams aimed at player)
    if (this.phase >= 3 && T.beam <= 0) {
      const [dx, dy] = norm(player.x - this.x, player.y - this.y);
      const count = this.phase >= 4 ? 7 : 5;
      const half = Math.floor(count / 2);
      for (let i = -half; i <= half; i++) {
        const a = Math.atan2(dy, dx) + i * 0.18;
        projectiles.push(new Projectile(this.x, this.y, Math.cos(a), Math.sin(a), 14, 35, 22, '#ff00c8', true, false));
      }
      audio.shoot(false);
      T.beam = 3.5 / spd;
    }

    // Phase 3+: Shield burst — AoE knockback+damage within 5 tiles (from SENTINEL)
    if (this.phase >= 3 && T.shield <= 0) {
      if (d < 5) {
        const [kx, ky] = norm(player.x - this.x, player.y - this.y);
        player.x += kx * 3;
        player.y += ky * 3;
        clampToBossRoom(player);
        player.takeDamage(Math.round(20*getDiff().enemyAtk));
        spawnParticles(this.x, this.y, 'EXPLOSION', '#ff00c8', 12);
      }
      T.shield = 6 / spd;
    }

    // Phase 4: Psionic shockwave — AoE damage within 7 tiles (from HIVE)
    if (this.phase >= 4 && T.shock <= 0) {
      if (d < 7) {
        player.takeDamage(Math.round(25*getDiff().enemyAtk));
        spawnParticles(player.x, player.y, 'EXPLOSION', '#aa00ff', 10);
      }
      spawnParticles(this.x, this.y, 'EXPLOSION', '#aa00ff', 20);
      T.shock = 4 / spd;
    }

    // Phase 4: Void orbs — expanding AoE zones that fill the room
    if (this.phase >= 4 && T.void <= 0 && this.room) {
      const count = rndInt(2, 3);
      for (let i = 0; i < count; i++) {
        this.voidOrbs.push({
          x: this.room.x + rnd(2, this.room.w - 2),
          y: this.room.y + rnd(2, this.room.h - 2),
          radius: 0, maxRadius: rnd(4, 7),
          age: 0, maxAge: 2.5,
          tickCd: 0
        });
      }
      T.void = 3.5 / spd;
    }

    // Update void orbs — expand and tick damage
    for (let i = this.voidOrbs.length - 1; i >= 0; i--) {
      const orb = this.voidOrbs[i];
      orb.age += dt;
      orb.radius = orb.maxRadius * Math.min(1, orb.age / (orb.maxAge * 0.6));
      orb.tickCd = Math.max(0, orb.tickCd - dt);
      if (orb.age >= orb.maxAge) { this.voidOrbs.splice(i, 1); continue; }
      // tick damage every 0.5s while player is inside
      if (orb.tickCd <= 0 && dist(player.x, player.y, orb.x, orb.y) < orb.radius) {
        player.takeDamage(Math.round(15*getDiff().enemyAtk));
        spawnParticles(player.x, player.y, 'SPARK', '#aa00ff', 4);
        orb.tickCd = 0.5;
      }
    }
  }

  draw(camX,camY) {
    if (this.dead) return;
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    if (sx<-40||sx>W+40||sy<-40||sy>H+40) return;

    let alpha=1;
    if (this.type==='PHANTOM' && !this.visible) alpha=0.08;

    ctx.save();
    ctx.globalAlpha=alpha;

    const col=this.flashTimer>0?'#ffffff':this.colour;
    const elitePulse = this.elite ? 12 + Math.sin(this.bobAngle * 2) * 8 : 0;
    ctx.shadowBlur=this.isBoss?20: this.elite ? 10 + elitePulse : 10;
    ctx.shadowColor=col;
    ctx.fillStyle=col;

    if (this.isBoss) {
      // Draw void orbs as ground effects (OMEGA phase 4)
      if (this.voidOrbs.length > 0) {
        for (const orb of this.voidOrbs) {
          const ox = orb.x * TILE - camX, oy = orb.y * TILE - camY;
          const r = orb.radius * TILE;
          const fade = 1 - (orb.age / orb.maxAge);
          ctx.save();
          ctx.globalAlpha = fade * 0.3;
          ctx.fillStyle = '#aa00ff';
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#aa00ff';
          ctx.beginPath();
          ctx.arc(ox, oy, r, 0, TWO_PI);
          ctx.fill();
          // Ring edge
          ctx.globalAlpha = fade * 0.7;
          ctx.strokeStyle = '#ff00c8';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      }

      const sz=this.type==='OMEGA'?22:18;
      ctx.beginPath();
      ctx.arc(sx,sy,sz,0,TWO_PI);
      ctx.fill();
      // boss HP bar
      ctx.shadowBlur=0;
      ctx.fillStyle='#333';
      ctx.fillRect(sx-25,sy-30,50,5);
      ctx.fillStyle=this.colour;
      ctx.fillRect(sx-25,sy-30,50*(this.hp/this.maxHp),5);
    } else {
      const sz=TILE*(this.isShard?0.25:0.4);
      ctx.fillRect(sx-sz/2, sy-sz/2, sz, sz);
      // Shielder: draw 120° shield arc facing the player
      if (this.type === 'SHIELDER') {
        ctx.save();
        ctx.strokeStyle = '#66eeff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#66eeff';
        ctx.globalAlpha = 0.7 + Math.sin(this.bobAngle * 2) * 0.15;
        const shieldR = sz * 1.2;
        ctx.beginPath();
        ctx.arc(sx, sy, shieldR, this.shieldAngle - Math.PI / 3, this.shieldAngle + Math.PI / 3);
        ctx.stroke();
        ctx.restore();
      }
      // elite diamond marker
      if (this.elite) {
        ctx.fillStyle='#ffffff';
        ctx.shadowColor='#ffffff';
        ctx.shadowBlur=6;
        ctx.beginPath();
        ctx.moveTo(sx, sy - sz - 4);
        ctx.lineTo(sx + 3, sy - sz - 1);
        ctx.lineTo(sx, sy - sz + 2);
        ctx.lineTo(sx - 3, sy - sz - 1);
        ctx.closePath();
        ctx.fill();
      }
      // small hp bar
      if (this.hp<this.maxHp) {
        ctx.shadowBlur=0;
        ctx.fillStyle='#333';
        ctx.fillRect(sx-8,sy-12,16,2);
        ctx.fillStyle= this.elite ? '#ffffff' : this.colour;
        ctx.fillRect(sx-8,sy-12,16*(this.hp/this.maxHp),2);
      }
    }
    ctx.restore();
  }
}

// ─── Enemy Weights & Spawning ─────────────────────────────────────────────────
const ENEMY_WEIGHTS = {
  GUARD:    { base: 40, perFloor: -3 },   // common early, fades
  TURRET:   { base: 20, perFloor: 1 },    // steady
  CRAWLER:  { base: 10, perFloor: 3 },    // ramps up mid-game
  PHANTOM:  { base: 5,  perFloor: 4 },    // late-game threat
  DRONE:    { base: 5,  perFloor: 3 },    // late-game ranged
  SHIELDER: { base: 3,  perFloor: 2, minFloor: 3 },  // mid-game tank
  SPLITTER: { base: 2,  perFloor: 2, minFloor: 4 },  // splits into SHARDs on death
  GRENADIER:{ base: 1,  perFloor: 2, minFloor: 5 },  // late-game zone denial
};
const ENEMY_TYPES_LIST = Object.keys(ENEMY_WEIGHTS);

function pickEnemyType(floorNum) {
  const weights = [];
  let total = 0;
  for (const t of ENEMY_TYPES_LIST) {
    const cfg = ENEMY_WEIGHTS[t];
    if (cfg.minFloor && floorNum < cfg.minFloor) continue; // floor-gated
    const w = Math.max(1, cfg.base + cfg.perFloor * (floorNum - 1));
    weights.push({ type: t, w });
    total += w;
  }
  let r = Math.random() * total;
  for (const { type, w } of weights) { r -= w; if (r <= 0) return type; }
  return 'GUARD';
}

function spawnEnemy(type,x,y,floorNum,room,allowElite) {
  const scale=1+0.15*(floorNum-1);
  const d=getDiff();
  let hp,atk,spd,xpVal,colour;
  switch(type) {
    case 'GUARD':   hp=40;  atk=8;  spd=2;   xpVal=20; colour='#ff3333'; break;
    case 'TURRET':  hp=25;  atk=12; spd=0;   xpVal=15; colour='#ffb700'; break;
    case 'CRAWLER': hp=20;  atk=6;  spd=4;   xpVal=10; colour='#39ff14'; break;
    case 'PHANTOM': hp=35;  atk=10; spd=2.5; xpVal=30; colour='#cc00ff'; break;
    case 'DRONE':   hp=15;  atk=8;  spd=3;   xpVal=12; colour='#00aaff'; break;
    case 'SHIELDER':hp=50;  atk=10; spd=1.5; xpVal=25; colour='#66eeff'; break;
    case 'GRENADIER':hp=30; atk=10; spd=2;   xpVal=20; colour='#ff6622'; break;
    case 'SPLITTER':hp=40;  atk=8;  spd=2.2; xpVal=25; colour='#00ff88'; break;
    case 'SHARD':   hp=15;  atk=5;  spd=3.5; xpVal=8;  colour='#00cc66'; break;
    case 'SENTINEL':hp=300; atk=15; spd=1.5; xpVal=200;colour='#ff4444'; break;
    case 'HIVE':    hp=500; atk=18; spd=1.2; xpVal=350;colour='#aa00ff'; break;
    case 'OMEGA':   hp=1000;atk=22; spd=1.8; xpVal=800;colour='#ff00c8'; break;
  }
  const isBoss = ['SENTINEL','HIVE','OMEGA'].includes(type);
  // Floor modifier HP scaling (before construction so maxHp stays in sync)
  if (!isBoss) {
    if (game.modifier === 'SWARM')     hp = Math.round(hp * 0.6);
    if (game.modifier === 'FORTIFIED') hp = Math.round(hp * 1.4);
  }
  const e=new Enemy(x,y,
    Math.round(hp*scale*d.enemyHp), Math.round(atk*scale*d.enemyAtk),
    spd*d.enemySpd, xpVal, colour, type);
  e.room=room;
  e.isBoss=isBoss;
  e.elite=false;
  if (type==='PHANTOM') e.visible=false;
  if (type==='SHARD') { e.isShard=true; e.attackTimer=0.5; }
  if (isBoss) { e.maxHp=e.hp; }
  // Elite roll: difficulty-scaled chance on floor 3+, never on bosses
  if (allowElite !== false && !isBoss && floorNum >= 3 && Math.random() < d.eliteRate) {
    e.elite = true;
    e.hp = Math.round(e.hp * 1.8);
    e.maxHp = e.hp;
    e.atk = Math.round(e.atk * 1.3);
    e.spd *= 1.15;
    e.xpValue = Math.round(e.xpValue * 1.25);
  }
  return e;
}

// ─── Player ───────────────────────────────────────────────────────────────────
class Player {
  constructor() { this.reset(); }
  reset() {
    this.x=5; this.y=5;
    this.hp=100; this.maxHp=100;
    this.atk=10; this.def=2; this.spd=3.5;
    this.level=1; this.xp=0;
    this.weapon=WEAPONS.PULSE_PISTOL;
    this.score=0;
    this.invincibleTimer=0;
    this.shootCooldown=0;
    this.facing={x:1,y:0};
    this.speedBoost=0; this.speedTimer=0;
    this.shieldBonus=0;
    this.shards=0;
    this.flashTimer=0;
    this.levelFlash=0;
    this.lowHpTimer=0;
    this.keys={red:0, blue:0, gold:0};
    this.trapCooldown=0;
    this.plasmaBurnTimer=0;  // cosmetic throttle for plasma damage messages
    this.arcCooldown=0;      // separate cooldown for arc grid zaps
    this.upgrades={};       // persistent upgrade levels: {SAW_BLADE:2, ...}
    this.permSpeedBonus=0;  // from OVERCLOCK
    this.orbitalAngle=0;    // shared rotation for saw blades
    this.orbitalHits=new Map(); // enemy→cooldown for orbital damage
    this.spellTimers={plasmaOrb:2}; // cooldown timers for auto-spells
    this.perks={};              // level-unlocked passive abilities
    this.energyShield=false;    // active energy shield bubble
    this.energyShieldTimer=0;   // recharge countdown (30s)
    this.autoLaserTimer=0;      // auto-laser cooldown
    this.autoLaserBeam=null;    // {x1,y1,x2,y2,timer} for beam rendering
    this.credits=0;             // vendor currency
    this.loreRead=new Set();    // indices of lore entries read this run
  }

  xpNeeded() { return this.level*80; }

  gainXP(amount) {
    this.xp+=Math.round(amount * getMetaXPMultiplier());
    while (this.xp>=this.xpNeeded() && this.level<10) {
      this.xp-=this.xpNeeded();
      this.level++;
      this.maxHp+=20; this.hp=this.maxHp;
      this.atk+=3; this.def+=1;
      this.levelFlash=1.5;
      audio.levelUp();
      game.msg('LEVEL UP! Now level '+this.level,'#00f5ff');
      checkPerkUnlocks(this, this.level);
    }
  }

  takeDamage(dmg) {
    if (this.invincibleTimer>0) return;
    // Energy shield absorbs the hit
    if (this.energyShield && this.perks.ENERGY_SHIELD) {
      this.energyShield=false;
      this.energyShieldTimer=30;
      this.invincibleTimer=0.3;
      audio.shieldBreak();
      spawnParticles(this.x,this.y,'EXPLOSION','#4488ff',12);
      spawnDmgText(this.x, this.y, 'BLOCK', '#4488ff');
      game.msg('🛡 SHIELD BROKEN','#4488ff');
      triggerShake(4, 0.15);
      return;
    }
    const actual=Math.max(1,dmg-this.def);
    this.hp=Math.max(0,this.hp-actual);
    this.invincibleTimer=0.5;
    this.flashTimer=0.2;
    spawnDmgText(this.x, this.y, actual, '#ff4444');
    triggerShake(Math.min(actual * 0.4, 8), 0.2);
    audio.hit(true);
    spawnParticles(this.x,this.y,'BLOOD','#ff4444',5);
    if (this.hp<=0) { audio.gameOver(); game.endRun(false); }
  }

  shoot(aimX,aimY,map) {
    if (this.shootCooldown>0) return;
    const w=this.weapon;
    const [dx,dy]=norm(aimX-this.x,aimY-this.y);

    if (w.melee) {
      // plasma sword arc
      spawnParticles(this.x+dx*1.5, this.y+dy*1.5,'EXPLOSION',w.colour,8);
      for (const e of enemies) {
        if (e.dead) continue;
        if (dist(this.x,this.y,e.x,e.y)<w.range) {
          e.takeDamage(w.dmg+this.atk, w.name);
        }
      }
    } else {
      for (let i=0;i<w.count;i++) {
        const spread=(Math.random()-0.5)*(w.spread + (game.modifier==='SCRAMBLED' ? 0.15 : 0));
        const a=Math.atan2(dy,dx)+spread;
        const pdx=Math.cos(a), pdy=Math.sin(a);
        const proj=new Projectile(
          this.x,this.y,pdx,pdy,12,w.dmg+this.atk,w.range,
          w.colour,!!w.piercing,true,w.name
        );
        if (this.perks.PIERCING_ROUNDS) proj.maxPierces+=1;
        proj.bouncesLeft=this.upgrades.RICOCHET||0;
        if (proj.bouncesLeft) proj._hasRicochet=true;
        projectiles.push(proj);
      }
      spawnParticles(this.x+dx*0.8,this.y+dy*0.8,'MUZZLE',w.colour,3);
    }
    audio.shoot(true, w);
    this.shootCooldown=1/w.rate;
  }

  useVoidShard() {
    if (!this.shards) return;
    this.shards--;
    for (const e of enemies) {
      if (!e.dead && dist(this.x,this.y,e.x,e.y)<6) e.takeDamage(80, 'Void Cannon');
    }
    spawnParticles(this.x,this.y,'EXPLOSION','#aa00ff',30);
    game.msg('VOID SHARD DETONATED!','#aa00ff');
    triggerShake(10, 0.3);
  }

  update(dt,map) {
    this.invincibleTimer=Math.max(0,this.invincibleTimer-dt);
    this.shootCooldown=Math.max(0,this.shootCooldown-dt);
    this.flashTimer=Math.max(0,this.flashTimer-dt);
    this.levelFlash=Math.max(0,this.levelFlash-dt);
    if (this.speedTimer>0) { this.speedTimer-=dt; if(this.speedTimer<=0)this.speedBoost=0; }

    // Energy shield recharge
    if (this.perks.ENERGY_SHIELD && !this.energyShield && this.energyShieldTimer>0) {
      this.energyShieldTimer-=dt;
      if (this.energyShieldTimer<=0) {
        this.energyShield=true;
        this.energyShieldTimer=0;
        audio.shieldRestore();
        game.msg('🛡 SHIELD RESTORED','#4488ff');
      }
    }

    // Low health warning pulse
    if (this.hp > 0 && this.hp / this.maxHp <= 0.25) {
      this.lowHpTimer -= dt;
      if (this.lowHpTimer <= 0) { audio.lowHealth(); this.lowHpTimer = 2; }
    } else { this.lowHpTimer = 0; }

    const spd=modSpeed(this.spd+(this.speedBoost||0)+(this.permSpeedBonus||0));
    let mx=0,my=0;
    if (keys.has('KeyW')||keys.has('ArrowUp'))    my=-1;
    if (keys.has('KeyS')||keys.has('ArrowDown'))  my= 1;
    if (keys.has('KeyA')||keys.has('ArrowLeft'))  mx=-1;
    if (keys.has('KeyD')||keys.has('ArrowRight')) mx= 1;
    // touch joystick
    if (touch.joystick.active) { mx+=touch.joystick.dx; my+=touch.joystick.dy; }

    if (mx||my) {
      const [ndx,ndy]=norm(mx,my);
      const nx=this.x+ndx*spd*dt;
      const ny=this.y+ndy*spd*dt;
      const tx=Math.floor(nx), ty=Math.floor(this.y);
      const ox=Math.floor(this.x),oy=Math.floor(ny);
      if (tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H && isPassable(map[ty][tx])) this.x=nx;
      if (ox>=0&&oy>=0&&ox<MAP_W&&oy<MAP_H && isPassable(map[oy][ox])) this.y=ny;
      this.facing={x:ndx,y:ndy};
    }

    // void shard
    if (jp('KeyV')) this.useVoidShard();
  }

  draw(camX,camY) {
    const sx=this.x*TILE-camX, sy=this.y*TILE-camY;
    const col=this.flashTimer>0?'#ffffff':'#00f5ff';

    // Laser sight (drawn under player so it originates from centre)
    if (this.perks.LASER_SIGHT && game.dungeon && !this.weapon.melee) {
      const map = game.dungeon.map;
      const maxDist = this.weapon.range;
      const step = 0.15;
      let rx = this.x, ry = this.y;
      for (let d = 0; d < maxDist; d += step) {
        const nx = rx + this.facing.x * step;
        const ny = ry + this.facing.y * step;
        const tx = Math.floor(nx), ty = Math.floor(ny);
        if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) break;
        if (!isPassable(map[ty][tx])) break;
        rx = nx; ry = ny;
      }
      const ex = rx*TILE-camX, ey = ry*TILE-camY;
      const lc = this.weapon.colour;
      ctx.save();
      // Beam line — thin, translucent, with glow
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = lc;
      ctx.shadowBlur = 8; ctx.shadowColor = lc;
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.setLineDash([]);
      // Endpoint dot
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = lc;
      ctx.beginPath();
      ctx.arc(ex, ey, 2.5, 0, TWO_PI);
      ctx.fill();
      ctx.restore();
    }

    // Auto-Laser beam effect
    if (this.autoLaserBeam) {
      const b = this.autoLaserBeam;
      const alpha = b.timer / 0.15;
      ctx.save();
      // Outer glow
      ctx.globalAlpha = alpha * 0.6;
      ctx.strokeStyle = '#ff2222';
      ctx.shadowBlur = 14; ctx.shadowColor = '#ff2222';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(b.x1*TILE-camX, b.y1*TILE-camY);
      ctx.lineTo(b.x2*TILE-camX, b.y2*TILE-camY);
      ctx.stroke();
      // Bright core
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x1*TILE-camX, b.y1*TILE-camY);
      ctx.lineTo(b.x2*TILE-camX, b.y2*TILE-camY);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    // body
    ctx.shadowBlur=15; ctx.shadowColor=col;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(sx,sy,7,0,TWO_PI);
    ctx.fill();
    // direction pip
    ctx.shadowBlur=5;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(sx+this.facing.x*7,sy+this.facing.y*7,2.5,0,TWO_PI);
    ctx.fill();
    ctx.restore();

    // Energy shield bubble
    if (this.energyShield && this.perks.ENERGY_SHIELD) {
      ctx.save();
      const pulse=0.15*Math.sin(performance.now()*0.004);
      ctx.globalAlpha=0.25+pulse;
      ctx.strokeStyle='#4488ff';
      ctx.shadowBlur=12; ctx.shadowColor='#4488ff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(sx,sy,12,0,TWO_PI);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ─── Camera ───────────────────────────────────────────────────────────────────
function getCamera(player) {
  const worldW = MAP_W * TILE, worldH = MAP_H * TILE;
  const camX = W >= worldW
    ? -(W - worldW) / 2
    : clamp(player.x * TILE - W / 2, 0, worldW - W);
  const botClear = layout.hudH / 2;
  const camY = H >= worldH
    ? -(H - worldH) / 2
    : clamp(player.y * TILE - H / 2 + botClear, 0, worldH - H + botClear);
  return { x: camX, y: camY };
}

// ─── Renderer ─────────────────────────────────────────────────────────────────
function drawWorld(dungeon, camX, camY) {
  const startX=Math.max(0,Math.floor(camX/TILE)-1);
  const startY=Math.max(0,Math.floor(camY/TILE)-1);
  const endX=Math.min(MAP_W,startX+Math.ceil(W/TILE)+2);
  const endY=Math.min(MAP_H,startY+Math.ceil((H-layout.hudH)/TILE)+2);

  for (let ty=startY; ty<endY; ty++) {
    for (let tx=startX; tx<endX; tx++) {
      const tile=dungeon.map[ty][tx];
      const vis=dungeon.visited[ty][tx];
      if (!vis) continue;
      const lv=dungeon.light[ty][tx];
      const brightness=lv>0 ? Math.max(0.2,lv) : 0.12;
      const sx=tx*TILE-camX, sy=ty*TILE-camY;

      ctx.save();
      ctx.globalAlpha=brightness;
      switch(tile) {
        case T.WALL: {
          const isSealed = game.bossSealed && game.bossEntrances.some(e=>e.x===tx&&e.y===ty);
          ctx.fillStyle = isSealed ? '#2e1a1a' : '#1a1a2e';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle = isSealed ? '#5e2d2d' : '#2d2d5e';
          ctx.fillRect(sx,sy,TILE,2);
          ctx.fillRect(sx,sy,2,TILE);
          if (isSealed) {
            ctx.shadowBlur=8; ctx.shadowColor='#ff3333';
            ctx.fillStyle='#ff3333';
            ctx.globalAlpha=brightness*0.4;
            ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
          }
          break;
        }
        case T.FLOOR: {
          const rc = dungeon.roomColour[ty]?.[tx];
          ctx.fillStyle = rc || '#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          if ((tx+ty)%4===0) { ctx.fillStyle= rc ? '#0a0a0a' : '#13132a'; ctx.globalAlpha=brightness*0.3; ctx.fillRect(sx,sy,TILE,TILE); }
          break;
        }
        case T.STAIRS:
          ctx.fillStyle='#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness;
          ctx.shadowBlur=8; ctx.shadowColor='#ffff00';
          ctx.fillStyle='#ffff00';
          ctx.font='14px monospace';
          ctx.fillText('▼',sx+3,sy+14);
          break;
        case T.TERMINAL:
          ctx.fillStyle='#0f0f1f';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.shadowBlur=12; ctx.shadowColor='#00f5ff';
          ctx.fillStyle='#00f5ff';
          ctx.font='13px monospace';
          ctx.fillText('⬡',sx+2,sy+14);
          break;
        case T.VENDOR:
          ctx.fillStyle='#0a1a0f';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness;
          ctx.shadowBlur=10; ctx.shadowColor='#39ff14';
          ctx.fillStyle='#39ff14';
          ctx.font='13px monospace';
          ctx.fillText('◈',sx+2,sy+14);
          break;
        case T.LORE: {
          ctx.fillStyle='#1a1208';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness;
          const lorePulse = 0.7 + 0.3 * Math.sin(lastTime / 600 + tx * 1.1 + ty * 0.7);
          ctx.shadowBlur=8; ctx.shadowColor='#ffb700';
          ctx.fillStyle=`rgba(255,183,0,${lorePulse})`;
          ctx.font='13px monospace';
          ctx.fillText('◫',sx+2,sy+14);
          break;
        }
        case T.DOOR:
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle='#664422'; ctx.fillRect(sx+2,sy+1,TILE-4,TILE-2);
          ctx.fillStyle='#886633'; ctx.fillRect(sx+3,sy+2,TILE-6,TILE-4);
          ctx.fillStyle='#aa8844'; ctx.fillRect(sx+TILE-7,sy+TILE/2-2,3,3); // handle
          break;
        case T.DOOR_OPEN:
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle='#33261a'; ctx.fillRect(sx,sy,3,TILE);
          ctx.fillStyle='#33261a'; ctx.fillRect(sx+TILE-3,sy,3,TILE);
          break;
        case T.LOCKED_R: case T.LOCKED_B: case T.LOCKED_G: {
          const lc=tile===T.LOCKED_R?'#ff3333':tile===T.LOCKED_B?'#3388ff':'#ffcc00';
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle='#443322'; ctx.fillRect(sx+2,sy+1,TILE-4,TILE-2);
          ctx.shadowBlur=8; ctx.shadowColor=lc;
          ctx.fillStyle=lc; ctx.fillRect(sx+TILE/2-3,sy+TILE/2-3,6,6); // lock glow
          break;
        }
        case T.TRAP_SPIKE:
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness*0.35;
          ctx.fillStyle='#ff6644';
          for (let s=0;s<3;s++) ctx.fillRect(sx+3+s*6,sy+TILE-6,2,5); // subtle spikes
          break;
        case T.TRAP_SLOW:
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          ctx.globalAlpha=brightness*0.25;
          ctx.fillStyle='#8866ff';
          ctx.fillRect(sx+3,sy+3,TILE-6,TILE-6); // subtle goo
          break;
        case T.PLASMA: {
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          // Animated orange glow with pulsing brightness
          const pPulse = 0.3 + 0.15 * Math.sin(lastTime / 400 + tx * 0.7 + ty * 1.3);
          ctx.globalAlpha = brightness * pPulse;
          ctx.fillStyle='#ff4400';
          ctx.fillRect(sx+1,sy+1,TILE-2,TILE-2);
          // Bright core
          ctx.globalAlpha = brightness * pPulse * 0.6;
          ctx.fillStyle='#ff8800';
          ctx.fillRect(sx+3,sy+3,TILE-6,TILE-6);
          // Shimmer bubbles
          ctx.shadowBlur=4; ctx.shadowColor='#ff6600';
          const bx = sx + 4 + Math.sin(lastTime/300 + tx*2) * 3;
          const by = sy + 4 + Math.cos(lastTime/350 + ty*2) * 3;
          ctx.fillStyle='#ffaa33';
          ctx.globalAlpha = brightness * 0.4;
          ctx.fillRect(bx, by, 2, 2);
          break;
        }
        case T.ARC: {
          ctx.fillStyle='#0f0f1f'; ctx.fillRect(sx,sy,TILE,TILE);
          // Phase-based rendering: bright when active, dim when off
          const arcActive = Math.sin((game.floorTime||0) * Math.PI) > 0;
          const aAlpha = arcActive ? 0.5 + 0.2 * Math.sin(lastTime/80) : 0.1;
          ctx.globalAlpha = brightness * aAlpha;
          ctx.fillStyle = arcActive ? '#44ccff' : '#1a3344';
          ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
          if (arcActive) {
            // Crackling arc lines
            ctx.shadowBlur=6; ctx.shadowColor='#00ccff';
            ctx.strokeStyle='#88eeff';
            ctx.lineWidth=1;
            ctx.globalAlpha = brightness * 0.7;
            ctx.beginPath();
            const mid = TILE/2;
            ctx.moveTo(sx+2, sy+mid + Math.sin(lastTime/50)*3);
            ctx.lineTo(sx+mid, sy+mid + Math.cos(lastTime/60)*4);
            ctx.lineTo(sx+TILE-2, sy+mid + Math.sin(lastTime/70+1)*3);
            ctx.stroke();
            // Vertical arc
            ctx.beginPath();
            ctx.moveTo(sx+mid + Math.cos(lastTime/55)*3, sy+2);
            ctx.lineTo(sx+mid + Math.sin(lastTime/65)*4, sy+mid);
            ctx.lineTo(sx+mid + Math.cos(lastTime/75+1)*3, sy+TILE-2);
            ctx.stroke();
          }
          break;
        }
        case T.CRACKED: {
          // Render as wall base
          ctx.fillStyle='#1a1a2e';
          ctx.fillRect(sx,sy,TILE,TILE);
          ctx.fillStyle='#2d2d5e';
          ctx.fillRect(sx,sy,TILE,2);
          ctx.fillRect(sx,sy,2,TILE);
          // Show crack lines only when player is within 3 tiles
          const pdx=tx-Math.floor(game.player.x), pdy=ty-Math.floor(game.player.y);
          const pDist=Math.sqrt(pdx*pdx+pdy*pdy);
          if (pDist <= 3) {
            const crackAlpha = brightness * Math.max(0.15, 0.5 * (1 - pDist/3));
            ctx.globalAlpha = crackAlpha;
            ctx.strokeStyle='#ffb700';
            ctx.shadowBlur=4; ctx.shadowColor='#ffb700';
            ctx.lineWidth=1;
            ctx.beginPath();
            const seed = tx * 137 + ty * 311;
            const mx = sx + TILE/2 + (seed%5-2);
            const my = sy + TILE/2 + (seed%7-3);
            ctx.moveTo(sx+2, my-2);
            ctx.lineTo(mx-1, my+1);
            ctx.lineTo(sx+TILE-3, my+2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mx+1, sy+3);
            ctx.lineTo(mx-2, my);
            ctx.lineTo(mx+2, sy+TILE-3);
            ctx.stroke();
          }
          break;
        }
      }
      ctx.restore();
    }
  }
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawHUD(player) {
  const y = layout.hudTop;
  const lx = 14 + safeLeft;   // left anchor respecting safe area
  ctx.save();
  ctx.fillStyle='rgba(10,10,18,0.85)';
  ctx.fillRect(0, y - 2, W, H - y + 2);

  if (layout.compact) {
    // ── Compact portrait: two rows ──
    const fs = 10;
    const r1 = y + 4;   // row 1 baseline offset
    const r2 = y + 28;  // row 2 baseline offset
    const hpW = Math.min(100, W * 0.25);

    // Row 1: HP bar + FLR + score
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(lx, r1, hpW, 12);
    const hpFrac = player.hp / player.maxHp;
    const hpCol = hpFrac > 0.5 ? '#00f5ff' : hpFrac > 0.25 ? '#ffb700' : '#ff3333';
    ctx.shadowBlur=6; ctx.shadowColor=hpCol;
    ctx.fillStyle=hpCol; ctx.fillRect(lx, r1, hpW * hpFrac, 12);
    ctx.shadowBlur=0;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`, lx + 2, r1 + 10);

    const mid = lx + hpW + 10;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`FLR:${game.floor}`, mid, r1 + 10);

    // Floor modifier badge
    if (game.modifier) {
      const m = getMod();
      ctx.save();
      ctx.shadowBlur=4; ctx.shadowColor=m.colour;
      ctx.fillStyle=m.colour; ctx.font=`${fs-1}px monospace`;
      ctx.fillText(`${m.icon}${m.label}`, mid, r1 + 22);
      ctx.restore();
    }

    ctx.shadowBlur=4; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700'; ctx.font=`${fs + 1}px monospace`;
    ctx.textAlign='right';
    ctx.fillText(`SCORE:${player.score}`, W - 10 - safeRight, r1 + 10);
    // Combo counter (compact)
    if (combo.count >= 2) {
      const cc = comboColour();
      const a = combo.flashTimer > 0 ? 1 : 0.6 + 0.4 * (combo.timer / COMBO_WINDOW);
      ctx.globalAlpha = a;
      ctx.shadowBlur=6; ctx.shadowColor=cc;
      ctx.fillStyle=cc; ctx.font=`bold ${fs + 1}px monospace`;
      ctx.fillText(`×${comboMultiplier().toFixed(1)} ×${combo.count}`, W - 10 - safeRight, r1 + 22);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign='left'; ctx.shadowBlur=0;

    // Credits + Lore
    ctx.fillStyle='#39ff14'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`◈${player.credits}`, mid + 50, r1 + 10);
    if (player.loreRead.size > 0) {
      ctx.fillStyle='#ffb700';
      ctx.fillText(`◫${player.loreRead.size}`, mid + 90, r1 + 10);
    }

    // Row 2: LVL + XP bar + ATK + DEF + weapon
    ctx.fillStyle='#aaaacc'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`LV:${player.level}`, lx, r2 + 10);
    const xpBarX = lx + 34;
    const xpFrac = player.xp / player.xpNeeded();
    ctx.fillStyle='#333'; ctx.fillRect(xpBarX, r2 + 3, 36, 4);
    ctx.fillStyle='#ffb700'; ctx.fillRect(xpBarX, r2 + 3, 36 * xpFrac, 4);

    const statsX = xpBarX + 44;
    ctx.fillStyle='#e0e0ff'; ctx.font=`${fs}px monospace`;
    ctx.fillText(`A:${player.atk}`, statsX, r2 + 10);
    ctx.fillText(`D:${player.def}`, statsX + 36, r2 + 10);

    // Weapon — truncate if needed
    ctx.shadowBlur=6; ctx.shadowColor='#ff00c8';
    ctx.fillStyle='#ff00c8'; ctx.font=`${fs}px monospace`;
    const weapMaxW = W - (statsX + 80) - safeRight - 10;
    let weapName = player.weapon.name;
    if (ctx.measureText(weapName).width > weapMaxW && weapMaxW > 20) {
      while (weapName.length > 3 && ctx.measureText(weapName + '…').width > weapMaxW) weapName = weapName.slice(0, -1);
      weapName += '…';
    }
    ctx.fillText(weapName, statsX + 74, r2 + 10);
    ctx.shadowBlur=0;

    if (player.shards > 0) {
      ctx.fillStyle='#aa00ff'; ctx.font=`${fs}px monospace`;
      ctx.fillText(`V×${player.shards}`, statsX + 74, r2 + 22);
    }
    // Energy shield recharge indicator
    if (player.perks.ENERGY_SHIELD && !player.energyShield) {
      ctx.fillStyle='#4488ff'; ctx.font=`${fs}px monospace`;
      ctx.fillText(`🛡${Math.ceil(player.energyShieldTimer)}s`, lx, r2 + 22);
    }
  } else {
    // ── Standard landscape HUD: single row ──
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(lx, y + 4, 130, 14);
    const hpFrac = player.hp / player.maxHp;
    const hpCol = hpFrac > 0.5 ? '#00f5ff' : hpFrac > 0.25 ? '#ffb700' : '#ff3333';
    ctx.shadowBlur=6; ctx.shadowColor=hpCol;
    ctx.fillStyle=hpCol; ctx.fillRect(lx, y + 4, 130 * hpFrac, 14);
    ctx.shadowBlur=0;

    ctx.fillStyle='#e0e0ff'; ctx.font='11px monospace';
    ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`, lx + 4, y + 15);

    const colBase = lx + 141;
    ctx.fillStyle='#aaaacc'; ctx.font='11px monospace';
    ctx.fillText(`LVL:${player.level}`, colBase, y + 10);
    const xpFrac = player.xp / player.xpNeeded();
    ctx.fillStyle='#333'; ctx.fillRect(colBase, y + 12, 50, 4);
    ctx.fillStyle='#ffb700'; ctx.fillRect(colBase, y + 12, 50 * xpFrac, 4);

    ctx.fillStyle='#e0e0ff';
    ctx.fillText(`ATK:${player.atk}`, colBase + 60, y + 10);
    ctx.fillText(`DEF:${player.def}`, colBase + 105, y + 10);
    ctx.fillText(`FLR:${game.floor}`, colBase + 160, y + 10);

    // Floor modifier badge
    if (game.modifier) {
      const m = getMod();
      ctx.save();
      ctx.shadowBlur=4; ctx.shadowColor=m.colour;
      ctx.fillStyle=m.colour;
      ctx.fillText(`${m.icon}${m.label}`, colBase + 160, y + 22);
      ctx.restore();
    }

    ctx.shadowBlur=6; ctx.shadowColor='#ff00c8';
    ctx.fillStyle='#ff00c8';
    ctx.fillText(player.weapon.name, colBase + 220, y + 10);
    ctx.shadowBlur=0;

    if (player.shards > 0) {
      ctx.fillStyle='#aa00ff'; ctx.fillText(`[V] Void Shard ×${player.shards}`, colBase + 220, y + 22);
    }
    // Energy shield recharge indicator
    if (player.perks.ENERGY_SHIELD && !player.energyShield) {
      ctx.fillStyle='#4488ff'; ctx.fillText(`🛡 ${Math.ceil(player.energyShieldTimer)}s`, colBase, y + 22);
    }

    ctx.shadowBlur=4; ctx.shadowColor='#ffb700';
    ctx.fillStyle='#ffb700';
    ctx.font='12px monospace';
    ctx.fillText(`SCORE: ${player.score}`, W - 160 - safeRight, y + 12);
    ctx.shadowBlur=0;
    // Combo counter (landscape)
    if (combo.count >= 2) {
      const cc = comboColour();
      const a = combo.flashTimer > 0 ? 1 : 0.6 + 0.4 * (combo.timer / COMBO_WINDOW);
      ctx.globalAlpha = a;
      ctx.shadowBlur=6; ctx.shadowColor=cc;
      ctx.fillStyle=cc; ctx.font='bold 13px monospace';
      ctx.textAlign='right';
      ctx.fillText(`×${comboMultiplier().toFixed(1)} COMBO ×${combo.count}`, W - 10 - safeRight, y + 12);
      ctx.textAlign='left'; ctx.globalAlpha = 1;
    }
    ctx.shadowBlur=0;
    ctx.fillStyle='#39ff14'; ctx.font='11px monospace';
    ctx.fillText(`◈ ${player.credits}`, W - 160 - safeRight, y + 26);
    if (player.loreRead.size > 0) {
      ctx.fillStyle='#ffb700'; ctx.font='11px monospace';
      ctx.fillText(`◫ ${player.loreRead.size}`, W - 100 - safeRight, y + 26);
    }
  }
  ctx.restore();

  // Key indicators (above HUD bar)
  const hasKeys = player.keys.red + player.keys.blue + player.keys.gold > 0;
  if (hasKeys) {
    ctx.save();
    const keyY = layout.hudTop - 18;
    let kx = 14 + safeLeft;
    const keyData = [['red','#ff3333'],['blue','#3388ff'],['gold','#ffcc00']];
    for (const [col, hex] of keyData) {
      if (player.keys[col] > 0) {
        ctx.shadowBlur=6; ctx.shadowColor=hex;
        ctx.fillStyle=hex; ctx.font='bold 12px monospace';
        ctx.fillText('🔑×'+player.keys[col], kx, keyY);
        kx += 55;
      }
    }
    ctx.restore();
  }
  if (player.levelFlash>0) {
    ctx.save();
    ctx.globalAlpha=Math.min(0.5,player.levelFlash*0.35);
    ctx.fillStyle='#00f5ff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    if (player.levelFlash>0.5) {
      ctx.save();
      ctx.shadowBlur=20; ctx.shadowColor='#00f5ff';
      ctx.fillStyle='#00f5ff'; ctx.font='bold 36px monospace';
      ctx.textAlign='center'; ctx.fillText('LEVEL UP!',W/2,H/2-40);
      ctx.textAlign='left'; ctx.restore();
    }
  }
}

// ─── Minimap ──────────────────────────────────────────────────────────────────
function drawMinimap(dungeon, player) {
  const MW=120, MH=80, MX=W-MW-8-safeRight, MY=8+safeTop;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(MX-2,MY-2,MW+4,MH+4);
  ctx.strokeStyle='#2d2d5e'; ctx.lineWidth=1; ctx.strokeRect(MX-2,MY-2,MW+4,MH+4);

  const sx=MW/MAP_W, sy=MH/MAP_H;
  for (let ty=0;ty<MAP_H;ty++) {
    for (let tx=0;tx<MAP_W;tx++) {
      if (!dungeon.visited[ty][tx]) continue;
      const tile=dungeon.map[ty][tx];
      const px2=MX+tx*sx, py2=MY+ty*sy;
      let col=null;
      if (tile===T.WALL||tile===T.CRACKED) {
        col = (game.bossSealed && game.bossEntrances.some(e=>e.x===tx&&e.y===ty)) ? '#5e2d2d' : '#1a1a2e';
      }
      else if (tile===T.FLOOR||tile===T.DOOR_OPEN||tile===T.TRAP_SPIKE||tile===T.TRAP_SLOW) col='#202040';
      else if (tile===T.PLASMA) col='#ff6600';
      else if (tile===T.ARC) col= Math.sin((game.floorTime||0)*Math.PI)>0 ? '#44ccff' : '#1a3344';
      else if (tile===T.STAIRS||tile===T.TERMINAL) col='#ffff00';
      else if (tile===T.VENDOR) col='#39ff14';
      else if (tile===T.LORE) col='#ffb700';
      else if (tile===T.DOOR) col='#664422';
      else if (tile===T.LOCKED_R) col='#ff3333';
      else if (tile===T.LOCKED_B) col='#3388ff';
      else if (tile===T.LOCKED_G) col='#ffcc00';
      if (col) { ctx.fillStyle=col; ctx.fillRect(px2,py2,Math.max(1,sx),Math.max(1,sy)); }
    }
  }

  // enemies in visited areas
  for (const e of enemies) {
    if (e.dead||!dungeon.visited[Math.floor(e.y)]?.[Math.floor(e.x)]) continue;
    ctx.fillStyle='#ff3333';
    ctx.fillRect(MX+e.x*sx-1,MY+e.y*sy-1,2,2);
  }

  // player dot
  ctx.shadowBlur=6; ctx.shadowColor='#00f5ff';
  ctx.fillStyle='#00f5ff';
  ctx.fillRect(MX+player.x*sx-2,MY+player.y*sy-2,4,4);
  ctx.restore();
}

// ─── Messages ─────────────────────────────────────────────────────────────────
let messages=[];
function drawMessages() {
  for (let i=messages.length-1;i>=0;i--) {
    const m=messages[i];
    m.life-=1/60;
    if (m.life<=0){messages.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=Math.min(1,m.life);
    ctx.shadowBlur=6; ctx.shadowColor=m.colour;
    ctx.fillStyle=m.colour; ctx.font='13px monospace';
    ctx.fillText(m.text, 14+safeLeft, layout.msgBase-(messages.length-1-i)*16);
    ctx.restore();
  }
}

function drawHint() {
  const h = game.hint;
  if (!h) return;
  const pulse = 0.55 + 0.35 * Math.sin(Date.now() / 300);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.shadowBlur = 10; ctx.shadowColor = h.colour;
  ctx.fillStyle = h.colour;
  ctx.font = '13px monospace'; ctx.textAlign = 'center';
  ctx.fillText(h.text, W / 2, layout.hudTop - 14);
  ctx.restore();
}

function drawThreatIndicators(camX, camY) {
  if (!game.player.perks.THREAT_SENSE) return;
  const px = game.player.x, py = game.player.y;
  const margin = 14;
  const viewL = camX / TILE, viewT = camY / TILE;
  const viewR = (camX + W) / TILE, viewB = (camY + H - layout.hudH) / TILE;
  const range = 18;

  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'PHANTOM' && !e.visible) continue;
    const dx = e.x - px, dy = e.y - py;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1 || d > range) continue;
    // Skip enemies already on screen
    if (e.x > viewL + 1 && e.x < viewR - 1 && e.y > viewT + 1 && e.y < viewB - 1) continue;

    const sx = e.x * TILE - camX, sy = e.y * TILE - camY;
    // Clamp to screen edges
    const cx = clamp(sx, margin, W - margin);
    const cy = clamp(sy, margin, H - layout.hudH - margin);
    const ang = Math.atan2(dy, dx);
    const proximity = 1 - (d - 1) / Math.max(range - 1, 1); // 1=close, 0=far
    const size = 5 + proximity * 3;
    const pulse = 0.35 + 0.35 * proximity + 0.2 * Math.sin(Date.now() / 200 + d);
    const col = e.isBoss ? '#ff3333' : '#ff6644';

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.globalAlpha = pulse;
    ctx.shadowBlur = 8; ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.6, -size * 0.6);
    ctx.lineTo(-size * 0.6, size * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// ─── Floor population ─────────────────────────────────────────────────────────
function populateFloor(dungeon, floorNum) {
  enemies=[]; items=[]; projectiles=[]; particles=[]; hazardZones=[]; pendingEnemySpawns=[]; floatingTexts=[];
  shake.intensity=0; shake.timer=0; shake.ox=0; shake.oy=0;
  combo.count=0; combo.timer=0; combo.flashTimer=0;

  const spawnRoom=dungeon.spawnRoom;
  const bossRoom=dungeon.bossRoom;
  const bossTypes={3:'SENTINEL',6:'HIVE',10:'OMEGA'};

  for (let i=0;i<dungeon.rooms.length;i++) {
    const room=dungeon.rooms[i];
    if (room===spawnRoom) continue;
    if (room.roomType==='secret') continue; // lazy-spawn on reveal

    if (bossRoom && room===bossRoom) {
      const btype=bossTypes[floorNum];
      if (btype) {
        const b=spawnEnemy(btype,room.cx,room.cy,floorNum,room);
        enemies.push(b);
        game.bossRoom=bossRoom;
        game.bossEntrances=dungeon.bossEntrances||[];
        game.bossSealed=false;
        game.bossAlive=true;
      }
      continue;
    }

    // Room type modifiers
    const rt = room.roomType || null;
    const enemyMod = rt==='medbay' ? 0.3 : rt==='vault' ? 1.5 : rt==='armory' ? 0.5 : 1;

    // Enemy count scales with floor, capped by room area
    const minE = 2 + Math.floor(floorNum / 3);
    const maxE = Math.min(8, 4 + Math.floor(floorNum / 2));
    const areaCap = Math.floor(room.w * room.h / 8);
    let count = Math.min(areaCap, Math.round(rndInt(minE, maxE) * enemyMod));
    if (game.modifier === 'SWARM') count = Math.min(areaCap, Math.ceil(count * 1.5));

    let roomElite = false;  // max 1 elite per room
    const typeCounts = {};  // per-type caps within room
    const TYPE_CAPS = { PHANTOM: 1, TURRET: 2, DRONE: 2, SHIELDER: 1, SPLITTER: 2, GRENADIER: 1 };
    for (let j=0;j<count;j++) {
      let type = pickEnemyType(floorNum);
      // Per-type room caps — reroll among uncapped, floor-eligible types if hit
      if ((typeCounts[type] || 0) >= (TYPE_CAPS[type] || 99)) {
        const open = ENEMY_TYPES_LIST.filter(t =>
          (typeCounts[t] || 0) < (TYPE_CAPS[t] || 99) &&
          !(ENEMY_WEIGHTS[t].minFloor && floorNum < ENEMY_WEIGHTS[t].minFloor)
        );
        type = open.length ? open[rndInt(0, open.length - 1)] : 'GUARD';
      }
      typeCounts[type] = (typeCounts[type] || 0) + 1;

      const ex=room.x+rnd(1,room.w-1), ey=room.y+rnd(1,room.h-1);
      const e = spawnEnemy(type,ex,ey,floorNum,room, !roomElite);
      if (e.elite) roomElite = true;
      enemies.push(e);
    }

    const itemCount=rndInt(0,2) + (room.hasLoot ? 2 : 0); // locked rooms get bonus loot
    for (let j=0;j<itemCount;j++) {
      const ix=room.x+rnd(1,room.w-1), iy=room.y+rnd(1,room.h-1);
      items.push(new Item(ix,iy));
    }

    // Special room bonuses
    if (rt==='medbay') {
      // Place a healing font (persistent heal tile) in center
      dungeon.map[room.cy][room.cx] = T.FLOOR; // keep walkable
      room.healFont = true; // flag checked during gameplay
    }
    if (rt==='shrine') {
      room.xpShrine = true;
    }
    if (rt==='vendor') {
      // Generate shop inventory for this vendor room
      room.shopItems = generateShopItems(floorNum, game.player, dungeon);
      room.vendorVisited = false;
    }
  }

  // Place key items from dungeon generator
  if (dungeon.keyItems) {
    for (const ki of dungeon.keyItems) {
      items.push(new KeyItem(ki.x, ki.y, ki.colour, ki.tileColour));
    }
  }
}

// ─── Game State Machine ───────────────────────────────────────────────────────
const game = {
  state: 'MENU',
  difficulty: loadMeta().lastDifficulty || 'NORMAL',
  floor: 1,
  player: null,
  dungeon: null,
  fadeAlpha: 0,
  fadeDir: 0,
  fadeCallback: null,
  fadeNextState: null,
  fadeTime: 0,
  fadeHold: 0,
  fadeGlitchBars: [],
  fadeGlitchTimer: 0,
  transitionText: '',
  menuParticles: [],
  bossRoom: null,
  bossEntrances: [],
  bossSealed: false,
  bossAlive: false,
  modifier: null,
  bossesCleared: 0,
  msgList: [],
  nameEntry: null,
  lastSavedRank: -1,
  quest: null, // current floor objective
  hint: null,  // proximity hint {text, colour} — set per-frame, rendered with pulse
  shopRoom: null,     // room currently being shopped in
  shopSelected: 0,    // keyboard selection index in shop
  shopClosing: false,  // true during auto-close delay after last purchase
  currentLore: null,   // lore text being displayed in READING state

  msg(text,colour) {
    messages.push({text,colour:colour||'#e0e0ff',life:3});
  },

  setState(s, callback) {
    this.state=s;
    if (s === 'MENU') this.menuSel = 0;
    if (callback) callback();
  },

  fadeTo(text, callback, nextState) {
    this.state='FADE';
    this.transitionText=text;
    this.fadeAlpha=0;
    this.fadeDir=1;
    this.fadeTime=0;
    this.fadeHold=0;
    this.fadeGlitchBars=[];
    this.fadeGlitchTimer=0;
    this.fadeCallback=callback;
    this.fadeNextState=nextState||null;
    audio.transition();
  },

  init() {
    this.player=new Player();
    this.loadFloor(1);
  },

  loadFloor(n, savedModifier) {
    this.floor=n;
    this.floorTime=0; // arc grid phase timer
    // Roll or restore floor modifier
    if (savedModifier !== undefined) {
      this.modifier = savedModifier;
    } else if (n === 1 || n === 3 || n === 6 || n === 10) {
      this.modifier = null;
    } else {
      this.modifier = MODIFIER_KEYS[rndInt(0, MODIFIER_KEYS.length - 1)];
    }
    // Strip floor-only shield bonus from previous floor
    this.player.def-=this.player.shieldBonus;
    this.player.shieldBonus=0;
    this.player.autoLaserBeam=null; // clear stale beam from previous floor
    this.dungeon=generateFloor(n);
    // Reset boss state before populating (populateFloor sets them for boss floors)
    this.bossRoom=null;
    this.bossEntrances=[];
    this.bossSealed=false;
    this.bossAlive=false;
    populateFloor(this.dungeon,n);
    this.player.x=this.dungeon.playerPos.x;
    this.player.y=this.dungeon.playerPos.y;
    messages=[];
    this.msg('FLOOR '+n,'#ff00c8');
    if (n===3||n===6||n===10) {
      setTimeout(()=>{ audio.bossEnter(); this.msg('⚠ BOSS DETECTED','#ff3333'); },500);
    }
    // Announce modifier
    if (this.modifier) {
      const m = getMod();
      setTimeout(()=>this.msg(m.icon+' '+m.label+': '+m.desc, m.colour), 300);
    }
    // Generate floor quest
    this.generateQuest(n);
    // Auto-save at start of each floor
    this.saveGame();
  },

  generateQuest(floorNum) {
    const questTypes = [
      { id:'EXTERMINATE', label:'Exterminate all enemies', check: ()=>enemies.length===0,
        reward: ()=>{ this.player.score+=200*floorNum; this.msg('Quest complete! +'+200*floorNum+' pts','#39ff14'); }},
      { id:'EXPLORE', label:'Visit every room', check: ()=>{
          const d=this.dungeon;
          return d.rooms.every(r=>r.roomType==='secret' && !r.secretRevealed || d.visited[r.cy]?.[r.cx]);
        },
        reward: ()=>{ this.player.gainXP(40+floorNum*8); this.msg('Quest complete! +XP','#39ff14'); }},
      { id:'SPEEDRUN', label:'Reach stairs in 60s', timer:60, check: function(){
          const tx=Math.floor(game.player.x), ty=Math.floor(game.player.y);
          return game.dungeon.map[ty]?.[tx]===T.STAIRS||game.dungeon.map[ty]?.[tx]===T.TERMINAL;
        },
        reward: ()=>{ this.player.hp=this.player.maxHp; this.msg('Quest complete! Full heal!','#39ff14'); }},
      { id:'PACIFIST', label:'Reach stairs without killing', kills:0, check: function(){
          const tx=Math.floor(game.player.x), ty=Math.floor(game.player.y);
          return (game.dungeon.map[ty]?.[tx]===T.STAIRS||game.dungeon.map[ty]?.[tx]===T.TERMINAL) && this.kills===0;
        },
        reward: ()=>{ this.player.score+=500*floorNum; this.msg('Pacifist bonus! +'+500*floorNum+' pts','#39ff14'); }},
    ];
    // Boss floors always get EXTERMINATE
    if (floorNum===3||floorNum===6||floorNum===10) {
      this.quest = {...questTypes[0], done:false, failed:false};
    } else {
      const q = questTypes[rndInt(0, questTypes.length-1)];
      this.quest = {...q, done:false, failed:false};
    }
    setTimeout(()=>this.msg('⚡ '+this.quest.label,'#39ff14'), 800);
  },

  startGame() {
    audio.resume();
    // Persist selected difficulty for future sessions
    const meta = loadMeta();
    meta.lastDifficulty = this.difficulty;
    saveMeta(meta);
    this.bossesCleared=0;
    combo.best=0;
    this.player=new Player();
    applyMetaToPlayer(this.player);
    this.loadFloor(1);
    this.setState('PLAYING');
  },

  descend() {
    if (this.floor>=10) {
      // victory
      audio.victory();
      this.player.score+=500*this.floor+Math.floor(this.player.hp)*10;
      this.endRun(true);
    } else {
      audio.descend();
      this.player.score+=500*this.floor+Math.floor(this.player.hp)*10;
      const next=this.floor+1;
      this.fadeTo('DESCENDING TO FLOOR '+next, ()=>{
        this.loadFloor(next);
      }, 'PLAYING');
    }
  },

  revealSecretRoom(sr) {
    sr.secretRevealed = true;
    const dungeon = this.dungeon;
    // Clear secret mask so lighting/visited works
    for (let ty=sr.y; ty<sr.y+sr.h; ty++)
      for (let tx=sr.x; tx<sr.x+sr.w; tx++)
        dungeon.secretMask[ty][tx] = 0;
    // Convert any remaining cracked tiles around the room to floor
    for (let ty=Math.max(0,sr.y-1); ty<Math.min(MAP_H,sr.y+sr.h+1); ty++)
      for (let tx=Math.max(0,sr.x-1); tx<Math.min(MAP_W,sr.x+sr.w+1); tx++)
        if (dungeon.map[ty][tx]===T.CRACKED) dungeon.map[ty][tx]=T.FLOOR;
    // Spawn enemies (reduced count — it's a bonus room)
    const floorNum = this.floor;
    const minE = 1 + Math.floor(floorNum / 4);
    const maxE = Math.min(4, 2 + Math.floor(floorNum / 3));
    const areaCap = Math.floor(sr.w * sr.h / 10);
    let count = Math.min(areaCap, rndInt(minE, maxE));
    if (game.modifier === 'SWARM') count = Math.min(areaCap, Math.ceil(count * 1.5));
    for (let j=0; j<count; j++) {
      const type = pickEnemyType(floorNum);
      const ex = sr.x + rnd(1, sr.w - 1), ey = sr.y + rnd(1, sr.h - 1);
      const e = spawnEnemy(type, ex, ey, floorNum, sr, true);
      enemies.push(e);
    }
    // Spawn premium loot: guaranteed upgrade item + bonus credits
    const itemCount = 2 + (sr.w * sr.h >= 40 ? 1 : 0);
    for (let j=0; j<itemCount; j++) {
      const ix = sr.x + rnd(1, sr.w - 1), iy = sr.y + rnd(1, sr.h - 1);
      items.push(new Item(ix, iy));
    }
    // Bonus credit pickup worth floor-scaled amount
    const secretCr = Math.round(20 * (1 + floorNum * 0.15) * getMetaCreditMultiplier() * getDiff().creditMul);
    this.player.credits += secretCr;
    this.msg('+' + secretCr + ' credits found!', '#39ff14');
    this.player.score += 300 * floorNum;
  },

  saveScore(name) {
    const scores=this.getScores();
    const entry={name:name||'ANON',score:this.player.score,floor:this.floor,date:new Date().toLocaleDateString()};
    scores.push(entry);
    scores.sort((a,b)=>b.score-a.score);
    this.lastSavedRank=scores.findIndex(s=>s===entry);
    scores.splice(10);
    try { localStorage.setItem('neonDungeonScores',JSON.stringify(scores)); } catch(e){}
  },

  endRun(victory) {
    this.deleteSave(); // run is over — clear save file
    // Award data fragments
    const earned = calcRunShards(this.floor, this.player.score, this.bossesCleared, victory);
    const meta = loadMeta();
    meta.shards += earned;
    meta.stats.totalRuns++;
    meta.stats.totalShards += earned;
    meta.stats.bestFloor = Math.max(meta.stats.bestFloor, this.floor);
    if (victory) meta.stats.victories++;
    saveMeta(meta);
    this.lastRunShards = earned;
    const scores=this.getScores();
    const testEntry={score:this.player.score};
    scores.push(testEntry);
    scores.sort((a,b)=>b.score-a.score);
    const rank=scores.findIndex(s=>s===testEntry);
    if (rank>=0 && rank<10) {
      this.nameEntry={name:'',rank,victory,cursorBlink:0};
      this.setState('NAME_ENTRY');
    } else {
      this.saveScore('ANON');
      this.setState(victory?'VICTORY':'GAME_OVER');
    }
  },

  getScores() {
    try { return JSON.parse(localStorage.getItem('neonDungeonScores'))||[]; } catch(e){return[];}
  },

  // ── Save / Load ────────────────────────────────────────────────────────
  hasSave() {
    try { return !!localStorage.getItem('neonDungeonSave'); } catch(e){return false;}
  },

  saveGame() {
    if (!this.player) return;
    const p = this.player;
    const weaponKey = WEAPON_KEYS.find(k => WEAPONS[k] === p.weapon) || 'PULSE_PISTOL';
    const save = {
      v: SAVE_VERSION,
      floor: this.floor,
      difficulty: this.difficulty,
      modifier: this.modifier,
      bossesCleared: this.bossesCleared,
      player: {
        hp:p.hp, maxHp:p.maxHp, atk:p.atk, def:p.def,
        level:p.level, xp:p.xp, weapon:weaponKey,
        upgrades:{...p.upgrades}, perks:{...p.perks},
        keys:{...p.keys}, shards:p.shards,
        permSpeedBonus:p.permSpeedBonus, score:p.score,
        energyShield:p.energyShield, energyShieldTimer:p.energyShieldTimer,
        credits:p.credits,
        loreRead:[...p.loreRead]
      }
    };
    try { localStorage.setItem('neonDungeonSave', JSON.stringify(save)); } catch(e){}
  },

  deleteSave() {
    try { localStorage.removeItem('neonDungeonSave'); } catch(e){}
  },

  continueGame() {
    combo.best=0;
    let save;
    try { save = JSON.parse(localStorage.getItem('neonDungeonSave')); } catch(e){ save = null; }
    if (!save || !save.player || save.v !== SAVE_VERSION) {
      this.deleteSave();
      this.startGame();
      this.msg('SAVE DATA CORRUPT — STARTED FRESH','#ff4444');
      return;
    }
    audio.resume();
    // Restore difficulty from save (old saves default to NORMAL)
    this.difficulty = DIFFICULTIES[save.difficulty] ? save.difficulty : 'NORMAL';
    const p = new Player();
    const s = save.player;
    p.hp=s.hp; p.maxHp=s.maxHp; p.atk=s.atk; p.def=s.def;
    p.level=s.level; p.xp=s.xp;
    p.weapon=WEAPONS[s.weapon]||WEAPONS.PULSE_PISTOL;
    p.upgrades=s.upgrades||{};
    p.perks=s.perks||{};
    p.keys=s.keys||{red:0,blue:0,gold:0};
    p.shards=s.shards||0;
    p.permSpeedBonus=s.permSpeedBonus||0;
    p.score=s.score||0;
    p.energyShield=!!s.energyShield;
    p.energyShieldTimer=s.energyShieldTimer||0;
    p.credits=s.credits||0;
    p.loreRead=new Set(s.loreRead||[]);
    p.shieldBonus=0; // loadFloor will manage floor-only bonuses
    // Recompute perks from level — handles saves from before new perks existed
    for (let lv = 1; lv <= p.level; lv++) checkPerkUnlocks(p, lv);
    this.bossesCleared=Math.max(0, Math.floor(Number(save.bossesCleared) || 0));
    this.player=p;
    const savedMod = save.modifier != null && FLOOR_MODIFIERS[save.modifier] ? save.modifier : null;
    this.loadFloor(save.floor||1, savedMod);
    this.setState('PLAYING');
    this.msg('RUN RESUMED — FLOOR '+this.floor,'#00f5ff');
  },

  update(dt) {
    switch(this.state) {
      case 'MENU':        this.updateMenu(dt);    break;
      case 'PLAYING':     this.updatePlaying(dt); break;
      case 'PAUSED':      this.updatePaused();    break;
      case 'POWERUP_CHOICE': this.updatePowerupChoice(); break;
      case 'SHOPPING':       this.updateShopping(); break;
      case 'READING':        this.updateReading(); break;
      case 'ARCHIVES':       this.updateArchives(); break;
      case 'FADE':        this.updateFade(dt);    break;
      case 'GAME_OVER':   this.updateGameOver();  break;
      case 'VICTORY':     this.updateVictory();   break;
      case 'NAME_ENTRY':  this.updateNameEntry(dt); break;
    }
  },

  getMenuOptions() {
    const opts = [];
    if (this.hasSave()) {
      let save; try { save = JSON.parse(localStorage.getItem('neonDungeonSave')); } catch(e){}
      const saveDiff = DIFFICULTIES[save?.difficulty] ? save.difficulty : 'NORMAL';
      opts.push({ label:`CONTINUE (FLOOR ${save?.floor||'?'} · ${saveDiff})`, action:()=>this.continueGame(), colour:'#00f5ff' });
    }
    const d = getDiff();
    opts.push({ label:`NEW GAME — ${d.label}  ◀▶`, action:()=>this.startGame(), colour:d.colour, isDiffRow:true });
    const meta = loadMeta();
    opts.push({ label:`NEURAL ARCHIVES (${meta.shards}◆)`, action:()=>{ audio.menuSelect(); this.archivesSel=0; this.setState('ARCHIVES'); }, colour:'#ffb700' });
    return opts;
  },

  updateMenu(dt) {
    // animate bg particles
    this.menuParticles=this.menuParticles||[];
    if (Math.random()<0.3) {
      this.menuParticles.push({
        x:Math.random()*W, y:H, vx:(Math.random()-0.5)*20,
        vy:-rnd(20,60), life:1, col:['#00f5ff','#ff00c8','#39ff14','#ffb700'][rndInt(0,3)]
      });
    }
    for (let i=this.menuParticles.length-1;i>=0;i--) {
      const p=this.menuParticles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*0.4;
      if (p.life<=0||p.y<-10) this.menuParticles.splice(i,1);
    }
    const opts = this.getMenuOptions();
    const n = opts.length;
    if (this.menuSel === undefined || this.menuSel >= n) this.menuSel = 0;
    if (jp('ArrowUp')||jp('KeyW'))   this.menuSel = (this.menuSel - 1 + n) % n;
    if (jp('ArrowDown')||jp('KeyS')) this.menuSel = (this.menuSel + 1) % n;
    // Left/Right cycles difficulty on the NEW GAME row
    if (opts[this.menuSel]?.isDiffRow && (jp('ArrowLeft')||jp('KeyA')||jp('ArrowRight')||jp('KeyD'))) {
      const idx = DIFF_ORDER.indexOf(this.difficulty);
      const dir = (jp('ArrowRight')||jp('KeyD')) ? 1 : -1;
      this.difficulty = DIFF_ORDER[(idx + dir + DIFF_ORDER.length) % DIFF_ORDER.length];
      audio.menuSelect();
    }
    if (jp('Enter')||jp('MouseLeft')) {
      audio.menuSelect();
      opts[this.menuSel].action();
    }
  },

  updatePlaying(dt) {
    const player=this.player;
    const dungeon=this.dungeon;
    this.floorTime = (this.floorTime || 0) + dt;
    this.hint = null;

    player.update(dt,dungeon.map);

    const cam=getCamera(player);

    // sync touch aim: synthesise a mouse position far in the joystick direction
    if (touch.aim.active) {
      mouse.down = touch.aim.shooting;
      if (touch.aim.dx !== 0 || touch.aim.dy !== 0) {
        mouse.x = player.x * TILE - cam.x + touch.aim.dx * 300;
        mouse.y = player.y * TILE - cam.y + touch.aim.dy * 300;
      }
    }

    // aim with mouse
    const worldAimX=(mouse.x+cam.x)/TILE;
    const worldAimY=(mouse.y+cam.y)/TILE;
    const [afx,afy]=norm(worldAimX-player.x,worldAimY-player.y);
    if (afx||afy) player.facing={x:afx,y:afy};

    // shoot
    if ((mouse.down||keys.has('Space')) && player.shootCooldown<=0) {
      player.shoot(worldAimX,worldAimY,dungeon.map);
    }

    // update enemies
    for (const e of enemies) e.update(dt,player,dungeon.map);

    // update projectiles
    for (let i=projectiles.length-1;i>=0;i--) {
      projectiles[i].update(dt,dungeon.map,player,enemies);
      if (projectiles[i].dead) projectiles.splice(i,1);
    }

    // update hazard zones (grenade AoE)
    updateHazardZones(dt, player);

    // update items
    for (const it of items) it.update(dt);

    // item pickup → keys go to inventory, upgrades trigger choice UI
    for (let i=items.length-1;i>=0;i--) {
      const it=items[i];
      if (!it.dead && dist(player.x,player.y,it.x,it.y)<0.7) {
        audio.pickup();
        items.splice(i,1);
        if (it.isKey) {
          player.keys[it.colour]++;
          this.msg('Found '+it.colour.toUpperCase()+' KEY!', it.tileColour);
          continue;
        }
        // Generate 2 upgrade options
        const optA = pickUpgradeOption(null);
        const optB = pickUpgradeOption(optA.id);
        this.powerupChoice = { options:[optA, optB], selected:0 };
        this.setState('POWERUP_CHOICE');
        return; // freeze gameplay immediately
      }
    }

    // remove dead enemies
    for (let i=enemies.length-1;i>=0;i--) {
      if (enemies[i].dead) enemies.splice(i,1);
    }

    // flush deferred enemy spawns (e.g. SPLITTER → SHARDs)
    if (pendingEnemySpawns.length) {
      for (const s of pendingEnemySpawns) {
        enemies.push(spawnEnemy(s.type, s.x, s.y, s.floor, s.room, false));
      }
      pendingEnemySpawns.length = 0;
    }

    // update lighting
    updateLighting(dungeon,player.x,player.y);
    updateParticles(dt);
    updateFloatingTexts(dt);
    updateShake(dt);
    updateCombo(dt);

    // ── Upgrade effects ──────────────────────────────────────────────────
    // Nano Regen
    const regenLvl = player.upgrades.NANO_REGEN||0;
    if (regenLvl > 0) player.hp = Math.min(player.maxHp, player.hp + regenLvl * dt);

    // Saw Blade orbitals
    const sawLvl = player.upgrades.SAW_BLADE||0;
    if (sawLvl > 0) {
      player.orbitalAngle += 3 * dt;
      // Tick down hit cooldowns
      for (const [e, cd] of player.orbitalHits) {
        player.orbitalHits.set(e, cd - dt);
        if (cd - dt <= 0) player.orbitalHits.delete(e);
      }
      for (let i=0; i<sawLvl; i++) {
        const a = player.orbitalAngle + (TWO_PI / sawLvl) * i;
        const bx = player.x + Math.cos(a) * 1.5;
        const by = player.y + Math.sin(a) * 1.5;
        for (const e of enemies) {
          if (e.dead || player.orbitalHits.has(e)) continue;
          if (dist(bx, by, e.x, e.y) < 0.6 && hasLOS(bx, by, e.x, e.y, dungeon.map)) {
            e.takeDamage(12, 'Saw Blade');
            player.orbitalHits.set(e, 0.5);
            spawnParticles(bx, by, 'SPARK', '#ff3333', 3);
          }
        }
      }
    }

    // Plasma Orb auto-spell
    const orbLvl = player.upgrades.PLASMA_ORB||0;
    if (orbLvl > 0) {
      const cd = 3 - (orbLvl - 1) * 0.7;
      player.spellTimers.plasmaOrb -= dt;
      if (player.spellTimers.plasmaOrb <= 0) {
        player.spellTimers.plasmaOrb = cd;
        // Find nearest enemy
        let nearest = null, nearD = 64;
        for (const e of enemies) {
          if (e.dead) continue;
          const d = dist(player.x, player.y, e.x, e.y);
          if (d < nearD) { nearD = d; nearest = e; }
        }
        if (nearest) {
          const [dx, dy] = norm(nearest.x - player.x, nearest.y - player.y);
          const p = new Projectile(player.x, player.y, dx, dy, 6, 25, 10, '#ff44cc', false, true, 'Plasma Orb');
          if (player.perks.PIERCING_ROUNDS) p.maxPierces+=1;
          p.homing = nearest;
          projectiles.push(p);
          spawnParticles(player.x, player.y, 'MUZZLE', '#ff44cc', 3);
        }
      }
    }

    // Auto-Laser perk — hitscan beam at nearest visible enemy
    if (player.perks.AUTO_LASER && player.hp > 0) {
      if (player.autoLaserBeam) {
        player.autoLaserBeam.timer -= dt;
        if (player.autoLaserBeam.timer <= 0) player.autoLaserBeam = null;
      }
      player.autoLaserTimer -= dt;
      if (player.autoLaserTimer <= 0) {
        let target = null, minD = 12;
        for (const e of enemies) {
          if (e.dead) continue;
          if (e.type === 'PHANTOM' && !e.visible) continue;
          const d = dist(player.x, player.y, e.x, e.y);
          if (d <= minD && hasLOS(player.x, player.y, e.x, e.y, dungeon.map)) {
            minD = d; target = e;
          }
        }
        if (target) {
          player.autoLaserTimer = 2.5;
          target.takeDamage(20, 'Auto-Laser');
          player.autoLaserBeam = {x1:player.x, y1:player.y, x2:target.x, y2:target.y, timer:0.15};
          spawnParticles(target.x, target.y, 'SPARK', '#ff2222', 5);
          audio.autoLaser();
        }
      }
    }


    // stairs / lore terminal interaction
    const tx=Math.floor(player.x), ty=Math.floor(player.y);
    const tile=dungeon.map[ty]?.[tx];

    if (tile===T.LORE) {
      if (jp('KeyE')) {
        const unseen = LORE_ENTRIES.map((_, i) => i).filter(i => !player.loreRead.has(i));
        const idx = unseen.length > 0 ? unseen[Math.floor(Math.random() * unseen.length)] : Math.floor(Math.random() * LORE_ENTRIES.length);
        player.loreRead.add(idx);
        this.currentLore = LORE_ENTRIES[idx];
        player.score += 50;
        this.msg('+50 DATA RECOVERED', '#ffb700');
        // Consume the terminal — single use
        dungeon.map[ty][tx] = T.FLOOR;
        audio.loreAccess();
        spawnParticles(player.x, player.y, 'SPARK', '#ffb700', 8);
        this.setState('READING');
        return;
      }
      this.hint={text: isTouchDevice() ? 'Tap E to access data terminal' : 'Press E to access data terminal',colour:'#ffb700'};
    }

    const bossBlocking = tile===T.TERMINAL && this.bossAlive;
    if ((tile===T.STAIRS||tile===T.TERMINAL) && !bossBlocking && jp('KeyE')) {
      this.descend();
    }
    if (tile===T.STAIRS) this.hint={text:'Press E to descend',colour:'#ffff00'};
    if (tile===T.TERMINAL && bossBlocking) this.hint={text:'CORE terminal locked — destroy OMEGA CORE first',colour:'#ff3333'};
    if (tile===T.TERMINAL && !bossBlocking) this.hint={text:'Press E to interface with CORE terminal',colour:'#00f5ff'};

    // door interaction (check adjacent tiles when pressing E)
    if (jp('KeyE')) {
      const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
      for (const [ddx,ddy] of dirs) {
        const dx=tx+ddx, dy=ty+ddy;
        if (dx<0||dy<0||dx>=MAP_W||dy>=MAP_H) continue;
        const dt=dungeon.map[dy][dx];
        if (dt===T.CRACKED) {
          dungeon.map[dy][dx]=T.FLOOR;
          audio.wallBreak();
          spawnParticles(dx+0.5, dy+0.5, 'EXPLOSION', '#ffb700', 12);
          this.msg('SECRET AREA DISCOVERED','#ffb700');
          // Reveal the secret room — cracked tile is on room boundary
          for (const sr of dungeon.secretRooms) {
            if (sr.secretRevealed) continue;
            // Cracked tile is on room edge or 1 tile outside it
            if (dx >= sr.x-1 && dx <= sr.x+sr.w && dy >= sr.y-1 && dy <= sr.y+sr.h) {
              this.revealSecretRoom(sr);
              break;
            }
          }
          break;
        }
        if (dt===T.DOOR) {
          dungeon.map[dy][dx]=T.DOOR_OPEN;
          this.msg('Door opened','#aa8844');
          spawnParticles(dx+0.5, dy+0.5, 'SPARK', '#aa8844', 4);
          break;
        }
        if (isDoor(dt)) {
          const kc=doorKeyColour(dt);
          if (player.keys[kc] > 0) {
            player.keys[kc]--;
            dungeon.map[dy][dx]=T.DOOR_OPEN;
            this.msg('Unlocked '+kc+' door!', dt===T.LOCKED_R?'#ff3333':dt===T.LOCKED_B?'#3388ff':'#ffcc00');
            spawnParticles(dx+0.5, dy+0.5, 'EXPLOSION', dt===T.LOCKED_R?'#ff3333':dt===T.LOCKED_B?'#3388ff':'#ffcc00', 8);
            break;
          } else {
            this.msg('Need '+kc.toUpperCase()+' KEY', dt===T.LOCKED_R?'#ff3333':dt===T.LOCKED_B?'#3388ff':'#ffcc00');
          }
        }
      }
    }
    // door / cracked wall prompt
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    for (const [ddx,ddy] of dirs) {
      const dx=tx+ddx, dy=ty+ddy;
      if (dx<0||dy<0||dx>=MAP_W||dy>=MAP_H) continue;
      const dt=dungeon.map[dy][dx];
      if (dt===T.CRACKED) { this.hint={text:'Faint cracks... (press E)',colour:'#ffb700'}; break; }
      if (dt===T.DOOR) { this.hint={text:'Press E to open door',colour:'#aa8844'}; break; }
      if (isDoor(dt)) { const kc=doorKeyColour(dt); this.hint={text:'Need '+kc.toUpperCase()+' KEY (press E)', colour:dt===T.LOCKED_R?'#ff3333':dt===T.LOCKED_B?'#3388ff':'#ffcc00'}; break; }
    }

    // trap triggering
    player.trapCooldown = Math.max(0, player.trapCooldown - dt);
    if (player.trapCooldown <= 0) {
      if (tile===T.TRAP_SPIKE) {
        const trapDmg = Math.round((8 + game.floor * 2) * getDiff().envDmg);
        player.takeDamage(trapDmg);
        player.trapCooldown = 1.0;
        this.msg('Spike trap! -'+trapDmg+' HP','#ff6644');
        spawnParticles(player.x, player.y, 'SPARK', '#ff6644', 5);
      } else if (tile===T.TRAP_SLOW) {
        player.speedBoost = -1.5;
        player.speedTimer = 3;
        player.trapCooldown = 3.0;
        this.msg('Slow trap!','#8866ff');
        spawnParticles(player.x, player.y, 'SPARK', '#8866ff', 4);
      }
    }

    // environmental hazards (separate from traps — own cooldowns, bypass armor)
    if (tile === T.PLASMA) {
      // Continuous burn: direct HP reduction, bypasses defense/invincibility
      const burnDps = (3 + this.floor) * getDiff().envDmg;
      player.hp = Math.max(0, player.hp - burnDps * dt);
      // Cosmetic throttle for messages, particles, and audio
      player.plasmaBurnTimer = Math.max(0, player.plasmaBurnTimer - dt);
      if (player.plasmaBurnTimer <= 0) {
        const dmgShown = Math.round(burnDps);
        this.msg('Plasma burn! -'+dmgShown+'/s','#ff6600');
        spawnParticles(player.x, player.y, 'SPARK', '#ff8800', 3);
        audio.plasmaBurn();
        player.plasmaBurnTimer = 0.5;
      }
      if (player.hp <= 0) { player.hp = 0; audio.gameOver(); this.endRun(false); }
    }
    player.arcCooldown = Math.max(0, player.arcCooldown - dt);
    if (tile === T.ARC && Math.sin((this.floorTime||0) * Math.PI) > 0 && player.arcCooldown <= 0) {
      // Periodic zap during active phase
      const zapDmg = Math.round((10 + this.floor * 2) * getDiff().envDmg);
      player.hp = Math.max(0, player.hp - zapDmg);
      player.arcCooldown = 0.8;
      player.flashTimer = 0.15;
      this.msg('Arc zap! -'+zapDmg+' HP','#44ccff');
      spawnParticles(player.x, player.y, 'SPARK', '#88eeff', 6);
      audio.arcZap();
      if (player.hp <= 0) { player.hp = 0; audio.gameOver(); this.endRun(false); }
    }

    // special room effects
    for (const r of dungeon.rooms) {
      if (r.healFont && player.x>=r.x && player.x<r.x+r.w && player.y>=r.y && player.y<r.y+r.h) {
        if (player.hp < player.maxHp) {
          player.hp = Math.min(player.maxHp, player.hp + 5 * dt);
          if (Math.random()<0.1) spawnParticles(player.x, player.y, 'SPARK', '#00ff88', 1);
        }
      }
      if (r.xpShrine && !r.shrineUsed && player.x>=r.x && player.x<r.x+r.w && player.y>=r.y && player.y<r.y+r.h) {
        if (dist(player.x,player.y,r.cx+0.5,r.cy+0.5)<1.5 && jp('KeyE')) {
          r.shrineUsed = true;
          const xp = 30 + game.floor * 10;
          player.gainXP(xp);
          this.msg('XP Shrine: +'+xp+' XP!','#aa00ff');
          spawnParticles(r.cx+0.5, r.cy+0.5, 'EXPLOSION', '#aa00ff', 15);
        }
        if (!r.shrineUsed && dist(player.x,player.y,r.cx+0.5,r.cy+0.5)<2) this.hint={text:'Press E at shrine',colour:'#aa00ff'};
      }
      if (r.shopItems && r.shopItems.some(i => !i.sold) && player.x>=r.x && player.x<r.x+r.w && player.y>=r.y && player.y<r.y+r.h) {
        if (dist(player.x,player.y,r.cx+0.5,r.cy+0.5)<1.5 && jp('KeyE')) {
          // Revalidate shop items (maxed upgrades, stale prices, unneeded keys)
          for (const si of r.shopItems) {
            if (si.sold) continue;
            if (si.persistent && player.upgrades[si.id] >= si.maxLevel) { si.sold = true; continue; }
            // Recalculate price for persistent upgrades (level may have changed)
            if (si.persistent && SHOP_PRICES[si.id]) si.price = shopPrice(si.id, this.floor, player.upgrades);
            // Mark key items as sold if player already has that colour
            if (si.id && si.id.startsWith('SHOP_KEY_')) {
              const kc = si.id.replace('SHOP_KEY_','').toLowerCase();
              if (player.keys[kc] > 0) si.sold = true;
            }
          }
          if (!r.shopItems.some(i => !i.sold)) continue; // all invalidated
          this.shopRoom = r;
          this.shopSelected = 0;
          this.shopClosing = false;
          audio.vendorOpen();
          this.setState('SHOPPING');
          return;
        }
        if (dist(player.x,player.y,r.cx+0.5,r.cy+0.5)<2) this.hint={text:'Press E at vendor',colour:'#39ff14'};
      }
    }

    // quest tracking
    if (this.quest && !this.quest.done && !this.quest.failed) {
      if (this.quest.timer !== undefined) {
        this.quest.timer -= dt;
        if (this.quest.timer <= 0) { this.quest.failed = true; this.msg('Quest failed!','#ff3333'); }
      }
      if (!this.quest.failed && this.quest.check()) {
        this.quest.done = true;
        this.quest.reward();
        spawnParticles(player.x, player.y, 'EXPLOSION', '#39ff14', 20);
      }
    }

    // pause
    if (jp('Escape')) this.setState('PAUSED');

    // boss seal check — seal when player is clearly inside the boss room
    if (this.bossRoom && !this.bossSealed && this.bossAlive) {
      const r = this.bossRoom;
      const onEntrance = this.bossEntrances.some(e =>
        Math.floor(player.x)===e.x && Math.floor(player.y)===e.y);
      if (!onEntrance &&
          player.x >= r.x && player.x < r.x + r.w &&
          player.y >= r.y && player.y < r.y + r.h) {
        this.bossSealed = true;
        for (const e of this.bossEntrances) {
          e.origTile = dungeon.map[e.y][e.x];
          dungeon.map[e.y][e.x] = T.WALL;
        }
        // Safety: nudge player off any sealed tile
        const ptx = Math.floor(player.x), pty = Math.floor(player.y);
        if (!isPassable(dungeon.map[pty]?.[ptx])) {
          player.x = r.cx + 0.5;
          player.y = r.cy + 0.5;
        }
        audio.roomSeal();
        this.msg('⚠ ROOM SEALED','#ff3333');
      }
    }

    // boss death — unseal room and update state
    if (this.bossAlive && !enemies.some(e=>e.isBoss && !e.dead)) {
      this.bossAlive=false;
      // Restore entrance tiles
      if (this.bossSealed) {
        for (const e of this.bossEntrances) {
          if (e.origTile !== undefined) { dungeon.map[e.y][e.x] = e.origTile; delete e.origTile; }
        }
        audio.roomUnseal();
      }
      this.bossSealed=false;
      const bossNames={3:'SENTINEL MK-I',6:'NEURAL HIVE',10:'OMEGA CORE'};
      game.msg((bossNames[this.floor]||'BOSS')+' DESTROYED','#39ff14');
    }
  },

  updatePaused() {
    if (jp('Escape')) { audio.menuSelect(); this.setState('PLAYING'); }
    else if (jp('KeyQ')) { audio.menuSelect(); this.setState('MENU'); }
  },

  updatePowerupChoice() {
    const pc = this.powerupChoice;
    if (!pc) { this.setState('PLAYING'); return; }
    // Keyboard: left/right to select, 1/2 for direct pick, 3/Escape to skip
    if (jp('ArrowLeft') || jp('KeyA'))  pc.selected = 0;
    if (jp('ArrowRight')|| jp('KeyD'))  pc.selected = 1;
    if (jp('Digit1')) { pc.selected=0; this.applyPowerupChoice(0); return; }
    if (jp('Digit2')) { pc.selected=1; this.applyPowerupChoice(1); return; }
    if (jp('Digit3') || jp('Escape') || jp('KeyQ')) { this.applyPowerupChoice(-1); return; }
    if (jp('Enter') || jp('Space'))    { this.applyPowerupChoice(pc.selected); return; }
    // Mouse/touch: check click on cards or skip
    if (jp('MouseLeft')) {
      const cw = Math.min(280, W * 0.35);
      const gap = 30;
      const totalW = cw * 2 + gap;
      const startX = (W - totalW) / 2;
      const cardY = H * 0.28;
      const cardH = Math.min(220, H * 0.38);
      const mx = mouse.x, my = mouse.y;
      // Card 0
      if (mx >= startX && mx <= startX + cw && my >= cardY && my <= cardY + cardH) {
        this.applyPowerupChoice(0); return;
      }
      // Card 1
      if (mx >= startX + cw + gap && mx <= startX + totalW && my >= cardY && my <= cardY + cardH) {
        this.applyPowerupChoice(1); return;
      }
      // Skip button
      const skipY = cardY + cardH + 25;
      const skipW = 160, skipH = 40;
      if (mx >= (W-skipW)/2 && mx <= (W+skipW)/2 && my >= skipY && my <= skipY+skipH) {
        this.applyPowerupChoice(-1); return;
      }
    }
  },

  applyPowerupChoice(idx) {
    const pc = this.powerupChoice;
    if (idx >= 0 && idx < pc.options.length) {
      const opt = pc.options[idx];
      opt.fn(this.player);
      audio.menuSelect();
      this.msg('Chose ' + opt.name, opt.colour);
    } else {
      this.msg('Skipped upgrade', '#666688');
    }
    this.powerupChoice = null;
    this.setState('PLAYING');
  },

  // ─── Vendor Shop ─────────────────────────────────────────────────────────
  updateShopping() {
    const room = this.shopRoom;
    if (!room || !room.shopItems) { this.setState('PLAYING'); return; }
    const items = room.shopItems;
    // If all sold, wait for auto-close timer (set in tryShopBuy)
    if (this.shopClosing || items.every(i => i.sold)) return;

    // Keyboard navigation
    if (jp('Escape') || jp('KeyQ')) { audio.menuSelect(); this.setState('PLAYING'); return; }
    if (jp('ArrowLeft') || jp('KeyA'))  this.shopSelected = Math.max(0, this.shopSelected - 1);
    if (jp('ArrowRight')|| jp('KeyD'))  this.shopSelected = Math.min(2, this.shopSelected + 1);

    // Direct buy by number
    for (let i = 0; i < 3; i++) {
      if (jp('Digit' + (i + 1)) && !items[i].sold) {
        this.tryShopBuy(i);
        return;
      }
    }
    // Enter on selected
    if (jp('Enter') || jp('Space')) {
      if (!items[this.shopSelected].sold) this.tryShopBuy(this.shopSelected);
      return;
    }

    // Mouse/touch click on cards or leave button
    if (jp('MouseLeft')) {
      const narrow = layout.compact;
      const cw = Math.min(200, W * 0.28);
      const gap = 16;
      const totalW = cw * 3 + gap * 2;
      const startX = (W - totalW) / 2;
      const cardY = H * 0.22;
      const cardH = Math.min(200, H * 0.38);
      const mx = mouse.x, my = mouse.y;

      for (let i = 0; i < 3; i++) {
        const cx = startX + i * (cw + gap);
        if (!items[i].sold && mx >= cx && mx <= cx + cw && my >= cardY && my <= cardY + cardH) {
          this.tryShopBuy(i);
          return;
        }
      }
      // Leave button
      const leaveY = cardY + cardH + 20;
      const leaveW = 160, leaveH = 40;
      if (mx >= (W - leaveW) / 2 && mx <= (W + leaveW) / 2 && my >= leaveY && my <= leaveY + leaveH) {
        audio.menuSelect();
        this.setState('PLAYING');
        return;
      }
    }
  },

  tryShopBuy(idx) {
    const item = this.shopRoom.shopItems[idx];
    if (!item || item.sold) return;
    if (this.player.credits < item.price) {
      audio.purchaseFail();
      this.msg('Not enough credits!', '#ff3333');
      return;
    }
    this.player.credits -= item.price;
    item.fn(this.player);
    item.sold = true;
    audio.purchase();
    this.msg('Bought ' + item.name, item.colour);
